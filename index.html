<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>ギフトで着せ替え</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Noto Sans JP",
    sans-serif;
  background:#f7f3ff;
}

button{
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}

#app{
  width:100%;
  height:100%;
  max-width:600px;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:linear-gradient(
    180deg,
    #fffaff 0%,
    #f6f0ff 100%
  );
}

/* =========================
   HEADER
========================= */

.header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid #eadff5;
  position:relative;
  z-index:20;
}

.headerTitle{
  font-size:19px;
  font-weight:900;
  color:#6a3fa0;
}

/* =========================
   MAIN
========================= */

.main{
  height:calc(100% - 58px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================
   CHARACTER
========================= */

.characterArea{
  flex:1;
  min-height:0;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 10px 0;
  overflow:hidden;
}

.characterStage{
  width:100%;
  height:100%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.layer{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  max-width:94%;
  max-height:96%;
  width:auto;
  height:auto;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
}

/* レイヤー順 */

#baseLayer{
  z-index:1;
}

#bottomLayer{
  z-index:2;
}

#topLayer{
  z-index:3;
}

#onepieceLayer{
  z-index:4;
}

#dressLayer{
  z-index:5;
}

#outerLayer{
  z-index:6;
}

#hairLayer{
  z-index:7;
}

#accessoryLayer{
  z-index:8;
}

#shoesLayer{
  z-index:9;
}

/* =========================
   CATEGORY
========================= */

.categoryArea{
  height:128px;
  flex-shrink:0;
  padding:7px 8px 8px;
  background:rgba(255,255,255,.97);
  border-top:1px solid #eadff5;
}

.categoryGrid{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:6px;
}

.categoryBtn{
  border:0;
  border-radius:13px;
  background:#f0e7ff;
  color:#633895;
  font-weight:900;
  font-size:13px;
  box-shadow:
    0 2px 5px rgba(100,70,130,.12);
  cursor:pointer;
}

.categoryBtn:active{
  transform:scale(.96);
}

.categoryBtn.active{
  background:#8e55d9;
  color:#fff;
}

/* =========================
   BOTTOM MENU
========================= */

.bottomMenu{
  height:58px;
  flex-shrink:0;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  padding:7px 8px;
  background:#fff;
  border-top:1px solid #eadff5;
}

.menuBtn{
  border:0;
  border-radius:13px;
  background:#eee6fa;
  color:#613b88;
  font-size:13px;
  font-weight:900;
}

.menuBtn:active{
  transform:scale(.97);
}

/* =========================
   MODAL
========================= */

.modal{
  position:absolute;
  inset:0;
  z-index:100;
  background:rgba(34,20,45,.48);
  display:none;
  align-items:flex-end;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-height:92%;
  background:#fff;
  border-radius:22px 22px 0 0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* =========================
   MODAL TITLE
========================= */

.modalTitle{
  height:58px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border-bottom:1px solid #eee;
  font-size:18px;
  font-weight:900;
  color:#573174;
}

.closeBtn{
  position:absolute;
  right:10px;
  top:10px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#f1eafa;
  color:#62398b;
  font-size:22px;
  font-weight:900;
}

/* =========================
   ITEM HEADER
========================= */

.itemHeader{
  height:58px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border-bottom:1px solid #eee;
  background:#fff;
}

.itemHeaderTitle{
  font-size:17px;
  font-weight:900;
  color:#573174;
}

.itemBack{
  position:absolute;
  left:9px;
  top:9px;
  height:40px;
  padding:0 13px;
  border:0;
  border-radius:12px;
  background:#eee6fa;
  color:#633895;
  font-weight:900;
}

/* =========================
   ITEM GRID
========================= */

.itemList{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:10px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  align-content:start;
  -webkit-overflow-scrolling:touch;
}

.itemCard{
  min-width:0;
  border:2px solid #eee5f6;
  border-radius:16px;
  background:#fff;
  padding:7px;
  position:relative;
  box-shadow:
    0 2px 8px rgba(90,50,120,.08);
}

.itemCard.selected{
  border-color:#9a62dd;
  box-shadow:
    0 0 0 2px rgba(154,98,221,.15);
}

.itemImageBox{
  width:100%;
  aspect-ratio:1/1;
  border-radius:12px;
  background:#faf8fc;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.itemImage{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.itemName{
  margin-top:5px;
  font-size:13px;
  font-weight:900;
  color:#4d385a;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:center;
}

/* 価格表示は残す */

.itemPrice{
  margin-top:3px;
  text-align:center;
  font-size:12px;
  font-weight:900;
  color:#8a5aaf;
}

.itemDelete{
  position:absolute;
  right:5px;
  top:5px;
  width:29px;
  height:29px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  color:#c45b72;
  font-size:15px;
  font-weight:900;
  box-shadow:
    0 2px 5px rgba(0,0,0,.12);
  z-index:3;
}

.empty{
  grid-column:1/-1;
  padding:40px 10px;
  text-align:center;
  color:#987fa8;
  font-size:14px;
  font-weight:700;
}

/* =========================
   FORM
========================= */

.formArea{
  padding:16px;
  overflow-y:auto;
}

.formLabel{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:900;
  color:#573174;
}

.formInput,
.formSelect{
  width:100%;
  height:45px;
  border:1px solid #ded2e8;
  border-radius:11px;
  padding:0 11px;
  margin-bottom:14px;
  font-size:15px;
  outline:none;
  background:#fff;
}

.formInput:focus,
.formSelect:focus{
  border-color:#9460cf;
}

.fileInput{
  width:100%;
  margin-bottom:14px;
}

.saveBtn{
  width:100%;
  height:48px;
  border:0;
  border-radius:13px;
  background:#8e55d9;
  color:#fff;
  font-size:15px;
  font-weight:900;
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-height:700px){

  .categoryArea{
    height:112px;
  }

  .bottomMenu{
    height:52px;
  }

  .categoryBtn{
    font-size:12px;
  }

}

@media(min-width:601px){

  #app{
    border-left:1px solid #eadff5;
    border-right:1px solid #eadff5;
  }

}
</style>
</head>

<body>

<div id="app">

  <!-- =====================
       HEADER
  ====================== -->

  <header class="header">

    <div class="headerTitle">
      🎀 ギフトで着せ替え
    </div>

  </header>


  <!-- =====================
       MAIN
  ====================== -->

  <main class="main">

    <!-- CHARACTER -->

    <section class="characterArea">

      <div class="characterStage">

        <img
          id="baseLayer"
          class="layer"
          alt=""
        >

        <img
          id="bottomLayer"
          class="layer"
          alt=""
        >

        <img
          id="topLayer"
          class="layer"
          alt=""
        >

        <img
          id="onepieceLayer"
          class="layer"
          alt=""
        >

        <img
          id="dressLayer"
          class="layer"
          alt=""
        >

        <img
          id="outerLayer"
          class="layer"
          alt=""
        >

        <img
          id="hairLayer"
          class="layer"
          alt=""
        >

        <img
          id="accessoryLayer"
          class="layer"
          alt=""
        >

        <img
          id="shoesLayer"
          class="layer"
          alt=""
        >

      </div>

    </section>


    <!-- CATEGORY -->

    <section class="categoryArea">

      <div class="categoryGrid">

        <button
          class="categoryBtn"
          data-category="top">
          👚 トップス
        </button>

        <button
          class="categoryBtn"
          data-category="onepiece">
          👗 ワンピース
        </button>

        <button
          class="categoryBtn"
          data-category="dress">
          ✨ ドレス
        </button>

        <button
          class="categoryBtn"
          data-category="bottom">
          👖 ボトムス
        </button>

        <button
          class="categoryBtn"
          data-category="outer">
          🧥 アウター
        </button>

        <button
          class="categoryBtn"
          data-category="hair">
          💇‍♀️ ヘア
        </button>

        <button
          class="categoryBtn"
          data-category="accessory">
          💎 アクセ
        </button>

        <button
          class="categoryBtn"
          data-category="shoes">
          👠 靴
        </button>

      </div>

    </section>


    <!-- BOTTOM MENU -->

    <section class="bottomMenu">

      <button
        class="menuBtn"
        id="baseSettingBtn">
        👤 キャラ設定
      </button>

      <button
        class="menuBtn"
        id="itemSettingBtn">
        ➕ アイテム追加
      </button>

    </section>

  </main>


  <!-- =====================
       ITEM MODAL
  ====================== -->

  <div

    <div class="modalBox">

  <!-- =====================
       BASE SETTING
  ====================== -->

  <div
    class="modal"
    id="baseModal">

    <div class="modalBox">

      <div class="modalTitle">

        キャラクター設定

        <button
          class="closeBtn"
          data-close="baseModal">
          ×
        </button>

      <div class="formArea">

        <label class="formLabel">
          キャラクター画像
        </label>

        <input
          type="file"
          id="baseFile"
          class="fileInput"
          accept="image/*">

        <button
          class="saveBtn"
          id="baseSaveBtn">
          キャラクターを設定
        </button>

      </div>

    </div>

  </div>


  <!-- =====================
       ITEM SETTING
  ====================== -->

  <div
    class="modal"
    id="settingModal">

    <div class="modalBox">

      <div class="modalTitle">

        アイテム追加

        <button
          class="closeBtn"
          data-close="settingModal">
          ×
        </button>

      </div>

      <div class="formArea">

        <label class="formLabel">
          アイテム名
        </label>

        <input
          type="text"
          id="itemName"
          class="formInput"
          placeholder="例：プリンセスドレス">


        <label class="formLabel">
          カテゴリー
        </label>

        <select
          id="itemCategory"
          class="formSelect">

          <option value="top">
            トップス
          </option>

          <option value="onepiece">
            ワンピース
          </option>

          <option value="dress">
            ドレス
          </option>

          <option value="bottom">
            ボトムス
          </option>

          <option value="outer">
            アウター
          </option>

          <option value="hair">
            ヘア
          </option>

          <option value="accessory">
            アクセサリー
          </option>

          <option value="shoes">
            靴
          </option>

        </select>


        <!--
          価格は残す。
          ただし購入・消費には使用しない。
        -->

        <label class="formLabel">
          表示する価格（コイン）
        </label>

        <input
          type="number"
          id="itemPrice"
          class="formInput"
          min="0"
          value="100">


        <label class="formLabel">
          アイテム画像
        </label>

        <input
          type="file"
          id="itemFile"
          class="fileInput"
          accept="image/*">


        <button
          class="saveBtn"
          id="itemSaveBtn">
          アイテムを追加
        </button>

      </div>

    </div>

  </div>

</div>


<script>

/* ==================================================
   CATEGORY
================================================== */

const CATEGORIES = {

  top:"トップス",

  onepiece:"ワンピース",

  dress:"ドレス",

  bottom:"ボトムス",

  outer:"アウター",

  hair:"ヘア",

  accessory:"アクセサリー",

  shoes:"靴"

};


/* ==================================================
   DATA
================================================== */

let baseImage = "";

let items = [];

let equipped = {

  top:null,

  onepiece:null,

  dress:null,

  bottom:null,

  outer:null,

  hair:null,

  accessory:null,

  shoes:null

};

let currentCategory = "top";


/* ==================================================
   DOM
================================================== */

const baseLayer =
  document.getElementById("baseLayer");

const itemList =
  document.getElementById("itemList");

const itemModal =
  document.getElementById("itemModal");

const settingModal =
  document.getElementById("settingModal");

const baseModal =
  document.getElementById("baseModal");

const itemModalTitle =
  document.getElementById("itemModalTitle");


/* ==================================================
   LOCAL STORAGE
================================================== */

function saveData(){

  localStorage.setItem(
    "dressup_base",
    baseImage
  );

  localStorage.setItem(
    "dressup_items",
    JSON.stringify(items)
  );

  localStorage.setItem(
    "dressup_equipped",
    JSON.stringify(equipped)
  );

}


function loadData(){

  const savedBase =
    localStorage.getItem("dressup_base");

  const savedItems =
    localStorage.getItem("dressup_items");

  const savedEquipped =
    localStorage.getItem("dressup_equipped");


  if(savedBase){

    baseImage = savedBase;

  }


  if(savedItems){

    try{

      items = JSON.parse(savedItems);

    }catch(e){

      items = [];

    }

  }


  if(savedEquipped){

    try{

      equipped =
        JSON.parse(savedEquipped);

    }catch(e){

      equipped = {

        top:null,
        onepiece:null,
        dress:null,
        bottom:null,
        outer:null,
        hair:null,
        accessory:null,
        shoes:null

      };

    }

  }

}


/* ==================================================
   BASE
================================================== */

function renderBase(){

  if(baseImage){

    baseLayer.src =
      baseImage;

    baseLayer.style.display =
      "block";

  }else{

    baseLayer.removeAttribute(
      "src"
    );

    baseLayer.style.display =
      "none";

  }

}


/* ==================================================
   RENDER LAYER
================================================== */

function renderLayer(category){

  const layer =
    document.getElementById(
      category + "Layer"
    );

  if(!layer){
    return;
  }


  const id =
    equipped[category];


  if(!id){

    layer.removeAttribute(
      "src"
    );

    layer.style.display =
      "none";

    return;

  }


  const item =
    items.find(
      x => x.id === id
    );


  if(!item){

    layer.removeAttribute(
      "src"
    );

    layer.style.display =
      "none";

    return;

  }


  layer.src =
    item.image;

  layer.style.display =
    "block";

}


function renderAll(){

  renderBase();

  Object.keys(CATEGORIES)
    .forEach(category => {

      renderLayer(category);

    });

}


/* ==================================================
   TRANSPARENT PNG AUTO CROP
   ※表示用だけ
================================================== */

function trimTransparentImage(
  src,
  callback
){

  const img =
    new Image();

  img.onload =
    function(){

      try{

        const canvas =
          document.createElement(
            "canvas"
          );

        const ctx =
          canvas.getContext(
            "2d"
          );

        canvas.width =
          img.naturalWidth;

        canvas.height =
          img.naturalHeight;


        ctx.drawImage(
          img,
          0,
          0
        );


        const data =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          ).data;


        let minX =
          canvas.width;

        let minY =
          canvas.height;

        let maxX =
          -1;

        let maxY =
          -1;


        for(
          let y=0;
          y<canvas.height;
          y++
        ){

          for(
            let x=0;
            x<canvas.width;
            x++
          ){

            const alpha =
              data[
                (y * canvas.width + x) * 4 + 3
              ];


            if(alpha > 5){

              if(x < minX)
                minX = x;

              if(y < minY)
                minY = y;

              if(x > maxX)
                maxX = x;

              if(y > maxY)
                maxY = y;

            }

          }

        }


        if(maxX === -1){

          callback(src);

          return;

        }


        const width =
          maxX - minX + 1;

        const height =
          maxY - minY + 1;


        const cropCanvas =
          document.createElement(
            "canvas"
          );

        cropCanvas.width =
          width;

        cropCanvas.height =
          height;


        const cropCtx =
          cropCanvas.getContext(
            "2d"
          );


        cropCtx.drawImage(
          img,
          minX,
          minY,
          width,
          height,
          0,
          0,
          width,
          height
        );


        callback(
          cropCanvas.toDataURL(
            "image/png"
          )
        );


      }catch(e){

        callback(src);

      }

    };


  img.onerror =
    function(){

      callback(src);

    };


  img.src =
    src;

}


/* ==================================================
   CATEGORY BUTTON
================================================== */

document
  .querySelectorAll(".categoryBtn")
  .forEach(btn => {

    btn.addEventListener(
      "click",
      () => {

        currentCategory =
          btn.dataset.category;


        document
          .querySelectorAll(".categoryBtn")
          .forEach(x => {

            x.classList.remove(
              "active"
            );

          });


        btn.classList.add(
          "active"
        );


        openItemModal(
          currentCategory
        );

      }
    );

  });


/* ==================================================
   OPEN ITEM MODAL
================================================== */

function openItemModal(category){

  currentCategory =
    category;


  itemModalTitle.textContent =
    CATEGORIES[category];


  renderItemList();


  itemModal.classList.add(
    "show"
  );

}


function closeItemModal(){

  itemModal.classList.remove(
    "show"
  );

}


document
  .getElementById("itemBackBtn")
  .addEventListener(
    "click",
    closeItemModal
  );


/* ==================================================
   ITEM LIST
================================================== */

function renderItemList(){

  itemList.innerHTML =
    "";


  const categoryItems =
    items.filter(
      item =>
        item.category ===
        currentCategory
    );


  if(categoryItems.length === 0){

    itemList.innerHTML = `
      <div class="empty">
        このカテゴリーには<br>
        まだアイテムがありません
      </div>
    `;

    return;

  }


  categoryItems.forEach(
    item => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "itemCard";


      if(
        equipped[currentCategory] ===
        item.id
      ){

        card.classList.add(
          "selected"
        );

      }


      /* 画像 */

      const imageBox =
        document.createElement(
          "div"
        );

      imageBox.className =
        "itemImageBox";


      const image =
        document.createElement(
          "img"
        );

      image.className =
        "itemImage";

      image.alt =
        "";


      trimTransparentImage(
        item.image,
        trimmed => {

          image.src =
            trimmed;

        }
      );


      imageBox.appendChild(
        image
      );


      /* 名前 */

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "itemName";

      name.textContent =
        item.name;


      /* 価格 */

      const price =
        document.createElement(
          "div"
        );

      price.className =
        "itemPrice";

      price.textContent =
        `🪙 ${item.price}コイン`;


      /* 削除 */

      const deleteBtn =
        document.createElement(
          "button"
        );

      deleteBtn.className =
        "itemDelete";

      deleteBtn.textContent =
        "×";


      deleteBtn.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          deleteItem(
            item.id
          );

        }
      );


      card.appendChild(
        imageBox
      );

      card.appendChild(
        name
      );

      card.appendChild(
        price
      );

      card.appendChild(
        deleteBtn
      );


      /*
        タップするだけで着用。
        コインは消費しない。
      */

      card.addEventListener(
        "click",
        () => {

          wearItem(item);

        }
      );


      itemList.appendChild(
        card
      );

    }
  );

}


/* ==================================================
   WEAR ITEM
================================================== */

function wearItem(item){

  const category =
    item.category;


  /*
    同じアイテムを再タップ
    → 脱ぐ
  */

  if(
    equipped[category] ===
    item.id
  ){

    equipped[category] =
      null;


    saveData();

    renderAll();

    renderItemList();

    return;

  }


  /*
    コイン処理なし。
    価格は表示用のみ。
  */


  /* ワンピース */

  if(category === "onepiece"){

    equipped.onepiece =
      item.id;

    equipped.dress =
      null;

    equipped.top =
      null;

    equipped.bottom =
      null;

  }


  /* ドレス */

  else if(category === "dress"){

    equipped.dress =
      item.id;

    equipped.onepiece =
      null;

    equipped.top =
      null;

    equipped.bottom =
      null;

  }


  /* トップス */

  else if(category === "top"){

    equipped.top =
      item.id;

    equipped.onepiece =
      null;

    equipped.dress =
      null;

  }


  /* ボトムス */

  else if(category === "bottom"){

    equipped.bottom =
      item.id;

    equipped.onepiece =
      null;

    equipped.dress =
      null;

  }


  /* その他 */

  else{

    equipped[category] =
      item.id;

  }


  saveData();

  renderAll();

  renderItemList();

}


/* ==================================================
   DELETE ITEM
================================================== */

function deleteItem(id){

  const item =
    items.find(
      x => x.id === id
    );


  if(!item){
    return;
  }


  const ok =
    confirm(
      `「${item.name}」を削除しますか？`
    );


  if(!ok){
    return;
  }


  /*
    着用中なら解除
  */

  Object.keys(equipped)
    .forEach(category => {

      if(
        equipped[category] ===
        id
      ){

        equipped[category] =
          null;

      }

    });


  items =
    items.filter(
      x => x.id !== id
    );


  saveData();

  renderAll();

  renderItemList();

}


/* ==================================================
   ADD ITEM
================================================== */

document
  .getElementById("itemSaveBtn")
  .addEventListener(
    "click",
    () => {

      const name =
        document
          .getElementById(
            "itemName"
          )
          .value
          .trim();


      const category =
        document
          .getElementById(
            "itemCategory"
          )
          .value;


      /*
        価格は「表示用」。
        着用時には一切使用しない。
      */

      const price =
        Number(
          document
            .getElementById(
              "itemPrice"
            )
            .value
        );


      const file =
        document
          .getElementById(
            "itemFile"
          )
          .files[0];


      if(!name){

        alert(
          "アイテム名を入力してください"
        );

        return;

      }


      if(!file){

        alert(
          "アイテム画像を選択してください"
        );

        return;

      }


      if(
        !Number.isFinite(price) ||
        price < 0
      ){

        alert(
          "価格を正しく入力してください"
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(e){

          const item = {

            id:
              "item_" +
              Date.now() +
              "_" +
              Math.random()
                .toString(36)
                .slice(2),

            name:
              name,

            category:
              category,

            /*
              価格は表示するためだけに保存
            */

            price:
              price,

            image:
              e.target.result

          };


          items.push(
            item
          );


          saveData();


          /*
            入力リセット
          */

          document
            .getElementById(
              "itemName"
            )
            .value = "";


          document
            .getElementById(
              "itemPrice"
            )
            .value = "100";


          document
            .getElementById(
              "itemFile"
            )
            .value = "";


          settingModal
            .classList.remove(
              "show"
            );


          /*
            追加したカテゴリーを開く
          */

          currentCategory =
            category;


          document
            .querySelectorAll(
              ".categoryBtn"
            )
            .forEach(btn => {

              btn.classList.toggle(
                "active",
                btn.dataset.category ===
                category
              );

            });


          openItemModal(
            category
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );
