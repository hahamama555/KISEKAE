<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ギフトで着せ替え</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
  background:#f7edf5;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}


/* =================================
   アプリ
================================= */

.app{
  width:100vw;
  height:100vh;
  max-width:600px;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #fffaff,
      #f8edf7
    );
}


/* =================================
   ヘッダー
================================= */

.header{
  flex:0 0 54px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 12px;

  background:#fff;

  border-bottom:1px solid #eadbe7;

  z-index:50;
}

.title{
  font-size:17px;
  font-weight:900;
}

.coinBox{
  display:flex;
  align-items:center;
  gap:5px;

  padding:7px 12px;

  border-radius:20px;

  background:#fff0a8;

  font-size:14px;
  font-weight:900;
}


/* =================================
   キャラクターエリア
================================= */

.characterArea{
  position:relative;

  flex:1 1 auto;

  min-height:0;

  display:flex;

  justify-content:center;
  align-items:center;

  overflow:hidden;

  padding:4px;
}


/* =================================
   ステージ
================================= */

.stage{
  position:relative;

  width:100%;
  height:100%;

  max-width:520px;

  aspect-ratio:2 / 3;

  margin:auto;

  overflow:hidden;
}


/* =================================
   レイヤー
================================= */

.layer{
  position:absolute;

  left:50%;
  top:50%;

  width:100%;
  height:100%;

  transform:
    translate(-50%,-50%);

  object-fit:contain;
  object-position:center;

  pointer-events:none;

  display:none;
}


/* =================================
   レイヤー順
================================= */

#baseLayer{
  z-index:1;
}

#bottomLayer{
  z-index:2;
}

#onepieceLayer{
  z-index:3;
}

#dressLayer{
  z-index:4;
}

#topLayer{
  z-index:5;
}

#outerLayer{
  z-index:6;
}

#hairLayer{
  z-index:7;
}

#accessoryLayer{
  z-index:8;
}

#shoesLayer{
  z-index:9;
}


/* =================================
   特殊表示
================================= */

.onepieceOn #topLayer,
.onepieceOn #bottomLayer{
  display:none !important;
}

.dressOn #topLayer,
.dressOn #bottomLayer{
  display:none !important;
}


/*
   アウター着用時は
   トップスを完全に隠す
*/

.outerOn #topLayer{
  display:none !important;
}


/* =================================
   ベース未設定
================================= */

.emptyCharacter{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  width:90%;

  text-align:center;

  color:#a995a5;

  font-size:15px;
  font-weight:800;

  line-height:1.7;

  z-index:20;
}


/* =================================
   下部
================================= */

.controlArea{
  flex:0 0 auto;

  background:#fff;

  border-top:1px solid #eadbe7;

  padding:6px 7px 7px;

  z-index:40;
}


/* =================================
   メインボタン
================================= */

.mainButtons{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:6px;

  margin-bottom:6px;
}

.mainBtn{
  height:36px;

  border:none;

  border-radius:9px;

  background:#f0e3ee;

  color:#654e60;

  font-size:12px;
  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;
}

.mainBtn:active{
  transform:scale(.97);
}


/* =================================
   コイン
================================= */

.coinButtons{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:5px;

  margin-bottom:6px;
}

.coinBtn{
  height:29px;

  border:none;

  border-radius:8px;

  background:#fff0a8;

  color:#705d00;

  font-size:11px;
  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;
}


/* =================================
   タブ
================================= */

.tabs{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:4px;

  margin-bottom:6px;
}

.tab{
  height:32px;

  border:none;

  border-radius:8px;

  background:#eee6ed;

  color:#665663;

  font-size:11px;
  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;
}

.tab.active{
  background:#d85cae;
  color:#fff;
}


/* =================================
   アイテム一覧
================================= */

.items{
  width:100%;

  height:122px;

  display:flex;

  align-items:flex-start;

  gap:7px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:
    2px 2px 6px;

  -webkit-overflow-scrolling:touch;

  scrollbar-width:none;
}

.items::-webkit-scrollbar{
  display:none;
}


/* =================================
   アイテムカード
================================= */

.itemCard{
  position:relative;

  flex:0 0 88px;

  width:88px;
  height:112px;

  border:
    2px solid transparent;

  border-radius:11px;

  background:#faf7fa;

  overflow:hidden;

  cursor:pointer;

  touch-action:manipulation;

  user-select:none;

  -webkit-user-select:none;
}

.itemCard:active{
  transform:scale(.96);
}

.itemCard.selected{
  border-color:#d85cae;

  background:#fff0fa;

  box-shadow:
    0 0 0 2px
    rgba(216,92,174,.12);
}


/* =================================
   アイテム画像
================================= */

.itemImage{
  display:block;

  width:100%;
  height:68px;

  object-fit:contain;

  pointer-events:none;

  user-select:none;
}


/* =================================
   アイテム名
================================= */

.itemName{
  width:100%;

  height:22px;

  padding:
    2px 3px;

  text-align:center;

  font-size:10px;
  font-weight:800;

  line-height:18px;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  pointer-events:none;
}


/* =================================
   価格
================================= */

.itemPrice{
  width:100%;

  height:18px;

  text-align:center;

  font-size:10px;
  font-weight:900;

  color:#806700;

  line-height:18px;

  pointer-events:none;
}


/* =================================
   削除
================================= */

.removeItem{
  position:absolute;

  top:3px;
  right:3px;

  width:21px;
  height:21px;

  border:none;

  border-radius:50%;

  background:
    rgba(0,0,0,.58);

  color:#fff;

  font-size:13px;
  font-weight:900;

  line-height:21px;

  padding:0;

  z-index:10;

  cursor:pointer;

  touch-action:manipulation;
}


/* =================================
   アイテムなし
================================= */

.noItems{
  flex:1;

  min-width:100%;

  height:110px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#a697a4;

  font-size:12px;
  font-weight:700;
}


/* =================================
   モーダル
================================= */

.modal{
  position:fixed;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  padding:18px;

  background:
    rgba(0,0,0,.48);

  z-index:200;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:420px;

  max-height:90vh;

  overflow-y:auto;

  padding:18px;

  background:#fff;

  border-radius:18px;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.25);
}

.modalTitle{
  margin-bottom:14px;

  font-size:18px;
  font-weight:900;
}

.formGroup{
  margin-bottom:12px;
}

.formGroup label{
  display:block;

  margin-bottom:5px;

  font-size:13px;
  font-weight:800;
}

.formGroup input,
.formGroup select{
  width:100%;

  height:42px;

  padding:
    0 10px;

  border:
    1px solid #ddd;

  border-radius:9px;

  background:#fff;

  font-size:14px;
}


/* =================================
   プレビュー
================================= */

.preview{
  width:100%;
  height:150px;

  display:flex;

  align-items:center;
  justify-content:center;

  margin-bottom:12px;

  overflow:hidden;

  border:
    1px dashed #d4c5d1;

  border-radius:10px;

  background:#faf8fa;
}

.preview img{
  width:100%;
  height:100%;

  object-fit:contain;
}


/* =================================
   モーダルボタン
================================= */

.modalButtons{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:15px;
}

.modalBtn{
  height:42px;

  border:none;

  border-radius:10px;

  font-size:14px;
  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;
}

.cancelBtn{
  background:#eee;

  color:#555;
}

.saveBtn{
  background:#d85cae;

  color:#fff;
}


/* =================================
   説明
================================= */

.info{
  margin-bottom:12px;

  padding:10px;

  border-radius:9px;

  background:#faf5f9;

  color:#766575;

  font-size:11px;

  line-height:1.6;
}


/* =================================
   小さい画面
================================= */

@media(max-height:700px){

  .header{
    flex-basis:50px;
  }

  .mainBtn{
    height:32px;
  }

  .coinBtn{
    height:26px;
  }

  .tab{
    height:29px;
  }

  .items{
    height:108px;
  }

  .itemCard{
    height:100px;
  }

  .itemImage{
    height:58px;
  }

  .itemName{
    height:20px;
  }

  .itemPrice{
    height:17px;
  }

}

</style>
</head>


<body>

<div class="app">


  <!-- =================================
       ヘッダー
  ================================== -->

  <div class="header">

    <div class="title">
      🎀 ギフトで着せ替え
    </div>

    <div class="coinBox">
      🪙
      <span id="coinCount">1000</span>
    </div>

  </div>


  <!-- =================================
       キャラクター
  ================================== -->

  <div class="characterArea">

    <div
      id="stage"
      class="stage"
    >

      <div
        id="emptyCharacter"
        class="emptyCharacter"
      >
        👤<br>
        ベースキャラクターを設定してください
      </div>


      <img
        id="baseLayer"
        class="layer"
        alt=""
      >

      <img
        id="bottomLayer"
        class="layer"
        alt=""
      >

      <img
        id="onepieceLayer"
        class="layer"
        alt=""
      >

      <img
        id="dressLayer"
        class="layer"
        alt=""
      >

      <img
        id="topLayer"
        class="layer"
        alt=""
      >

      <img
        id="outerLayer"
        class="layer"
        alt=""
      >

      <img
        id="hairLayer"
        class="layer"
        alt=""
      >

      <img
        id="accessoryLayer"
        class="layer"
        alt=""
      >

      <img
        id="shoesLayer"
        class="layer"
        alt=""
      >

    </div>

  </div>


  <!-- =================================
       操作エリア
  ================================== -->

  <div class="controlArea">


    <div class="mainButtons">

      <button
        class="mainBtn"
        id="baseButton"
      >
        👤 ベースキャラクター
      </button>

      <button
        class="mainBtn"
        id="itemButton"
      >
        ➕ アイテム設定
      </button>

    </div>


    <!-- コイン -->

    <div class="coinButtons">

      <button
        class="coinBtn"
        data-coins="10"
      >
        🪙 +10
      </button>

      <button
        class="coinBtn"
        data-coins="50"
      >
        🪙 +50
      </button>

      <button
        class="coinBtn"
        data-coins="100"
      >
        🪙 +100
      </button>

      <button
        class="coinBtn"
        data-coins="500"
      >
        🪙 +500
      </button>

    </div>


    <!-- カテゴリー -->

    <div
      id="tabs"
      class="tabs"
    ></div>


    <!-- アイテム -->

    <div
      id="items"
      class="items"
    ></div>


  </div>

</div>



<!-- =================================
     ベース設定
================================== -->

<div
  id="baseModal"
  class="modal"
>

  <div class="modalBox">

    <div class="modalTitle">
      👤 ベースキャラクターを設定
    </div>

    <div class="info">
      全身が入った透過PNGがおすすめです。
    </div>

    <div class="preview">

      <img
        id="basePreview"
        alt=""
      >

    </div>

    <div class="formGroup">

      <label>
        キャラクター画像
      </label>

      <input
        id="baseFile"
        type="file"
        accept="image/*"
      >

    </div>

    <div class="modalButtons">

      <button
        class="modalBtn cancelBtn"
        id="baseCancel"
      >
        キャンセル
      </button>

      <button
        class="modalBtn saveBtn"
        id="baseSave"
      >
        設定する
      </button>

    </div>

  </div>

</div>



<!-- =================================
     アイテム設定
================================== -->

<div
  id="itemModal"
  class="modal"
>

  <div class="modalBox">

    <div class="modalTitle">
      ➕ アイテムを設定
    </div>

    <div class="preview">

      <img
        id="itemPreview"
        alt=""
      >

    </div>


    <div class="formGroup">

      <label>
        アイテム画像
      </label>

      <input
        id="itemFile"
        type="file"
        accept="image/*"
      >

    </div>


    <div class="formGroup">

      <label>
        アイテム名
      </label>

      <input
        id="itemName"
        type="text"
        placeholder="例：ピンクトップス"
      >

    </div>


    <div class="formGroup">

      <label>
        必要コイン数
      </label>

      <input
        id="itemPrice"
        type="number"
        min="0"
        value="100"
      >

    </div>


    <div class="formGroup">

      <label>
        アイテムの種類
      </label>

      <select id="itemCategory">

        <option value="top">
          👕 トップス
        </option>

        <option value="onepiece">
          👗 ワンピース
        </option>

        <option value="dress">
          👸 ドレス
        </option>

        <option value="bottom">
          🩳 ボトムス
        </option>

        <option value="outer">
          🧥 アウター
        </option>

        <option value="hair">
          💇 髪型
        </option>

        <option value="accessory">
          💎 アクセサリー
        </option>

        <option value="shoes">
          👟 靴
        </option>

      </select>

    </div>


    <div class="modalButtons">

      <button
        class="modalBtn cancelBtn"
        id="itemCancel"
      >
        キャンセル
      </button>

      <button
        class="modalBtn saveBtn"
        id="itemSave"
      >
        登録する
      </button>

    </div>

  </div>

</div>



<script>

/* =================================
   初期設定
================================= */

const STORAGE_KEY =
  "giftDressupItems_v3";

const BASE_KEY =
  "giftDressupBase_v3";


let coins = 1000;


/*
  アイテム
*/

let items = {

  top:[],
  onepiece:[],
  dress:[],
  bottom:[],
  outer:[],
  hair:[],
  accessory:[],
  shoes:[]

};


/*
  現在着ているアイテム
*/

let selected = {

  top:null,
  onepiece:null,
  dress:null,
  bottom:null,
  outer:null,
  hair:null,
  accessory:null,
  shoes:null

};


let currentCategory =
  "top";


let baseCharacter =
  null;


/* =================================
   カテゴリー
================================= */

const categoryNames = {

  top:"👕 トップス",

  onepiece:"👗 ワンピース",

  dress:"👸 ドレス",

  bottom:"🩳 ボトムス",

  outer:"🧥 アウター",

  hair:"💇 髪型",

  accessory:"💎 アクセ",

  shoes:"👟 靴"

};


/* =================================
   DOM
================================= */

const stage =
  document.getElementById("stage");

const coinCount =
  document.getElementById("coinCount");

const tabs =
  document.getElementById("tabs");

const itemsBox =
  document.getElementById("items");


/* =================================
   保存
================================= */

function saveItems(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(items)
    );

  }catch(error){

    console.log(
      "アイテム保存エラー",
      error
    );

  }

}


function loadItems(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(saved){

      const data =
        JSON.parse(saved);

      if(data){

        items = {

          top:
            Array.isArray(data.top)
              ? data.top
              : [],

          onepiece:
            Array.isArray(data.onepiece)
              ? data.onepiece
              : [],

          dress:
            Array.isArray(data.dress)
              ? data.dress
              : [],

          bottom:
            Array.isArray(data.bottom)
              ? data.bottom
              : [],

          outer:
            Array.isArray(data.outer)
              ? data.outer
              : [],

          hair:
            Array.isArray(data.hair)
              ? data.hair
              : [],

          accessory:
            Array.isArray(data.accessory)
              ? data.accessory
              : [],

          shoes:
            Array.isArray(data.shoes)
              ? data.shoes
              : []

        };

      }

    }

  }catch(error){

    console.log(
      "アイテム読み込みエラー",
      error
    );

  }

}


/* =================================
   ベース保存
================================= */

function saveBaseCharacter(){

  if(!baseCharacter){

    return;

  }

  try{

    localStorage.setItem(
      BASE_KEY,
      baseCharacter
    );

  }catch(error){

    console.log(
      "ベース保存エラー",
      error
    );

  }

}


function loadBaseCharacter(){

  try{

    const saved =
      localStorage.getItem(
        BASE_KEY
      );

    if(saved){

      baseCharacter =
        saved;

      const layer =
        document.getElementById(
          "baseLayer"
        );

      layer.src =
        saved;

      layer.style.display =
        "block";

      document
        .getElementById(
          "emptyCharacter"
        )
        .style.display =
        "none";

    }

  }catch(error){

    console.log(
      "ベース読み込みエラー",
      error
    );

  }

}


/* =================================
   コイン
================================= */

function updateCoins(){

  coinCount.textContent =
    coins.toLocaleString();

}


document
  .querySelectorAll(".coinBtn")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const amount =
          Number(
            button.dataset.coins
          );

        coins += amount;

        updateCoins();

      }
    );

  });


/* =================================
   タブ
================================= */

function renderTabs(){

  tabs.innerHTML = "";

  Object.keys(categoryNames)
    .forEach(category => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "tab";

      if(
        category === currentCategory
      ){

        button.classList.add(
          "active"
        );

      }

      button.textContent =
        categoryNames[category];


      /*
        ★タブを押したら必ず
        そのカテゴリーのリストを表示
      */

      button.addEventListener(
        "click",
        () => {

          currentCategory =
            category;

          renderTabs();

          renderItems();

        }
      );


      tabs.appendChild(button);

    });

}


/* =================================
   アイテム一覧
================================= */

function renderItems(){

  itemsBox.innerHTML = "";

  const list =
    items[currentCategory];


  /*
    アイテムなし
  */

  if(
    !list ||
    list.length === 0
  ){

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "noItems";

    empty.innerHTML =
      "まだアイテムがありません<br>" +
      "「➕ アイテム設定」から登録してください";

    itemsBox.appendChild(
      empty
    );

    return;

  }


  /*
    アイテムを1個ずつ表示
  */

  list.forEach(item => {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "itemCard";


    /*
      選択中
    */

    if(
      selected[currentCategory] &&
      selected[currentCategory].id === item.id
    ){

      card.classList.add(
        "selected"
      );

    }


    /*
      画像
    */

    const img =
      document.createElement(
        "img"
      );

    img.className =
      "itemImage";

    img.src =
      item.src;

    img.alt =
      item.name;

    img.draggable =
      false;


    /*
      名前
    */

    const name =
      document.createElement(
        "div"
      );

    name.className =
      "itemName";

    name.textContent =
      item.name;


    /*
      コイン
    */

    const price =
      document.createElement(
        "div"
      );

    price.className =
      "itemPrice";

    price.textContent =
      "🪙 " +
      Number(item.price)
        .toLocaleString();


    /*
      削除
    */

    const remove =
      document.createElement(
        "button"
      );

    remove.type =
      "button";

    remove.className =
      "removeItem";

    remove.textContent =
      "×";


    remove.addEventListener(
      "click",
      event => {

        event.preventDefault();

        event.stopPropagation();

        deleteItem(
          currentCategory,
          item.id
        );

      }
    );


    /*
      カード
    */

    card.appendChild(img);

    card.appendChild(name);

    card.appendChild(price);

    card.appendChild(remove);


    /*
      ★ここが重要

      カード全体をタップ可能にする
    */

    card.addEventListener(
      "click",
      event => {

        event.preventDefault();

        event.stopPropagation();

        wearItem(
          currentCategory,
          item
        );

      }
    );


    itemsBox.appendChild(
      card
    );

  });

}


/* =================================
   アイテム着用
================================= */

function wearItem(
  category,
  item
){

  /*
    ★同じアイテムを再タップ
    → 脱ぐ
  */

  if(
    selected[category] &&
    selected[category].id === item.id
  ){

    unequip(category);

    renderItems();

    return;

  }


  /*
    コイン確認
  */

  const price =
    Number(item.price) || 0;


  if(
    coins < price
  ){

    alert(
      "コインが足りません。\n\n" +
      "必要：" +
      price.toLocaleString() +
      "コイン\n" +
      "現在：" +
      coins.toLocaleString() +
      "コイン"
    );

    return;

  }


  /*
    コイン消費
  */

  coins -= price;

  updateCoins();


  /*
    選択
  */

  selected[category] =
    item;


  /*
    レイヤー
  */

  const layer =
    getLayer(category);


  if(layer){

    layer.src =
      item.src;

    layer.style.display =
      "block";

  }


  /* =============================
     ワンピース
  ============================= */

  if(
    category === "onepiece"
  ){

    clearCategory(
      "top"
    );

    clearCategory(
      "bottom"
    );

    clearCategory(
      "dress"
    );


    stage.classList.remove(
      "dressOn"
    );

    stage.classList.add(
      "onepieceOn"
    );

  }


  /* =============================
     ドレス
  ============================= */

  if(
    category === "dress"
  ){

    clearCategory(
      "top"
    );

    clearCategory(
      "bottom"
    );

    clearCategory(
      "onepiece"
    );


    stage.classList.remove(
      "onepieceOn"
    );

    stage.classList.add(
      "dressOn"
    );

  }


  /* =============================
     トップス
  ============================= */

  if(
    category === "top"
  ){

    clearCategory(
      "onepiece"
    );

    clearCategory(
      "dress"
    );


    stage.classList.remove(
      "onepieceOn"
    );

    stage.classList.remove(
      "dressOn"
    );


    /*
      アウター着用中なら
      トップスは隠す
    */

    if(selected.outer){

      document
        .getElementById(
          "topLayer"
        )
        .style.display =
        "none";

    }

  }


  /* =============================
     ボトムス
  ============================= */

  if(
    category === "bottom"
  ){

    clearCategory(
      "onepiece"
    );

    clearCategory(
      "dress"
    );


    stage.classList.remove(
      "onepieceOn"
    );

    stage.classList.remove(
      "dressOn"
    );

  }


  /* =============================
     アウター
  ============================= */

  if(
    category === "outer"
  ){

    stage.classList.add(
      "outerOn"
    );


    /*
      トップスが選ばれていた場合も
      完全に隠す
    */

    if(selected.top){

      document
        .getElementById(
          "topLayer"
        )
        .style.display =
        "none";

    }

  }


  renderItems();

}


/* =================================
   脱ぐ
================================= */

function unequip(
  category
){

  selected[category] =
    null;


  const layer =
    getLayer(category);


  if(layer){

    layer.src = "";

    layer.style.display =
      "none";

  }


  if(
    category === "onepiece"
  ){

    stage.classList.remove(
      "onepieceOn"
    );

  }


  if(
    category === "dress"
  ){

    stage.classList.remove(
      "dressOn"
    );

  }


  if(
    category === "outer"
  ){

    stage.classList.remove(
      "outerOn"
    );


    /*
      アウターを脱いだら
      トップスを再表示
    */

    if(selected.top){

      const topLayer =
        document.getElementById(
          "topLayer"
        );

      topLayer.src =
        selected.top.src;

      topLayer.style.display =
        "block";

    }

  }

}


/* =================================
   カテゴリーをクリア
================================= */

function clearCategory(
  category
){

  selected[category] =
    null;


  const layer =
    getLayer(category);


  if(layer){

    layer.src = "";

    layer.style.display =
      "none";

  }

}


/* =================================
   レイヤー取得
================================= */

function getLayer(
  category
){

  const map = {

    top:
      "topLayer",

    onepiece:
      "onepieceLayer",

    dress:
      "dressLayer",

    bottom:
      "bottomLayer",

    outer:
      "outerLayer",

    hair:
      "hairLayer",

    accessory:
      "accessoryLayer",

    shoes:
      "shoesLayer"

  };


  return document.getElementById(
    map[category]
  );

}


/* =================================
   アイテム削除
================================= */

function deleteItem(
  category,
  id
){

  const index =
    items[category].findIndex(
      item =>
        item.id === id
    );


  if(index === -1){

    return;

  }


  /*
    着用中なら脱ぐ
  */

  if(
    selected[category] &&
    selected[category].id === id
  ){

    unequip(category);

  }


  items[category].splice(
    index,
    1
  );


  saveItems();

  renderItems();

}

   ベースモーダル
================================= */

const baseModal =
  document.getElementById(
    "baseModal"
  );


const baseFile =
  document.getElementById(
    "baseFile"
  );


const basePreview =
  document.getElementById(
    "basePreview"
  );


let temporaryBase =
  "";


document
  .getElementById(
    "baseButton"
  )
  .addEventListener(
    "click",
    () => {

      baseModal.classList.add(
        "show"
      );

    }
  );


document
  .getElementById(
    "baseCancel"
  )
  .addEventListener(
    "click",
    () => {

      baseModal.classList.remove(
        "show"
      );

    }
  );


baseFile.addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];

    if(!file){

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      e => {

        temporaryBase =
          e.target.result;

        basePreview.src =
          temporaryBase;

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* =================================
   ベース保存
================================= */

document
  .getElementById(
    "baseSave"
  )
  .addEventListener(
    "click",
    () => {

      if(!temporaryBase){

        alert(
          "キャラクター画像を選択してください。"
        );

        return;

      }


      baseCharacter =
        temporaryBase;


      const layer =
        document.getElementById(
          "baseLayer"
        );


      layer.src =
        baseCharacter;

      layer.style.display =
        "block";


      document
        .getElementById(
          "emptyCharacter"
        )
        .style.display =
        "none";


      saveBaseCharacter();


      temporaryBase =
        "";

      baseFile.value =
        "";

      basePreview.src =
        "";


      baseModal.classList.remove(
        "show"
      );

    }
  );

/* =================================
   アイテム登録
================================= */

document
  .getElementById(
    "itemSave"
  )
  .addEventListener(
    "click",
    () => {

      const name =
        document
          .getElementById(
            "itemName"
          )
          .value
          .trim();


      const price =
        Number(
          document
            .getElementById(
              "itemPrice"
            )
            .value
        );


      const category =
        document
          .getElementById(
            "itemCategory"
          )
          .value;


      /*
        チェック
      */

      if(!temporaryItem){

        alert(
          "アイテム画像を選択してください。"
        );

        return;

      }


      if(!name){

        alert(
          "アイテム名を入力してください。"
        );

        return;

      }


      if(
        isNaN(price) ||
        price < 0
      ){

        alert(
          "コイン数を正しく入力してください。"
        );

        return;

      }


      /*
        ★一意のID
      */

      const item = {

        id:
          Date.now().toString() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2),

        name:
          name,

        price:
          price,

        category:
          category,

        src:
          temporaryItem

      };


      /*
        登録
      */

      items[category].push(
        item
      );


      /*
        保存
      */

      saveItems();


      /*
        登録したカテゴリーを表示
      */

      currentCategory =
        category;


      /*
        フォームリセット
      */

      itemFile.value =
        "";

      document
        .getElementById(
          "itemName"
        )
        .value =
        "";

      document
        .getElementById(
          "itemPrice"
        )
        .value =
        "100";

      document
        .getElementById(
          "itemPreview"
        )
        .src =
        "";

      temporaryItem =
        "";


      /*
        ★すぐ一覧に表示
      */

      renderTabs();

      renderItems();


      /*
        モーダルを閉じる
      */

      itemModal.classList.remove(
        "show"
      );

    }
  );
