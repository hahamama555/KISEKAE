<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>ギフトで着せ替え</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;

  background:#eadfea;

}

body{

  display:flex;

  align-items:center;
  justify-content:center;

}


/* =====================================================
   9:16 APP
===================================================== */

.app{

  position:relative;

  width:min(100vw,56.25vh);

  height:min(100vh,177.777vw);

  max-width:600px;
  max-height:1066px;

  aspect-ratio:9 / 16;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #fffaff 0%,
      #f8edf7 100%
    );

  display:flex;

  flex-direction:column;

}


/* =====================================================
   HEADER
===================================================== */

.header{

  flex:0 0 6%;

  min-height:42px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 4%;

  background:#fff;

  border-bottom:
    1px solid #eadbe7;

  z-index:100;

}

.title{

  font-size:
    clamp(13px,3vw,18px);

  font-weight:900;

  white-space:nowrap;

}

.coinBox{

  display:flex;

  align-items:center;

  gap:4px;

  padding:5px 10px;

  border-radius:20px;

  background:#fff0a8;

  color:#705d00;

  font-size:
    clamp(11px,2.7vw,15px);

  font-weight:900;

  white-space:nowrap;

}


/* =====================================================
   SCREEN
===================================================== */

.screen{

  position:absolute;

  left:0;
  right:0;
  bottom:0;
  top:6%;

  display:none;

}

.screen.active{

  display:flex;

}


/* =====================================================
   DRESS SCREEN
===================================================== */

#dressScreen{

  flex-direction:column;

}


/* =====================================================
   CHARACTER AREA
===================================================== */

.characterArea{

  flex:1;

  min-height:0;

  position:relative;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  padding:0 2%;

}


/* =====================================================
   CHARACTER STAGE
===================================================== */

.stage{

  position:relative;

  width:100%;
  height:100%;

  max-width:520px;

  aspect-ratio:2 / 3;

  margin:auto;

  overflow:hidden;

}


/* =====================================================
   LAYERS
===================================================== */

.layer{

  position:absolute;

  left:50%;
  top:50%;

  width:100%;
  height:100%;

  transform:
    translate(-50%,-50%);

  object-fit:contain;

  object-position:center;

  pointer-events:none;

  display:none;

}


/* =====================================================
   LAYER ORDER
===================================================== */

#baseLayer{
  z-index:1;
}

#bottomLayer{
  z-index:2;
}

#onepieceLayer{
  z-index:3;
}

#dressLayer{
  z-index:4;
}

#topLayer{
  z-index:5;
}

#outerLayer{
  z-index:6;
}

#hairLayer{
  z-index:7;
}

#accessoryLayer{
  z-index:8;
}

#shoesLayer{
  z-index:9;
}


/* =====================================================
   SPECIAL CLOTHING
===================================================== */

.onepieceOn #topLayer,
.onepieceOn #bottomLayer{

  display:none!important;

}

.dressOn #topLayer,
.dressOn #bottomLayer{

  display:none!important;

}

.outerOn #topLayer{

  display:none!important;

}


/* =====================================================
   EMPTY CHARACTER
===================================================== */

.emptyCharacter{

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  width:90%;

  text-align:center;

  color:#ad9dac;

  font-size:
    clamp(12px,3vw,16px);

  font-weight:800;

  line-height:1.7;

  z-index:20;

}


/* =====================================================
   DRESS CONTROLS
===================================================== */

.dressControls{

  flex:0 0 31%;

  min-height:0;

  background:#fff;

  border-top:
    1px solid #eadbe7;

  padding:1.5%;

  display:flex;

  flex-direction:column;

}


/* =====================================================
   MAIN BUTTONS
===================================================== */

.mainButtons{

  flex:0 0 22%;

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:6px;

  margin-bottom:6px;

}

.mainBtn{

  border:none;

  border-radius:10px;

  background:#eee4ed;

  color:#604e5c;

  font-size:
    clamp(9px,2.3vw,13px);

  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;

}


/* =====================================================
   CATEGORY
===================================================== */

.categoryGrid{

  flex:1;

  min-height:0;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  grid-template-rows:
    repeat(2,1fr);

  gap:6px;

}

.categoryBtn{

  border:none;

  border-radius:10px;

  background:#f1e8f0;

  color:#625360;

  font-size:
    clamp(8px,2.2vw,12px);

  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;

}

.categoryBtn:active,
.mainBtn:active{

  transform:scale(.97);

}


/* =====================================================
   ITEM SCREEN
===================================================== */

#itemScreen{

  flex-direction:column;

  background:
    linear-gradient(
      180deg,
      #fffaff,
      #f8edf7
    );

}


/* =====================================================
   ITEM HEADER
===================================================== */

.itemHeader{

  flex:0 0 10%;

  min-height:50px;

  display:flex;

  align-items:center;

  gap:8px;

  padding:0 3%;

  background:#fff;

  border-bottom:
    1px solid #eadbe7;

}

.backBtn{

  flex:0 0 auto;

  height:38px;

  padding:0 12px;

  border:none;

  border-radius:10px;

  background:#eee4ed;

  color:#604e5c;

  font-size:13px;

  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;

}

.itemTitle{

  flex:1;

  text-align:center;

  font-size:
    clamp(14px,3.5vw,20px);

  font-weight:900;

}

.itemHeaderCoin{

  flex:0 0 auto;

  padding:6px 9px;

  border-radius:20px;

  background:#fff0a8;

  color:#705d00;

  font-size:11px;

  font-weight:900;

}


/* =====================================================
   ITEM GRID
   2 COLUMNS
===================================================== */

.itemGrid{

  flex:1;

  min-height:0;

  overflow-y:auto;

  overflow-x:hidden;

  padding:
    10px;

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  align-content:start;

  gap:10px;

  -webkit-overflow-scrolling:touch;

  scrollbar-width:none;

}

.itemGrid::-webkit-scrollbar{

  display:none;

}


/* =====================================================
   ITEM CARD
===================================================== */

.itemCard{

  position:relative;

  width:100%;

  min-height:250px;

  border:
    3px solid transparent;

  border-radius:15px;

  background:#fff;

  box-shadow:
    0 2px 8px
    rgba(80,50,80,.08);

  overflow:hidden;

  cursor:pointer;

  touch-action:manipulation;

  user-select:none;

  -webkit-user-select:none;

  -webkit-tap-highlight-color:transparent;

  transition:
    transform .12s ease,
    border-color .12s ease;

}

.itemCard:active{

  transform:scale(.985);

}


/* =====================================================
   SELECTED
===================================================== */

.itemCard.selected{

  border-color:#d85cae;

  background:#fff0fa;

  box-shadow:
    0 0 0 3px
    rgba(216,92,174,.15);

}


/* =====================================================
   IMAGE AREA
===================================================== */

.itemImageWrap{

  width:100%;

  height:190px;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:8px;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #fff,
      #fcf6fb
    );

}


/* =====================================================
   ITEM IMAGE
===================================================== */

.itemImage{

  display:block;

  width:100%;

  height:100%;

  object-fit:contain;

  object-position:center;

  pointer-events:none;

  user-select:none;

  -webkit-user-drag:none;

}


/* =====================================================
   ITEM INFO
===================================================== */

.itemInfo{

  height:54px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:2px;

  background:#fff;

}


/* =====================================================
   NAME
===================================================== */

.itemName{

  width:90%;

  text-align:center;

  font-size:
    clamp(11px,2.8vw,14px);

  font-weight:900;

  line-height:19px;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

}


/* =====================================================
   PRICE
===================================================== */

.itemPrice{

  text-align:center;

  font-size:
    clamp(10px,2.5vw,13px);

  font-weight:900;

  color:#806700;

}


/* =====================================================
   SELECTED BADGE
===================================================== */

.selectedBadge{

  position:absolute;

  left:7px;
  top:7px;

  padding:
    5px 8px;

  border-radius:20px;

  background:#d85cae;

  color:#fff;

  font-size:10px;

  font-weight:900;

  z-index:10;

}


/* =====================================================
   DELETE
===================================================== */

.removeItem{

  position:absolute;

  right:6px;
  top:6px;

  width:30px;
  height:30px;

  border:none;

  border-radius:50%;

  background:
    rgba(0,0,0,.58);

  color:#fff;

  font-size:18px;

  font-weight:900;

  line-height:30px;

  z-index:20;

  cursor:pointer;

}


/* =====================================================
   EMPTY
===================================================== */

.noItems{

  grid-column:
    1 / -1;

  min-height:250px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#a697a4;

  font-size:14px;

  font-weight:800;

  line-height:1.7;

}


/* =====================================================
   ITEM BOTTOM
===================================================== */

.itemBottom{

  flex:0 0 7%;

  min-height:40px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#fff;

  border-top:
    1px solid #eadbe7;

}

.itemHint{

  font-size:10px;

  font-weight:800;

  color:#927f8f;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  display:none;

  align-items:center;

  justify-content:center;

  padding:15px;

  background:
    rgba(0,0,0,.48);

  z-index:300;

}

.modal.show{

  display:flex;

}


/* =====================================================
   MODAL BOX
===================================================== */

.modalBox{

  width:min(92vw,420px);

  max-height:90vh;

  overflow-y:auto;

  padding:18px;

  background:#fff;

  border-radius:18px;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.25);

}

.modalTitle{

  margin-bottom:14px;

  font-size:18px;

  font-weight:900;

}

.info{

  margin-bottom:11px;

  padding:9px;

  border-radius:9px;

  background:#faf5f9;

  color:#766575;

  font-size:10px;

  line-height:1.5;

}

.preview{

  width:100%;

  height:140px;

  display:flex;

  align-items:center;

  justify-content:center;

  margin-bottom:11px;

  overflow:hidden;

  border:
    1px dashed #d4c5d1;

  border-radius:10px;

  background:#faf8fa;

}

.preview img{

  width:100%;
  height:100%;

  object-fit:contain;

}

.formGroup{

  margin-bottom:12px;

}

.formGroup label{

  display:block;

  margin-bottom:5px;

  font-size:12px;

  font-weight:900;

}

.formGroup input,
.formGroup select{

  width:100%;

  height:42px;

  padding:0 10px;

  border:
    1px solid #ddd;

  border-radius:9px;

  background:#fff;

  font-size:13px;

}

.modalButtons{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:14px;

}

.modalBtn{

  height:42px;

  border:none;

  border-radius:10px;

  font-size:13px;

  font-weight:900;

  cursor:pointer;

}

.cancelBtn{

  background:#eee;

  color:#555;

}

.saveBtn{

  background:#d85cae;

  color:#fff;

}


/* =====================================================
   SHORT SCREEN
===================================================== */

@media(max-height:700px){

  .itemImageWrap{

    height:165px;

  }

  .itemCard{

    min-height:225px;

  }

}


/* =====================================================
   VERY SHORT
===================================================== */

@media(max-height:620px){

  .itemImageWrap{

    height:140px;

  }

  .itemCard{

    min-height:200px;

  }

}


/* =====================================================
   NARROW SCREEN
===================================================== */

@media(max-width:360px){

  .itemGrid{

    padding:7px;

    gap:7px;

  }

  .itemImageWrap{

    height:155px;

  }

  .itemCard{

    min-height:215px;

  }

}


/* =====================================================
   VERY NARROW
===================================================== */

@media(max-width:330px){

  .itemImageWrap{

    height:140px;

  }

  .itemCard{

    min-height:200px;

  }

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

  <div class="title">
    🎀 ギフトで着せ替え
  </div>

  <div class="coinBox">

    🪙

    <span id="coinCount">
      1000
    </span>

  </div>

</div>


<!-- =====================================================
     DRESS SCREEN
===================================================== -->

<div
  id="dressScreen"
  class="screen active"
>


  <!-- CHARACTER -->

  <div class="characterArea">

    <div
      id="stage"
      class="stage"
    >

      <div
        id="emptyCharacter"
        class="emptyCharacter"
      >

        👤<br>

        ベースキャラクターを<br>
        設定してください

      </div>


      <img
        id="baseLayer"
        class="layer"
        alt=""
      >

      <img
        id="bottomLayer"
        class="layer"
        alt=""
      >

      <img
        id="onepieceLayer"
        class="layer"
        alt=""
      >

      <img
        id="dressLayer"
        class="layer"
        alt=""
      >

      <img
        id="topLayer"
        class="layer"
        alt=""
      >

      <img
        id="outerLayer"
        class="layer"
        alt=""
      >

      <img
        id="hairLayer"
        class="layer"
        alt=""
      >

      <img
        id="accessoryLayer"
        class="layer"
        alt=""
      >

      <img
        id="shoesLayer"
        class="layer"
        alt=""
      >

    </div>

  </div>


  <!-- CONTROLS -->

  <div class="dressControls">


    <div class="mainButtons">

      <button
        id="baseButton"
        class="mainBtn"
        type="button"
      >
        👤 ベースキャラ
      </button>


      <button
        id="itemButton"
        class="mainBtn"
        type="button"
      >
        ➕ アイテム追加
      </button>

    </div>


    <div class="categoryGrid">

      <button
        class="categoryBtn"
        data-category="top"
        type="button"
      >
        👕 トップス
      </button>


      <button
        class="categoryBtn"
        data-category="onepiece"
        type="button"
      >
        👗 ワンピース
      </button>


      <button
        class="categoryBtn"
        data-category="dress"
        type="button"
      >
        👸 ドレス
      </button>


      <button
        class="categoryBtn"
        data-category="bottom"
        type="button"
      >
        🩳 ボトムス
      </button>


      <button
        class="categoryBtn"
        data-category="outer"
        type="button"
      >
        🧥 アウター
      </button>


      <button
        class="categoryBtn"
        data-category="hair"
        type="button"
      >
        💇 髪型
      </button>


      <button
        class="categoryBtn"
        data-category="accessory"
        type="button"
      >
        💎 アクセ
      </button>


      <button
        class="categoryBtn"
        data-category="shoes"
        type="button"
      >
        👟 靴
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     ITEM SCREEN
===================================================== -->

<div
  id="itemScreen"
  class="screen"
>


  <div class="itemHeader">

    <button
      id="backButton"
      class="backBtn"
      type="button"
    >
      ← 戻る
    </button>


    <div
      id="itemTitle"
      class="itemTitle"
    >
      👕 トップス
    </div>


    <div class="itemHeaderCoin">

      🪙

      <span id="itemCoinCount">
        1000
      </span>

    </div>

  </div>


  <!-- ===================================================
       2 COLUMN ITEM GRID
  ==================================================== -->

  <div
    id="itemGrid"
    class="itemGrid"
  ></div>


  <div class="itemBottom">

    <div class="itemHint">
      アイテムをタップして着せ替え
    </div>

  </div>

</div>


</div>


<!-- =====================================================
     BASE MODAL
===================================================== -->

<div
  id="baseModal"
  class="modal"
>

  <div class="modalBox">


    <div class="modalTitle">
      👤 ベースキャラクター
    </div>


    <div class="info">

      全身が入った透過PNGがおすすめです。

    </div>


    <div class="preview">

      <img
        id="basePreview"
        alt=""
      >

    </div>


    <div class="formGroup">

      <label>
        キャラクター画像
      </label>

      <input
        id="baseFile"
        type="file"
        accept="image/*"
      >

    </div>


    <div class="modalButtons">

      <button
        id="baseCancel"
        class="modalBtn cancelBtn"
        type="button"
      >
        キャンセル
      </button>


      <button
        id="baseSave"
        class="modalBtn saveBtn"
        type="button"
      >
        設定する
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     ITEM MODAL
===================================================== -->

<div
  id="itemModal"
  class="modal"
>

  <div class="modalBox">


    <div class="modalTitle">
      ➕ アイテム追加
    </div>


    <div class="preview">

      <img
        id="itemPreview"
        alt=""
      >

    </div>


    <div class="formGroup">

      <label>
        アイテム画像
      </label>

      <input
        id="itemFile"
        type="file"
        accept="image/*"
      >

    </div>


    <div class="formGroup">

      <label>
        アイテム名
      </label>

      <input
        id="itemName"
        type="text"
        placeholder="例：ピンクトップス"
      >

    </div>


    <div class="formGroup">

      <label>
        必要コイン数
      </label>

      <input
        id="itemPrice"
        type="number"
        min="0"
        value="100"
      >

    </div>


    <div class="formGroup">

      <label>
        アイテムカテゴリー
      </label>

      <select
        id="itemCategory"
      >

        <option value="top">
          👕 トップス
        </option>

        <option value="onepiece">
          👗 ワンピース
        </option>

        <option value="dress">
          👸 ドレス
        </option>

        <option value="bottom">
          🩳 ボトムス
        </option>

        <option value="outer">
          🧥 アウター
        </option>

        <option value="hair">
          💇 髪型
        </option>

        <option value="accessory">
          💎 アクセサリー
        </option>

        <option value="shoes">
          👟 靴
        </option>

      </select>

    </div>


    <div class="modalButtons">

      <button
        id="itemCancel"
        class="modalBtn cancelBtn"
        type="button"
      >
        キャンセル
      </button>


      <button
        id="itemSave"
        class="modalBtn saveBtn"
        type="button"
      >
        登録する
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   STORAGE
===================================================== */

const ITEM_STORAGE =
  "giftDressupItems_2column_v4";

const BASE_STORAGE =
  "giftDressupBase_2column_v4";


/* =====================================================
   COINS
===================================================== */

let coins = 1000;


/* =====================================================
   ITEMS
===================================================== */

let items = {

  top:[],

  onepiece:[],

  dress:[],

  bottom:[],

  outer:[],

  hair:[],

  accessory:[],

  shoes:[]

};


/* =====================================================
   SELECTED
===================================================== */

let selected = {

  top:null,

  onepiece:null,

  dress:null,

  bottom:null,

  outer:null,

  hair:null,

  accessory:null,

  shoes:null

};


/* =====================================================
   BASE
===================================================== */

let baseCharacter = null;


/* =====================================================
   TEMPORARY
===================================================== */

let temporaryBase = "";

let temporaryItem = "";


/* =====================================================
   CURRENT CATEGORY
===================================================== */

let currentCategory = "top";


/* =====================================================
   CATEGORY NAMES
===================================================== */

const categoryNames = {

  top:"👕 トップス",

  onepiece:"👗 ワンピース",

  dress:"👸 ドレス",

  bottom:"🩳 ボトムス",

  outer:"🧥 アウター",

  hair:"💇 髪型",

  accessory:"💎 アクセサリー",

  shoes:"👟 靴"

};


/* =====================================================
   DOM
===================================================== */

const dressScreen =
  document.getElementById(
    "dressScreen"
  );

const itemScreen =
  document.getElementById(
    "itemScreen"
  );

const itemGrid =
  document.getElementById(
    "itemGrid"
  );

const itemTitle =
  document.getElementById(

/* =====================================================
   TRANSPARENT PNG AUTO CROP
===================================================== */

function createTrimmedImage(
  src,
  callback
){

  const img =
    new Image();


  img.onload =
    function(){

      try{

        const canvas =
          document.createElement(
            "canvas"
          );


        const ctx =
          canvas.getContext(
            "2d",
            {
              willReadFrequently:true
            }
          );


        const width =
          img.naturalWidth;

        const height =
          img.naturalHeight;


        /*
          極端に小さい画像対策
        */

        if(
          !width ||
          !height
        ){

          callback(src);

          return;

        }


        canvas.width =
          width;

        canvas.height =
          height;


        ctx.clearRect(
          0,
          0,
          width,
          height
        );


        ctx.drawImage(
          img,
          0,
          0
        );


        /*
          JPEGなどの画像は
          透明部分がないため、
          そのまま表示
        */

        const imageData =
          ctx.getImageData(
            0,
            0,
            width,
            height
          );


        const data =
          imageData.data;


        let minX =
          width;

        let minY =
          height;

        let maxX =
          -1;

        let maxY =
          -1;


        const alphaThreshold =
          12;


        for(
          let y = 0;
          y < height;
          y++
        ){

          for(
            let x = 0;
            x < width;
            x++
          ){

            const index =
              (
                y * width + x
              ) * 4;


            const alpha =
              data[index + 3];


            if(
              alpha >
              alphaThreshold
            ){

              if(
                x < minX
              ){

                minX = x;

              }


              if(
                y < minY
              ){

                minY = y;

              }


              if(
                x > maxX
              ){

                maxX = x;

              }


              if(
                y > maxY
              ){

                maxY = y;

              }

            }

          }

        }


        /*
          透明部分がない、
          または全透明なら元画像
        */

        if(
          maxX < 0 ||
          maxY < 0 ||
          (
            minX === 0 &&
            minY === 0 &&
            maxX === width - 1 &&
            maxY === height - 1
          )
        ){

          callback(src);

          return;

        }


        /*
          少しだけ余白を残す
        */

        const padding =
          Math.max(
            3,
            Math.round(
              Math.min(
                width,
                height
              ) * .01
            )
          );


        minX =
          Math.max(
            0,
            minX - padding
          );

        minY =
          Math.max(
            0,
            minY - padding
          );

        maxX =
          Math.min(
            width - 1,
            maxX + padding
          );

        maxY =
          Math.min(
            height - 1,
            maxY + padding
          );


        const cropWidth =
          maxX - minX + 1;

        const cropHeight =
          maxY - minY + 1;


        const cropCanvas =
          document.createElement(
            "canvas"
          );


        cropCanvas.width =
          cropWidth;

        cropCanvas.height =
          cropHeight;


        const cropCtx =
          cropCanvas.getContext(
            "2d"
          );


        cropCtx.drawImage(

          img,

          minX,
          minY,

          cropWidth,
          cropHeight,

          0,
          0,

          cropWidth,
          cropHeight

        );


        const result =
          cropCanvas.toDataURL(
            "image/png"
          );


        callback(result);


      }catch(error){

        console.log(
          "画像トリミングエラー",
          error
        );

        callback(src);

      }

    };


  img.onerror =
    function(){

      callback(src);

    };


  img.src =
    src;

}


/* =====================================================
   RENDER ITEMS
===================================================== */

function renderItemGrid(){

  itemGrid.innerHTML = "";


  const list =
    items[currentCategory];


  if(
    !list ||
    list.length === 0
  ){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "noItems";


    empty.innerHTML =

      categoryNames[
        currentCategory
      ]

      +

      "<br><br>" +

      "まだアイテムがありません" +

      "<br><br>" +

      "「➕ アイテム追加」から" +

      "<br>" +

      "登録してください";


    itemGrid.appendChild(
      empty
    );


    return;

  }


  list.forEach(
    item => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "itemCard";


      /* ---------------------------------
         SELECTED
      --------------------------------- */

      if(
        selected[currentCategory] &&
        selected[currentCategory].id ===
        item.id
      ){

        card.classList.add(
          "selected"
        );


        const badge =
          document.createElement(
            "div"
          );


        badge.className =
          "selectedBadge";


        badge.textContent =
          "✓ 着用中";


        card.appendChild(
          badge
        );

      }


      /* ---------------------------------
         IMAGE WRAP
      --------------------------------- */

      const imageWrap =
        document.createElement(
          "div"
        );


      imageWrap.className =
        "itemImageWrap";


      /* ---------------------------------
         IMAGE
      --------------------------------- */

      const image =
        document.createElement(
          "img"
        );


      image.className =
        "itemImage";


      image.alt =
        item.name;


      image.draggable =
        false;


      /*
        最初は元画像
      */

      image.src =
        item.src;


      /*
        透明部分を自動トリミング
      */

      createTrimmedImage(
        item.src,
        function(trimmedSrc){

          if(
            document.body.contains(
              image
            )
          ){

            image.src =
              trimmedSrc;

          }

        }
      );


      imageWrap.appendChild(
        image
      );


      /* ---------------------------------
         INFO
      --------------------------------- */

      const info =
        document.createElement(
          "div"
        );


      info.className =
        "itemInfo";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "itemName";


      name.textContent =
        item.name;


      const price =
        document.createElement(
          "div"
        );


      price.className =
        "itemPrice";


      price.textContent =
        "🪙 " +
        Number(
          item.price
        ).toLocaleString() +
        "コイン";


      info.appendChild(
        name
      );


      info.appendChild(
        price
      );


      /* ---------------------------------
         DELETE
      --------------------------------- */

      const remove =
        document.createElement(
          "button"
        );


      remove.className =
        "removeItem";


      remove.type =
        "button";


      remove.textContent =
        "×";


      remove.addEventListener(
        "click",
        function(event){

          event.preventDefault();

          event.stopPropagation();

          deleteItem(
            currentCategory,
            item.id
          );

        }
      );


      /* ---------------------------------
         CARD
      --------------------------------- */

      card.appendChild(
        imageWrap
      );


      card.appendChild(
        info
      );


      card.appendChild(
        remove
      );


      /* ---------------------------------
         TAP
      --------------------------------- */

      card.addEventListener(
        "click",
        function(){

          wearItem(
            currentCategory,
            item
          );

        }
      );


      itemGrid.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   WEAR ITEM
===================================================== */

function wearItem(
  category,
  item
){

  /* ---------------------------------
     SAME ITEM = UNEQUIP
  --------------------------------- */

  if(
    selected[category] &&
    selected[category].id ===
    item.id
  ){

    unequip(
      category
    );

    renderItemGrid();

    return;

  }


  const price =
    Number(
      item.price
    ) || 0;


  /* ---------------------------------
     COIN CHECK
  --------------------------------- */

  if(
    coins < price
  ){

    alert(

      "コインが足りません。\n\n" +

      "必要：" +

      price.toLocaleString() +

      "コイン\n" +

      "現在：" +

      coins.toLocaleString() +

      "コイン"

    );

    return;

  }


  /* ---------------------------------
     PAYMENT
  --------------------------------- */

  coins -= price;

  updateCoins();


  /* ---------------------------------
     SELECT
  --------------------------------- */

  selected[category] =
    item;


  /* ---------------------------------
     LAYER
  --------------------------------- */

  const layer =
    getLayer(
      category
    );


  if(layer){

    layer.src =
      item.src;

    layer.style.display =
      "block";

  }


  /* ---------------------------------
     ONEPIECE
  --------------------------------- */

  if(
    category ===
    "onepiece"
  ){

    clearCategory(
      "top"
    );

    clearCategory(
      "bottom"
    );

    clearCategory(
      "dress"
    );


    stage.classList.remove(
      "dressOn"
    );


    stage.classList.add(
      "onepieceOn"
    );

  }


  /* ---------------------------------
     DRESS
  --------------------------------- */

  if(
    category ===
    "dress"
  ){

    clearCategory(
      "top"
    );

    clearCategory(
      "bottom"
    );

    clearCategory(
      "onepiece"
    );


    stage.classList.remove(
      "onepieceOn"
    );


    stage.classList.add(
      "dressOn"
    );

  }


  /* ---------------------------------
     TOP
  --------------------------------- */

  if(
    category ===
    "top"
  ){

    clearCategory(
      "onepiece"
    );

    clearCategory(
      "dress"
    );


    stage.classList.remove(
      "onepieceOn"
    );

    stage.classList.remove(
      "dressOn"
    );


    if(
      selected.outer
    ){

      layer.style.display =
        "none";

    }

  }


  /* ---------------------------------
     BOTTOM
  --------------------------------- */

  if(
    category ===
    "bottom"
  ){

    clearCategory(
      "onepiece"
    );

    clearCategory(
      "dress"
    );


    stage.classList.remove(
      "onepieceOn"
    );

    stage.classList.remove(
      "dressOn"
    );

  }


  /* ---------------------------------
     OUTER
  --------------------------------- */

  if(
    category ===
    "outer"
  ){

    stage.classList.add(
      "outerOn"
    );


    const topLayer =
      document.getElementById(
        "topLayer"
      );


    topLayer.style.display =
      "none";

  }


  /* ---------------------------------
     RETURN
  --------------------------------- */

  itemScreen.classList.remove(
    "active"
  );


  dressScreen.classList.add(
    "active"
  );

}


/* =====================================================
   UNEQUIP
===================================================== */

function unequip(
  category
){

  selected[category] =
    null;


  const layer =
    getLayer(
      category
    );


  if(layer){

    layer.src =
      "";

    layer.style.display =
      "none";

  }


  if(
    category ===
    "onepiece"
  ){

    stage.classList.remove(
      "onepieceOn"
    );

  }


  if(
    category ===
    "dress"
  ){

    stage.classList.remove(
      "dressOn"
    );

  }


  if(
    category ===
    "outer"
  ){

    stage.classList.remove(
      "outerOn"
    );


    if(
      selected.top
    ){

      const topLayer =
        document.getElementById(
          "topLayer"
        );


      topLayer.src =
        selected.top.src;


      topLayer.style.display =
        "block";

    }

  }

}


/* =====================================================
   CLEAR CATEGORY
===================================================== */

function clearCategory(
  category
){

  selected[category] =
    null;


  const layer =
    getLayer(
      category
    );


  if(layer){

    layer.src =
      "";

    layer.style.display =
      "none";

  }

}


/* =====================================================
   GET LAYER
===================================================== */

function getLayer(
  category
){

  const map = {

    top:"topLayer",

    onepiece:"onepieceLayer",

    dress:"dressLayer",

    bottom:"bottomLayer",

    outer:"outerLayer",

    hair:"hairLayer",

    accessory:"accessoryLayer",

    shoes:"shoesLayer"

  };


  return document.getElementById(
    map[category]
  );

}


/* =====================================================
   DELETE ITEM
===================================================== */

function deleteItem(
  category,
  id
){

  const index =
    items[category].findIndex(
      item =>
        item.id === id
    );


  if(
    index === -1
  ){

    return;

  }


  if(
    selected[category] &&
    selected[category].id === id
  ){

    unequip(
      category
    );

  }


  items[category].splice(
    index,
    1
  );


  saveItems();

  renderItemGrid();

}


/* =====================================================
   SAVE ITEMS
===================================================== */

function saveItems(){

  try{

    localStorage.setItem(
      ITEM_STORAGE,
      JSON.stringify(items)
    );

  }catch(error){

    console.log(
      error
    );

    alert(
      "アイテムの保存容量がいっぱいになりました。"
    );

  }

}


/* =====================================================
   LOAD ITEMS
===================================================== */

function loadItems(){

  try{

    const saved =
      localStorage.getItem(
        ITEM_STORAGE
      );


    if(!saved){

      return;

    }


    const data =
      JSON.parse(
        saved
      );


    if(!data){

      return;

    }


    Object.keys(
      items
    )
    .forEach(
      category => {

        if(
          Array.isArray(
            data[category]
          )
        ){

          items[category] =
            data[category];

        }

      }
    );


  }catch(error){

    console.log(
      error
    );

  }

}


/* =====================================================
   SAVE BASE
===================================================== */

function saveBase(){

  if(
    !baseCharacter
  ){

    return;

  }


  try{

    localStorage.setItem(
      BASE_STORAGE,
      baseCharacter
    );

  }catch(error){

    console.log(
      error
    );

    alert(
      "キャラクター画像を保存できませんでした。"
    );

  }

}


/* =====================================================
   LOAD BASE
===================================================== */

function loadBase(){

  try{

    const saved =
      localStorage.getItem(
        BASE_STORAGE
      );


    if(!saved){

      return;

    }


    baseCharacter =
      saved;


    const layer =
      document.getElementById(
        "baseLayer"
      );


    layer.src =
      saved;


    layer.style.display =
      "block";


    document
    .getElementById(
      "emptyCharacter"
    )
    .style.display =
      "none";


  }catch(error){

    console.log(
      error
    );

  }

}


/* =====================================================
   BASE MODAL
===================================================== */

const baseModal =
  document.getElementById(
    "baseModal"
  );

const baseFile =
  document.getElementById(
    "baseFile"
  );

const basePreview =
  document.getElementById(
    "basePreview"
  );


/* OPEN */

document
.getElementById(
  "baseButton"
)
.addEventListener(
  "click",
  function(){

    baseModal.classList.add(
      "show"
    );

  }
);


/* CANCEL */

document
.getElementById(
  "baseCancel"
)
.addEventListener(
  "click",
  function(){

    baseModal.classList.remove(
      "show"
    );

  }
);


/* FILE */

baseFile.addEventListener(
  "change",
  function(event){

    const file =
      event.target.files[0];


    if(!file){

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(e){

        temporaryBase =
          e.target.result;


        basePreview.src =
          temporaryBase;

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* SAVE */

document
.getElementById(
  "baseSave"
)
.addEventListener(
  "click",
  function(){

    if(
      !temporaryBase
    ){

      alert(
        "キャラクター画像を選択してください。"
      );

      return;

    }


    baseCharacter =
      temporaryBase;


    const layer =
      document.getElementById(
        "baseLayer"
      );


    layer.src =
      baseCharacter;


    layer.style.display =
      "block";


    document
    .getElementById(
      "emptyCharacter"
    )
    .style.display =
      "none";


    saveBase();


    temporaryBase = "";

    baseFile.value = "";

    basePreview.src = "";


    baseModal.classList.remove(
      "show"
    );

  }
);


/* =====================================================
   ITEM MODAL
===================================================== */

const itemModal =
  document.getElementById(
    "itemModal"
  );

const itemFile =
  document.getElementById(
    "itemFile"
  );

const itemPreview =
  document.getElementById(
    "itemPreview"
  );


/* OPEN */

document
.getElementById(
  "itemButton"
)
.addEventListener(
  "click",
  function(){

    itemModal.classList.add(
      "show"
    );

  }
);


/* CANCEL */

document
.getElementById(
  "itemCancel"
)
.addEventListener(
  "click",
  function(){

    itemModal.classList.remove(
      "show"
    );

  }
);


/* FILE */

itemFile.addEventListener(
  "change",
  function(event){

    const file =
      event.target.files[0];


    if(!file){

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(e){

      };

/* =====================================================
   SAVE ITEM
===================================================== */

document
.getElementById(
  "itemSave"
)
.addEventListener(
  "click",
  function(){

    const name =
      document
      .getElementById(
        "itemName"
      )
      .value
      .trim();


    const price =
      Number(
        document
        .getElementById(
          "itemPrice"
        )
        .value
      );


    const category =
      document
      .getElementById(
        "itemCategory"
      )
      .value;


    /* IMAGE */

    if(
      !temporaryItem
    ){

      alert(
        "アイテム画像を選択してください。"
      );

      return;

    }


    /* NAME */

    if(
      !name
    ){

      alert(
        "アイテム名を入力してください。"
      );

      return;

    }


    /* PRICE */

    if(
      isNaN(price) ||
      price < 0
    ){

      alert(
        "コイン数を正しく入力してください。"
      );

      return;

    }


    /* CREATE */

    const item = {

      id:
        Date.now()
        .toString()
        +
        "_"
        +
        Math.random()
        .toString(36)
        .substring(2),

      name:name,

      price:price,

      category:category,

      /*
        元画像を保存
      */

      src:temporaryItem

    };


    /* ADD */

    items[category].push(
      item
    );


    /* SAVE */

    saveItems();


    /* RESET */

    itemFile.value = "";

    document
    .getElementById(
      "itemName"
    )
    .value = "";

    document
    .getElementById(
      "itemPrice"
    )
    .value = "100";

    itemPreview.src = "";

    temporaryItem = "";


    /* CLOSE */

    itemModal.classList.remove(
      "show"
    );


    /*
      登録したカテゴリーを
      そのまま開く
    */

    openItemScreen(
      category
    );

  }
);


/* =====================================================
   MODAL OUTSIDE
===================================================== */

baseModal.addEventListener(
  "click",
  function(event){

    if(
      event.target ===
      baseModal
    ){

      baseModal.classList.remove(
        "show"
      );

    }

  }
);


itemModal.addEventListener(
  "click",
  function(event){

    if(
      event.target ===
      itemModal
    ){

      itemModal.classList.remove(
        "show"
      );

    }

  }
);


/* =====================================================
   START
===================================================== */

loadItems();

loadBase();

updateCoins();

</script>
