<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>ギフトで着せ替え</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background:#f7edf9;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:500px;
  height:100dvh;

  display:flex;
  flex-direction:column;

  background:
    linear-gradient(
      180deg,
      #fff9ff,
      #f7edfa
    );

  overflow:hidden;
}


/* =========================
   HEADER
========================= */

.header{
  flex:0 0 58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:7px 10px;

  background:#fff;

  border-bottom:1px solid #eaddea;

  z-index:50;
}

.title{
  font-size:19px;
  font-weight:900;
  color:#743d7c;

  text-align:center;

  flex:1;
}

.coinBox{
  min-width:95px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;

  padding:7px 8px;

  background:#fff8d9;

  border:2px solid #f0ce54;

  border-radius:20px;

  color:#755b00;

  font-size:12px;
  font-weight:900;
}

#coinCount{
  min-width:35px;
  text-align:center;
}


/* =========================
   CHARACTER
========================= */

.characterArea{
  position:relative;

  flex:1 1 auto;

  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 30%,
      #fff 0%,
      #fff5fd 45%,
      #f0dff5 100%
    );
}

.characterStage{

  position:relative;

  width:min(72vw,360px);

  height:calc(100% - 8px);

  max-height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

}


/*
 全レイヤーを完全に同じ位置に重ねる
*/

.layer{

  position:absolute;

  left:50%;
  top:50%;

  width:100%;
  height:100%;

  transform:
    translate(-50%,-50%);

  object-fit:contain;
  object-position:center;

  pointer-events:none;

  display:none;
}


/*
 本体
*/

#baseLayer{
  display:block;
}


/* =========================
   ワンピース・ドレス
========================= */

.onepieceOn .topLayer,
.onepieceOn .bottomLayer{
  display:none!important;
}

.dressOn .topLayer,
.dressOn .bottomLayer{
  display:none!important;
}


/* =========================
   現在のアイテム
========================= */

.currentItem{

  position:absolute;

  top:8px;
  left:8px;

  padding:5px 9px;

  background:
    rgba(255,255,255,.9);

  border:
    1px solid #e6d5e9;

  border-radius:15px;

  color:#714c77;

  font-size:10px;

  font-weight:800;

  z-index:20;
}


/* =========================
   GIFT AREA
========================= */

.giftArea{

  flex:0 0 42px;

  display:flex;

  gap:5px;

  padding:5px 7px;

  background:#fff;

  border-top:1px solid #eaddea;
  border-bottom:1px solid #eaddea;
}

.giftBtn{

  flex:1;

  border:2px solid #eadb64;

  background:#fffbe5;

  border-radius:18px;

  color:#775e00;

  font-size:10px;

  font-weight:900;

}

.giftBtn:active{
  transform:scale(.96);
}


/* =========================
   BOTTOM PANEL
========================= */

.bottomPanel{

  flex:0 0 39%;

  min-height:230px;

  background:#fff;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}


/* =========================
   TABS
========================= */

.tabs{

  flex:0 0 43px;

  display:flex;

  overflow-x:auto;

  scrollbar-width:none;

  border-bottom:1px solid #eee;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{

  flex:0 0 auto;

  min-width:78px;

  border:none;

  background:#fff;

  color:#8b738f;

  font-size:11px;

  font-weight:900;

  border-bottom:3px solid transparent;
}

.tab.active{

  color:#9b4eaa;

  border-bottom-color:#c968d7;
}


/* =========================
   ITEMS
========================= */

.itemArea{

  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:8px;

  -webkit-overflow-scrolling:touch;
}

.items{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:7px;
}


/* =========================
   ITEM CARD
========================= */

.item{

  position:relative;

  min-width:0;

  padding:5px;

  background:#fff;

  border:
    2px solid #eaddea;

  border-radius:13px;

  cursor:pointer;

}

.item:active{
  transform:scale(.96);
}

.item.selected{

  border-color:#c35bcf;

  box-shadow:
    0 0 0 2px
    rgba(195,91,207,.15);

}

.item.locked{
  opacity:.45;
}

.itemImage{

  width:100%;
  height:60px;

  object-fit:contain;

  background:#faf7fb;

  border-radius:8px;

  display:block;

}

.itemName{

  margin-top:3px;

  text-align:center;

  font-size:9px;

  font-weight:800;

  color:#674e6a;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}

.price{

  margin-top:2px;

  text-align:center;

  font-size:10px;

  font-weight:900;

  color:#946d00;

}


/* =========================
   BASE SETTING
========================= */

.baseSetting{

  flex:0 0 39px;

  padding:4px 7px;

  background:#fff;

  border-top:1px solid #eee;

}

.baseButton{

  width:100%;

  height:31px;

  border:none;

  border-radius:17px;

  background:#8f55a0;

  color:#fff;

  font-size:11px;

  font-weight:900;

}


/* =========================
   UPLOAD MODAL
========================= */

.modal{

  position:fixed;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    rgba(45,20,50,.55);

  z-index:200;
}

.modal.show{
  display:flex;
}

.modalBox{

  width:88%;

  max-width:370px;

  max-height:90vh;

  overflow:auto;

  background:#fff;

  border-radius:24px;

  padding:20px;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.25);

}

.modalTitle{

  text-align:center;

  font-size:19px;

  font-weight:900;

  color:#78427f;

  margin-bottom:15px;

}

.uploadRow{

  margin-bottom:13px;

  padding:11px;

  background:#f8f0fa;

  border-radius:15px;

}

.uploadRow label{

  display:block;

  margin-bottom:5px;

  color:#714778;

  font-size:12px;

  font-weight:900;

}

.uploadRow input{

  width:100%;

  font-size:11px;

}

.closeButton{

  width:100%;

  height:40px;

  margin-top:5px;

  border:none;

  border-radius:20px;

  background:#9c54aa;

  color:#fff;

  font-weight:900;

}


/* =========================
   ITEM GET MODAL
========================= */

.getModal{

  position:fixed;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    rgba(50,20,55,.45);

  z-index:300;

}

.getModal.show{
  display:flex;
}

.getBox{

  width:82%;

  max-width:330px;

  padding:25px 18px;

  background:#fff;

  border-radius:25px;

  text-align:center;

}

.getEmoji{
  font-size:45px;
}

.getTitle{

  margin-top:6px;

  color:#9b45aa;

  font-size:22px;

  font-weight:900;

}

.getName{

  margin-top:7px;

  color:#654d69;

  font-size:13px;

  font-weight:800;

}

.getClose{

  width:100%;

  height:42px;

  margin-top:15px;

  border:none;

  border-radius:21px;

  background:#a653b1;

  color:#fff;

  font-weight:900;

}


/* =========================
   TOAST
========================= */

.toast{

  position:fixed;

  left:50%;

  bottom:45%;

  transform:
    translate(-50%,20px);

  padding:10px 17px;

  background:#5f4265;

  color:#fff;

  border-radius:22px;

  font-size:12px;

  font-weight:900;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  z-index:500;

  white-space:nowrap;

}

.toast.show{

  opacity:1;

  transform:
    translate(-50%,0);

}

</style>
</head>


<body>

<div class="app">


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="title">
    🎀 ギフトで着せ替え
  </div>

  <div class="coinBox">
    🪙
    <span id="coinCount">0</span>
    コイン
  </div>

</header>


<!-- =========================
     CHARACTER
========================= -->

<section class="characterArea">

  <div
    class="currentItem"
    id="currentItem">

    ベースキャラクター

  </div>


  <div
    class="characterStage"
    id="characterStage">


    <!-- ① 本体 -->

    <img
      id="baseLayer"
      class="layer"
      src=""
      alt="本体">


    <!-- ② 靴 -->

    <img
      id="shoesLayer"
      class="layer"
      src=""
      alt="靴">


    <!-- ③ ボトムス -->

    <img
      id="bottomLayer"
      class="layer bottomLayer"
      src=""
      alt="ボトムス">


    <!-- ④ ワンピース -->

    <img
      id="onepieceLayer"
      class="layer"
      src=""
      alt="ワンピース">


    <!-- ⑤ ドレス -->

    <img
      id="dressLayer"
      class="layer"
      src=""
      alt="ドレス">


    <!-- ⑥ トップス -->

    <img
      id="topLayer"
      class="layer topLayer"
      src=""
      alt="トップス">


    <!-- ⑦ アウター -->

    <img
      id="outerLayer"
      class="layer"
      src=""
      alt="アウター">


    <!-- ⑧ 髪 -->

    <img
      id="hairLayer"
      class="layer"
      src=""
      alt="髪型">


    <!-- ⑨ アクセサリー -->

    <img
      id="accessoryLayer"
      class="layer"
      src=""
      alt="アクセサリー">

  </div>

</section>


<!-- =========================
     GIFTS
========================= -->

<div class="giftArea">

  <button
    class="giftBtn"
    onclick="addCoins(1)">
    💗 1コイン
  </button>

  <button
    class="giftBtn"
    onclick="addCoins(10)">
    🍩 10コイン
  </button>

  <button
    class="giftBtn"
    onclick="addCoins(100)">
    🎁 100コイン
  </button>

  <button
    class="giftBtn"
    onclick="addCoins(500)">
    💎 500コイン
  </button>

</div>


<!-- =========================
     ITEM PANEL
========================= -->

<section class="bottomPanel">


  <!-- TABS -->

  <nav class="tabs">

    <button
      class="tab active"
      onclick="changeCategory('top',this)">
      👚 トップス
    </button>

    <button
      class="tab"
      onclick="changeCategory('onepiece',this)">
      👗 ワンピース
    </button>

    <button
      class="tab"
      onclick="changeCategory('dress',this)">
      👑 ドレス
    </button>

    <button
      class="tab"
      onclick="changeCategory('bottom',this)">
      👖 ボトムス
    </button>

    <button
      class="tab"
      onclick="changeCategory('outer',this)">
      🧥 アウター
    </button>

    <button
      class="tab"
      onclick="changeCategory('hair',this)">
      💇 髪型
    </button>

    <button
      class="tab"
      onclick="changeCategory('accessory',this)">
      💎 アクセ
    </button>

    <button
      class="tab"
      onclick="changeCategory('shoes',this)">
      👟 靴
    </button>

  </nav>


  <!-- ITEMS -->

  <div class="itemArea">

    <div
      class="items"
      id="items">
    </div>

  </div>


  <!-- BASE -->

  <div class="baseSetting">

    <button
      class="baseButton"
      onclick="openBaseSetting()">

      👤 ベースキャラクターを設定

    </button>

  </div>

</section>

</div>


<!-- =========================
     BASE SETTING MODAL
========================= -->

<div
  class="modal"
  id="baseModal">

  <div class="modalBox">

    <div class="modalTitle">
      👤 ベースキャラクター設定
    </div>


    <div class="uploadRow">

      <label>
        キャラクター本体の画像
      </label>

      <input
        type="file"
        id="baseInput"
        accept="image/*"
        onchange="setBaseCharacter(event)">

    </div>


    <button
      class="closeButton"
      onclick="closeBaseSetting()">

      ✓ 設定完了

    </button>

  </div>

</div>


<!-- =========================
     GET MODAL
========================= -->

<div
  class="getModal"
  id="getModal">

  <div class="getBox">

    <div class="getEmoji">
      ✨
    </div>

    <div class="getTitle">
      アイテムGET！
    </div>

    <div
      class="getName"
      id="getName">
    </div>

    <button
      class="getClose"
      onclick="closeGetModal()">

      着せる

    </button>

  </div>

</div>


<div
  class="toast"
  id="toast">
</div>


<script>

/* =====================================================
   コイン
===================================================== */

let coins = 0;


/* =====================================================
   現在のカテゴリー
===================================================== */

let currentCategory = "top";


/* =====================================================
   現在着ているアイテム
===================================================== */

let selected = {

  top:null,

  onepiece:null,

  dress:null,

  bottom:null,

  outer:null,

  hair:null,

  accessory:null,

  shoes:null

};


/* =====================================================
   アイテムデータ
=====================================================

   price が必要コイン数です。

   例：
   price:100

   → 100コイン必要
===================================================== */

const items = {


  /* トップス */

  top:[

    {
      id:"top1",
      name:"ハートトップス",
      price:10,
      src:""
    },

    {
      id:"top2",
      name:"リボンブラウス",
      price:100,
      src:""
    },

    {
      id:"top3",
      name:"パーカー",
      price:100,
      src:""
    },

    {
      id:"top4",
      name:"ブラックトップス",
      price:500,
      src:""
    }

  ],


  /* ワンピース */

  onepiece:[

    {
      id:"onepiece1",
      name:"ピンクワンピース",
      price:100,
      src:""
    },

    {
      id:"onepiece2",
      name:"ハートワンピース",
      price:500,
      src:""
    }

  ],


  /* ドレス */

  dress:[

    {
      id:"dress1",
      name:"ピンクドレス",
      price:100,
      src:""
    },

    {
      id:"dress2",
      name:"プリンセスドレス",
      price:500,
      src:""
    },

    {
      id:"dress3",
      name:"スペシャルドレス",
      price:1000,
      src:""
    }

  ],


  /* ボトムス */

  bottom:[

    {
      id:"bottom1",
      name:"ピンクスカート",
      price:10,
      src:""
    },

    {
      id:"bottom2",
      name:"ブラックスカート",
      price:100,
      src:""
    },

    {
      id:"bottom3",
      name:"デニムショートパンツ",
      price:100,
      src:""
    },

    {
      id:"bottom4",
      name:"カーゴパンツ",
      price:500,
      src:""
    }

  ],


  /* アウター */

  outer:[

    {
      id:"outer1",
      name:"ハートジャケット",
      price:100,
      src:""
    },

    {
      id:"outer2",
      name:"ピンクアウター",
      price:500,
      src:""
    },

    {
      id:"outer3",
      name:"デニムジャケット",
      price:100,
      src:""
    }

  ],


  /* 髪 */

  hair:[

    {
      id:"hair1",
      name:"ロングヘア",
      price:100,
      src:""
    },

    {
      id:"hair2",
      name:"ハーフアップ",
      price:100,
      src:""
    },

    {
      id:"hair3",
      name:"ツインテール",
      price:500,
      src:""
    },

    {
      id:"hair4",
      name:"おだんご",
      price:500,
      src:""
    }

  ],


  /* アクセサリー */

  accessory:[

    {
      id:"accessory1",
      name:"ハートネックレス",
      price:10,
      src:""
    },

    {
      id:"accessory2",
      name:"ハートイヤリング",
      price:100,
      src:""
    },

    {
      id:"accessory3",
      name:"ハートメガネ",
      price:500,
      src:""
    }

  ],


  /* 靴 */

  shoes:[

    {
      id:"shoes1",
      name:"ブラックシューズ",
      price:10,
      src:""
    },

    {
      id:"shoes2",
      name:"ブラックブーツ",
      price:100,
      src:""
    },

    {
      id:"shoes3",
      name:"うさぎシューズ",
      price:500,
      src:""
    },

    {
      id:"shoes4",
      name:"リボンブーツ",
      price:500,
      src:""
    }

  ]

};


/* =====================================================
   初期表示
===================================================== */

renderItems();


/* =====================================================
   ベースキャラクター設定
===================================================== */

function openBaseSetting(){

  document
    .getElementById("baseModal")
    .classList.add("show");

}


function closeBaseSetting(){

  document
    .getElementById("baseModal")
    .classList.remove("show");

}


/*
  選択した画像を本体に設定
*/

function setBaseCharacter(event){

  const file =
    event.target.files[0];

  if(!file) return;


  const reader =
    new FileReader();


  reader.onload=function(e){

    const base =
      document.getElementById(
        "baseLayer"
      );

    base.src =
      e.target.result;

    base.style.display =
      "block";


    showToast(
      "👤 ベースキャラクターを設定しました"
    );

  };


  reader.readAsDataURL(file);

}


/* =====================================================
   コイン追加
===================================================== */

function addCoins(value){

  coins += value;

  document.getElementById(
    "coinCount"
  ).textContent =
    coins;

  showToast(
    `🪙 ${value}コイン追加！`
  );

  renderItems();

}


/* =====================================================
   カテゴリー変更
===================================================== */

function changeCategory(category,button){

  currentCategory =
    category;


  document
    .querySelectorAll(".tab")
    .forEach(tab=>{

      tab.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );


  renderItems();

}


/* =====================================================
   アイテム表示
===================================================== */

function renderItems(){

  const container =
    document.getElementById(
      "items"
    );


  container.innerHTML = "";


  const list =
    items[currentCategory] || [];


  list.forEach(item=>{

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "item";


    if(
      selected[currentCategory] &&
      selected[currentCategory].id === item.id
    ){

      card.classList.add(
        "selected"
      );

    }


    if(
      coins < item.price
    ){

      card.classList.add(
        "locked"
      );

    }


    card.innerHTML = `

      ${
        item.src

        ?

        `<img
          class="itemImage"
          src="${item.src}"
          alt=""
        >`

        :

        `<div
          class="itemImage"
          style="
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:25px;
          "
        >
          🖼️
        </div>`
      }


      <div class="itemName">
        ${escapeHTML(item.name)}
      </div>


      <div class="price">
        🪙 ${item.price}
      </div>

    `;


    card.onclick =
      ()=>{
        selectItem(item);
      };


    container.appendChild(
      card
    );

  });

}


/* =====================================================
   アイテム選択
===================================================== */

function selectItem(item){

  /*
    コイン不足
  */

  if(
    coins < item.price
  ){

    const need =
      item.price - coins;

    showToast(
      `🪙 あと ${need}コイン必要です`
    );

    return;

  }


  /*
    コイン消費
  */

  coins -= item.price;


  document.getElementById(
    "coinCount"
  ).textContent =
    coins;


  /*
    選択状態
  */

  selected[currentCategory] =
    item;


  /*
    着せる
  */

  wearItem(
    currentCategory,
    item
  );


  /*
    GET表示
  */

  document.getElementById(
    "getName"
  ).textContent =
    `${item.name}をGETしました！`;


  document
    .getElementById("getModal")
    .classList.add("show");


  renderItems();

}


/* =====================================================
   着せる
===================================================== */

function wearItem(
  category,
  item
){

  const layerMap = {

    top:"topLayer",

    onepiece:"onepieceLayer",

    dress:"dressLayer",

    bottom:"bottomLayer",

    outer:"outerLayer",

    hair:"hairLayer",

    accessory:"accessoryLayer",

    shoes:"shoesLayer"

  };


  const layer =
    document.getElementById(
      layerMap[category]
    );


  if(!layer) return;


  if(item.src){

    layer.src =
      item.src;

    layer.style.display =
      "block";

  }


  const stage =
    document.getElementById(
      "characterStage"
    );


  /*
    ワンピース
  */

  if(category === "onepiece"){

    stage.classList.add(
      "onepieceOn"
    );

    stage.classList.remove(
      "dressOn"
    );

    hideLayer(
      "dressLayer"
    );

  }


  /*
    ドレス
  */

  if(category === "dress"){

    stage.classList.add(
      "dressOn"
    );

    stage.classList.remove(
      "onepieceOn"
    );

    hideLayer(
      "onepieceLayer"
    );

  }


  /*
    トップス・ボトムスを選んだら
    ワンピースとドレスを解除
  */

  if(
    category === "top" ||
    category === "bottom"
  ){

    stage.classList.remove(
      "onepieceOn"
    );

    stage.classList.remove(
      "dressOn"
    );

    hideLayer(
      "onepieceLayer"
    );

    hideLayer(
      "dressLayer"
    );

  }


  /*
    現在の表示
  */

  document.getElementById(
    "currentItem"
  ).textContent =
    item.name;

}


/* =====================================================
   レイヤーを非表示
===================================================== */

function hideLayer(id){

  const layer =
    document.getElementById(id);

  if(layer){

    layer.style.display =
      "none";

  }

}


/* =====================================================
   GETモーダルを閉じる
===================================================== */

function closeGetModal(){

  document
    .getElementById("getModal")
    .classList.remove(
      "show"
    );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(()=>{

      toast.classList.remove(
        "show"
      );

    },1800);

}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHTML(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
