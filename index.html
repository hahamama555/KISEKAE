<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>ギフトで着せ替え</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background:#f7edf9;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:500px;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(
      180deg,
      #fff9ff,
      #f7edfa
    );
  overflow:hidden;
}


/* =========================
 HEADER
========================= */

.header{
  flex:0 0 58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 10px;
  background:#fff;
  border-bottom:1px solid #eaddea;
  z-index:50;
}

.title{
  font-size:19px;
  font-weight:900;
  color:#743d7c;
  text-align:center;
  flex:1;
}

.coinBox{
  min-width:95px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:7px 8px;
  background:#fff8d9;
  border:2px solid #f0ce54;
  border-radius:20px;
  color:#755b00;
  font-size:12px;
  font-weight:900;
}

#coinCount{
  min-width:35px;
  text-align:center;
}


/* =========================
 CHARACTER
========================= */

.characterArea{
  position:relative;
  flex:1 1 auto;
  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 30%,
      #fff 0%,
      #fff5fd 45%,
      #f0dff5 100%
    );
}

.characterStage{
  position:relative;
  width:min(72vw,360px);
  height:calc(100% - 8px);
  max-height:100%;

  display:flex;
  align-items:center;
  justify-content:center;
}

.layer{
  position:absolute;

  left:50%;
  top:50%;

  width:100%;
  height:100%;

  transform:
    translate(-50%,-50%);

  object-fit:contain;
  object-position:center;

  pointer-events:none;

  display:none;
}

#baseLayer{
  display:block;
}


/* =========================
 ワンピース・ドレス
========================= */

.onepieceOn .topLayer,
.onepieceOn .bottomLayer{
  display:none!important;
}

.dressOn .topLayer,
.dressOn .bottomLayer{
  display:none!important;
}


/* =========================
 CURRENT
========================= */

.currentItem{
  position:absolute;
  top:8px;
  left:8px;

  padding:5px 9px;

  background:
    rgba(255,255,255,.9);

  border:1px solid #e6d5e9;

  border-radius:15px;

  color:#714c77;

  font-size:10px;
  font-weight:800;

  z-index:20;
}


/* =========================
 GIFT
========================= */

.giftArea{
  flex:0 0 42px;

  display:flex;
  gap:5px;

  padding:5px 7px;

  background:#fff;

  border-top:1px solid #eaddea;
  border-bottom:1px solid #eaddea;
}

.giftBtn{
  flex:1;

  border:2px solid #eadb64;

  background:#fffbe5;

  border-radius:18px;

  color:#775e00;

  font-size:10px;
  font-weight:900;
}

.giftBtn:active{
  transform:scale(.96);
}


/* =========================
 BOTTOM PANEL
========================= */

.bottomPanel{
  flex:0 0 39%;

  min-height:230px;

  background:#fff;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}


/* =========================
 TABS
========================= */

.tabs{
  flex:0 0 43px;

  display:flex;

  overflow-x:auto;

  scrollbar-width:none;

  border-bottom:1px solid #eee;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:0 0 auto;

  min-width:78px;

  border:none;

  background:#fff;

  color:#8b738f;

  font-size:11px;

  font-weight:900;

  border-bottom:3px solid transparent;
}

.tab.active{
  color:#9b4eaa;
  border-bottom-color:#c968d7;
}


/* =========================
 ITEMS
========================= */

.itemArea{
  flex:1;
  min-height:0;

  overflow-y:auto;

  padding:8px;

  -webkit-overflow-scrolling:touch;
}

.items{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:7px;
}

.item{
  position:relative;

  min-width:0;

  padding:5px;

  background:#fff;

  border:2px solid #eaddea;

  border-radius:13px;

  cursor:pointer;
}

.item:active{
  transform:scale(.96);
}

.item.selected{
  border-color:#c35bcf;

  box-shadow:
    0 0 0 2px
    rgba(195,91,207,.15);
}

.item.locked{
  opacity:.45;
}

.itemImage{
  width:100%;
  height:60px;

  object-fit:contain;

  background:#faf7fb;

  border-radius:8px;

  display:block;
}

.itemName{
  margin-top:3px;

  text-align:center;

  font-size:9px;

  font-weight:800;

  color:#674e6a;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.price{
  margin-top:2px;

  text-align:center;

  font-size:10px;

  font-weight:900;

  color:#946d00;
}


/* =========================
 BASE SETTING
========================= */

.baseSetting{
  flex:0 0 39px;

  padding:4px 7px;

  background:#fff;

  border-top:1px solid #eee;

  display:flex;
  gap:5px;
}

.baseButton,
.itemSettingButton{
  height:31px;

  border:none;

  border-radius:17px;

  color:#fff;

  font-size:11px;

  font-weight:900;
}

.baseButton{
  flex:1;
  background:#8f55a0;
}

.itemSettingButton{
  flex:1;
  background:#c35bcf;
}


/* =========================
 MODAL
========================= */

.modal{
  position:fixed;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    rgba(45,20,50,.55);

  z-index:200;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:88%;
  max-width:370px;

  max-height:90vh;

  overflow:auto;

  background:#fff;

  border-radius:24px;

  padding:20px;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.25);
}

.modalTitle{
  text-align:center;

  font-size:19px;

  font-weight:900;

  color:#78427f;

  margin-bottom:15px;
}


/* =========================
 FORM
========================= */

.uploadRow{
  margin-bottom:13px;

  padding:11px;

  background:#f8f0fa;

  border-radius:15px;
}

.uploadRow label{
  display:block;

  margin-bottom:6px;

  color:#714778;

  font-size:12px;

  font-weight:900;
}

.uploadRow input,
.uploadRow select{
  width:100%;

  min-height:35px;

  padding:6px;

  border:1px solid #ddd;

  border-radius:8px;

  font-size:12px;

  background:#fff;
}

.preview{
  width:100%;
  height:120px;

  margin-top:8px;

  object-fit:contain;

  background:#fff;

  border-radius:10px;

  display:none;
}

.registerButton{
  width:100%;

  height:42px;

  border:none;

  border-radius:21px;

  background:#9c54aa;

  color:#fff;

  font-size:13px;

  font-weight:900;
}

.closeButton{
  width:100%;

  height:40px;

  margin-top:7px;

  border:none;

  border-radius:20px;

  background:#eee;

  color:#765f79;

  font-weight:900;
}


/* =========================
 SETTING LIST
========================= */

.settingList{
  max-height:220px;

  overflow-y:auto;

  margin-bottom:10px;
}

.settingItem{
  display:flex;

  align-items:center;

  gap:8px;

  padding:7px;

  margin-bottom:6px;

  background:#faf6fb;

  border-radius:12px;
}

.settingItem img{
  width:48px;
  height:48px;

  object-fit:contain;

  background:#fff;

  border-radius:8px;
}

.settingInfo{
  flex:1;
  min-width:0;
}

.settingName{
  font-size:11px;
  font-weight:900;
  color:#654d69;
}

.settingPrice{
  font-size:10px;
  color:#946d00;
  margin-top:2px;
}

.deleteButton{
  width:48px;
  height:30px;

  border:none;

  border-radius:15px;

  background:#f2d9df;

  color:#9b4053;

  font-size:10px;

  font-weight:900;
}


/* =========================
 GET MODAL
========================= */

.getModal{
  position:fixed;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    rgba(50,20,55,.45);

  z-index:300;
}

.getModal.show{
  display:flex;
}

.getBox{
  width:82%;
  max-width:330px;

  padding:25px 18px;

  background:#fff;

  border-radius:25px;

  text-align:center;
}

.getEmoji{
  font-size:45px;
}

.getTitle{
  margin-top:6px;

  color:#9b45aa;

  font-size:22px;

  font-weight:900;
}

.getName{
  margin-top:7px;

  color:#654d69;

  font-size:13px;

  font-weight:800;
}

.getClose{
  width:100%;

  height:42px;

  margin-top:15px;

  border:none;

  border-radius:21px;

  background:#a653b1;

  color:#fff;

  font-weight:900;
}


/* =========================
 TOAST
========================= */

.toast{
  position:fixed;

  left:50%;

  bottom:45%;

  transform:
    translate(-50%,20px);

  padding:10px 17px;

  background:#5f4265;

  color:#fff;

  border-radius:22px;

  font-size:12px;

  font-weight:900;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  z-index:500;

  white-space:nowrap;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

</style>
</head>


<body>

<div class="app">


<!-- =========================
 HEADER
========================= -->

<header class="header">

  <div class="title">
    🎀 ギフトで着せ替え
  </div>

  <div class="coinBox">
    🪙
    <span id="coinCount">0</span>
    コイン
  </div>

</header>


<!-- =========================
 CHARACTER
========================= -->

<section class="characterArea">

  <div
    class="currentItem"
    id="currentItem">
    ベースキャラクター
  </div>


  <div
    class="characterStage"
    id="characterStage">


    <!-- 本体 -->

    <img
      id="baseLayer"
      class="layer"
      src=""
      alt="本体">


    <!-- 靴 -->

    <img
      id="shoesLayer"
      class="layer"
      src=""
      alt="靴">


    <!-- ボトムス -->

    <img
      id="bottomLayer"
      class="layer bottomLayer"
      src=""
      alt="ボトムス">


    <!-- ワンピース -->

    <img
      id="onepieceLayer"
      class="layer"
      src=""
      alt="ワンピース">


    <!-- ドレス -->

    <img
      id="dressLayer"
      class="layer"
      src=""
      alt="ドレス">


    <!-- トップス -->

    <img
      id="topLayer"
      class="layer topLayer"
      src=""
      alt="トップス">


    <!-- アウター -->

    <img
      id="outerLayer"
      class="layer"
      src=""
      alt="アウター">


    <!-- 髪 -->

    <img
      id="hairLayer"
      class="layer"
      src=""
      alt="髪型">


    <!-- アクセサリー -->

    <img
      id="accessoryLayer"
      class="layer"
      src=""
      alt="アクセサリー">

  </div>

</section>


<!-- =========================
 GIFTS
========================= -->

<div class="giftArea">

  <button
    class="giftBtn"
    onclick="addCoins(1)">
    💗 1コイン
  </button>

  <button
    class="giftBtn"
    onclick="addCoins(10)">
    🍩 10コイン
  </button>

  <button
    class="giftBtn"
    onclick="addCoins(100)">
    🎁 100コイン
  </button>

  <button
    class="giftBtn"
    onclick="addCoins(500)">
    💎 500コイン
  </button>

</div>


<!-- =========================
 ITEM PANEL
========================= -->

<section class="bottomPanel">


<nav class="tabs">

  <button
    class="tab active"
    onclick="changeCategory('top',this)">
    👚 トップス
  </button>

  <button
    class="tab"
    onclick="changeCategory('onepiece',this)">
    👗 ワンピース
  </button>

  <button
    class="tab"
    onclick="changeCategory('dress',this)">
    👑 ドレス
  </button>

  <button
    class="tab"
    onclick="changeCategory('bottom',this)">
    👖 ボトムス
  </button>

  <button
    class="tab"
    onclick="changeCategory('outer',this)">
    🧥 アウター
  </button>

  <button
    class="tab"
    onclick="changeCategory('hair',this)">
    💇 髪型
  </button>

  <button
    class="tab"
    onclick="changeCategory('accessory',this)">
    💎 アクセ
  </button>

  <button
    class="tab"
    onclick="changeCategory('shoes',this)">
    👟 靴
  </button>

</nav>


<div class="itemArea">

  <div
    class="items"
    id="items">
  </div>

</div>


<div class="baseSetting">

  <button
    class="baseButton"
    onclick="openBaseSetting()">

    👤 ベースキャラクター

  </button>

  <button
    class="itemSettingButton"
    onclick="openItemSetting()">

    ➕ アイテム設定

  </button>

</div>

</section>

</div>


<!-- =========================
 BASE MODAL
========================= -->

<div
  class="modal"
  id="baseModal">

  <div class="modalBox">

    <div class="modalTitle">
      👤 ベースキャラクター設定
    </div>


    <div class="uploadRow">

      <label>
        キャラクター本体の画像
      </label>

      <input
        type="file"
        id="baseInput"
        accept="image/*"
        onchange="setBaseCharacter(event)">

      <img
        id="basePreview"
        class="preview">

    </div>


    <button
      class="closeButton"
      onclick="closeBaseSetting()">

      ✓ 設定完了

    </button>

  </div>

</div>


<!-- =========================
 ITEM SETTING MODAL
========================= -->

<div
  class="modal"
  id="itemModal">

  <div class="modalBox">

    <div class="modalTitle">
      ➕ アイテム設定
    </div>


    <div class="uploadRow">

      <label>
        アイテム画像
      </label>

      <input
        type="file"
        id="itemImageInput"
        accept="image/*"
        onchange="previewItemImage(event)">

      <img
        id="itemPreview"
        class="preview">

    </div>


    <div class="uploadRow">

      <label>
        アイテム名
      </label>

      <input
        type="text"
        id="itemNameInput"
        placeholder="例：ピンクドレス">

    </div>


    <div class="uploadRow">

      <label>
        必要コイン数
      </label>

      <input
        type="number"
        id="itemPriceInput"
        min="1"
        value="100"
        inputmode="numeric">

    </div>


    <div class="uploadRow">

      <label>
        アイテムの種類
      </label>

      <select id="itemCategoryInput">

        <option value="top">
          👚 トップス
        </option>

        <option value="onepiece">
          👗 ワンピース
        </option>

        <option value="dress">
          👑 ドレス
        </option>

        <option value="bottom">
          👖 ボトムス
        </option>

        <option value="outer">
          🧥 アウター
        </option>

        <option value="hair">
          💇 髪型
        </option>

        <option value="accessory">
          💎 アクセサリー
        </option>

        <option value="shoes">
          👟 靴
        </option>

      </select>

    </div>


    <button
      class="registerButton"
      onclick="registerItem()">

      ✓ アイテムを登録

    </button>


    <button
      class="closeButton"
      onclick="closeItemSetting()">

      閉じる

    </button>


    <div
      id="settingList"
      class="settingList">
    </div>

  </div>

</div>


<!-- =========================
 GET MODAL
========================= -->

<div
  class="getModal"
  id="getModal">

  <div class="getBox">

    <div class="getEmoji">
      ✨
    </div>

    <div class="getTitle">
      アイテムGET！
    </div>

    <div
      class="getName"
      id="getName">
    </div>

    <button
      class="getClose"
      onclick="closeGetModal()">

      着せる

    </button>

  </div>

</div>


<div
  class="toast"
  id="toast">
</div>


<script>

/* =====================================================
 コイン
===================================================== */

let coins = 0;


/* =====================================================
 カテゴリー
===================================================== */

let currentCategory = "top";


/* =====================================================
 選択中アイテム
===================================================== */

let selected = {

  top:null,
  onepiece:null,
  dress:null,
  bottom:null,
  outer:null,
  hair:null,
  accessory:null,
  shoes:null

};


/* =====================================================
 アイテムデータ
===================================================== */

const items = {

  top:[],
  onepiece:[],
  dress:[],
  bottom:[],
  outer:[],
  hair:[],
  accessory:[],
  shoes:[]

};


/* =====================================================
 初期表示
===================================================== */

renderItems();


/* =====================================================
 ベース設定
===================================================== */

function openBaseSetting(){

  document
    .getElementById("baseModal")
    .classList.add("show");

}


function closeBaseSetting(){

  document
    .getElementById("baseModal")
    .classList.remove("show");

}


function setBaseCharacter(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload=function(e){

    const base =
      document.getElementById(
        "baseLayer"
      );

    base.src =
      e.target.result;

    base.style.display =
      "block";


    const preview =
      document.getElementById(
        "basePreview"
      );

    preview.src =
      e.target.result;

    preview.style.display =
      "block";


    showToast(
      "👤 ベースキャラクターを設定しました"
    );

  };

  reader.readAsDataURL(file);

}


/* =====================================================
 コイン追加
===================================================== */

function addCoins(value){

  coins += value;

  document.getElementById(
    "coinCount"
  ).textContent =
    coins;

  showToast(
    `🪙 ${value}コイン追加！`
  );

  renderItems();

}


/* =====================================================
 カテゴリー
===================================================== */

function changeCategory(category,button){

  currentCategory =
    category;

  document
    .querySelectorAll(".tab")
    .forEach(tab=>{

      tab.classList.remove(
        "active"
      );

    });

  button.classList.add(
    "active"
  );

  renderItems();

}


/* =====================================================
 アイテム設定
===================================================== */

function openItemSetting(){

  document
    .getElementById("itemModal")
    .classList.add("show");

  document
    .getElementById("itemCategoryInput")
    .value =
    currentCategory;

  renderSettingList();

}


function closeItemSetting(){

  document
    .getElementById("itemModal")
    .classList.remove("show");

}


/* =====================================================
 アイテム画像プレビュー
===================================================== */

function previewItemImage(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload=function(e){

    const preview =
      document.getElementById(
        "itemPreview"
      );

    preview.src =
      e.target.result;

    preview.style.display =
      "block";

  };

  reader.readAsDataURL(file);

}


/* =====================================================
 アイテム登録
===================================================== */

function registerItem(){

  const fileInput =
    document.getElementById(
      "itemImageInput"
    );

  const nameInput =
    document.getElementById(
      "itemNameInput"
    );

  const priceInput =
    document.getElementById(
      "itemPriceInput"
    );

  const categoryInput =
    document.getElementById(
      "itemCategoryInput"
    );


  const file =
    fileInput.files[0];

  const name =
    nameInput.value.trim();

  const price =
    Number(
      priceInput.value
    );

  const category =
    categoryInput.value;


  if(!file){

    showToast(
      "📷 アイテム画像を選んでください"
    );

    return;

  }


  if(!name){

    showToast(
      "✏️ アイテム名を入力してください"
    );

    return;

  }


  if(
    !price ||
    price < 1
  ){

    showToast(
      "🪙 コイン数を入力してください"
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload=function(e){

    const newItem = {

      id:
        "item_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2),

      name:name,

      price:price,

      src:e.target.result

    };


    items[category].push(
      newItem
    );


    showToast(
      "✨ アイテムを登録しました！"
    );


    /* 入力欄リセット */

    fileInput.value = "";

    nameInput.value = "";

    priceInput.value = 100;

    document
      .getElementById(
        "itemPreview"
      ).style.display =
      "none";


    renderSettingList();


    /* 登録したカテゴリーへ */

    currentCategory =
      category;


    document
      .querySelectorAll(".tab")
      .forEach(tab=>{

        tab.classList.remove(
          "active"
        );

      });


    const tabs =
      document.querySelectorAll(
        ".tab"
      );

    const categoryIndex = {

      top:0,
      onepiece:1,
      dress:2,
      bottom:3,
      outer:4,
      hair:5,
      accessory:6,
      shoes:7

    };


    if(
      tabs[categoryIndex[category]]
    ){

      tabs[
        categoryIndex[category]
      ].classList.add(
        "active"
      );

    }


    renderItems();

  };


  reader.readAsDataURL(file);

}


/* =====================================================
 アイテム一覧
===================================================== */

function renderSettingList(){

  const container =
    document.getElementById(
      "settingList"
    );

  container.innerHTML = "";


  Object.keys(items)
    .forEach(category=>{

      items[category]
        .forEach(item=>{

          const row =
            document.createElement(
              "div"
            );

          row.className =
            "settingItem";


          row.innerHTML = `

            <img
              src="${item.src}"
              alt=""
            >

            <div
              class="settingInfo">

              <div
                class="settingName">

                ${escapeHTML(item.name)}

              </div>

              <div
                class="settingPrice">

                🪙 ${item.price}

              </div>

            </div>

            <button
              class="deleteButton">

              削除

            </button>

          `;


          row
            .querySelector(
              ".deleteButton"
            )
            .onclick =
            function(){

              deleteItem(
                category,
                item.id
              );

            };


          container.appendChild(
            row
          );

        });

    });

}


/* =====================================================
 アイテム削除
===================================================== */

function deleteItem(
  category,
  id
){

  const index =
    items[category]
      .findIndex(
        item =>
          item.id === id
      );


  if(index === -1)
    return;


  const item =
    items[category][index];


  items[category]
    .splice(index,1);


  if(
    selected[category] &&
    selected[category].id === id
  ){

    selected[category] =
      null;

    const layerMap = {

      top:"topLayer",
      onepiece:"onepieceLayer",
      dress:"dressLayer",
      bottom:"bottomLayer",
      outer:"outerLayer",
      hair:"hairLayer",
      accessory:"accessoryLayer",
      shoes:"shoesLayer"

    };


    hideLayer(
      layerMap[category]
    );

  }


  renderSettingList();
  renderItems();

  showToast(
    `${item.name}を削除しました`
  );

}


/* =====================================================
 アイテム表示
===================================================== */

function renderItems(){

  const container =
    document.getElementById(
      "items"
    );

  container.innerHTML = "";


  const list =
    items[currentCategory] || [];


  if(list.length === 0){

    container.innerHTML = `

      <div
        style="
        grid-column:1/-1;
        text-align:center;
        padding:25px 10px;
        color:#9b849f;
        font-size:12px;
        font-weight:800;
        "
      >

        まだアイテムがありません<br>
        下の「➕ アイテム設定」から追加してください

      </div>

    `;

    return;

  }


  list.forEach(item=>{

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "item";


    if(
      selected[currentCategory] &&
      selected[currentCategory].id === item.id
    ){

      card.classList.add(
        "selected"
      );

    }


    if(
      coins < item.price
    ){

      card.classList.add(
        "locked"
      );

    }


    card.innerHTML = `

      <img
        class="itemImage"
        src="${item.src}"
        alt=""
      >

      <div
        class="itemName">

        ${escapeHTML(item.name)}

      </div>

      <div
        class="price">

        🪙 ${item.price}

      </div>

    `;


    card.onclick =
      function(){

        selectItem(item);

      };


    container.appendChild(
      card
    );

  });

}


/* =====================================================
 アイテム選択
===================================================== */

function selectItem(item){

  if(
    coins < item.price
  ){

    const need =
      item.price - coins;

    showToast(
      `🪙 あと ${need}コイン必要です`
    );

    return;

  }


  coins -= item.price;


  document.getElementById(
    "coinCount"
  ).textContent =
    coins;


  selected[currentCategory] =
    item;


  wearItem(
    currentCategory,
    item
  );


  document.getElementById(
    "getName"
  ).textContent =
    `${item.name}をGETしました！`;


  document
    .getElementById("getModal")
    .classList.add("show");


  renderItems();

}


/* =====================================================
 着せる
===================================================== */

function wearItem(
  category,
  item
){

  const layerMap = {

    top:"topLayer",

    onepiece:"onepieceLayer",

    dress:"dressLayer",

    bottom:"bottomLayer",

    outer:"outerLayer",

    hair:"hairLayer",

    accessory:"accessoryLayer",

    shoes:"shoesLayer"

  };


  const layer =
    document.getElementById(
      layerMap[category]
    );


  if(!layer) return;


  layer.src =
    item.src;

  layer.style.display =
    "block";


  const stage =
    document.getElementById(
      "characterStage"
    );


  if(
    category === "onepiece"
  ){

    stage.classList.add(
      "onepieceOn"
    );

    stage.classList.remove(
      "dressOn"
    );

    hideLayer(
      "dressLayer"
    );

  }


  if(
    category === "dress"
  ){

    stage.classList.add(
      "dressOn"
    );

    stage.classList.remove(
      "onepieceOn"
    );

    hideLayer(
      "onepieceLayer"
    );

  }


  if(
    category === "top" ||
    category === "bottom"
  ){

    stage.classList.remove(
      "onepieceOn"
    );

    stage.classList.remove(
      "dressOn"
    );

    hideLayer(
      "onepieceLayer"
    );

    hideLayer(
      "dressLayer"
    );

  }


  document.getElementById(
    "currentItem"
  ).textContent =
    item.name;

}


/* =====================================================
 非表示
===================================================== */

function hideLayer(id){

  const layer =
    document.getElementById(
      id
    );

  if(layer){

    layer.style.display =
      "none";

  }

}


/* =====================================================
 GET閉じる
===================================================== */

function closeGetModal(){

  document
    .getElementById("getModal")
    .classList.remove(
      "show"
    );

}


/* =====================================================
 TOAST
===================================================== */

let toastTimer;


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      1800
    );

}


/* =====================================================
 HTMLエスケープ
===================================================== */

function escapeHTML(str){

  return String(str)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
