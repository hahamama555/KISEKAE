<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ギフトで着せ替え</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#f7eefa;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

body{
  display:flex;
  justify-content:center;
  overflow-x:hidden;
}

/* =========================
   メイン
========================= */

.app{
  width:min(100vw,430px);
  min-height:100vh;
  background:
    linear-gradient(
      180deg,
      #fff8ff 0%,
      #f9efff 100%
    );
  position:relative;
  overflow:hidden;
}

/* =========================
   ヘッダー
========================= */

.header{
  height:64px;
  padding:8px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:rgba(255,255,255,.92);
  border-bottom:1px solid #eadcf0;
  position:relative;
  z-index:50;
}

.title{
  flex:1;
  text-align:center;
}

.title h1{
  font-size:20px;
  font-weight:900;
  color:#8c3aa5;
  line-height:1.1;
}

.title p{
  margin-top:2px;
  font-size:10px;
  color:#9b86a3;
}

.headerBtn{
  width:44px;
  height:44px;
  border:none;
  border-radius:14px;
  background:#fff;
  box-shadow:0 3px 10px rgba(100,60,110,.12);
  font-size:20px;
  cursor:pointer;
}

/* =========================
   キャラクターエリア
========================= */

.characterArea{
  height:46vh;
  min-height:320px;
  max-height:500px;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 30%,
      #ffffff 0,
      #fff6ff 42%,
      #f4e4fb 100%
    );
}

/* キラキラ */

.sparkle{
  position:absolute;
  color:#fff;
  font-size:20px;
  opacity:.9;
  animation:float 3s infinite ease-in-out;
}

.sparkle:nth-child(1){
  left:10%;
  top:20%;
}

.sparkle:nth-child(2){
  right:12%;
  top:16%;
  animation-delay:.7s;
}

.sparkle:nth-child(3){
  left:18%;
  top:65%;
  animation-delay:1.2s;
}

.sparkle:nth-child(4){
  right:18%;
  top:60%;
  animation-delay:1.7s;
}

@keyframes float{
  0%,100%{
    transform:translateY(0) scale(1);
  }
  50%{
    transform:translateY(-8px) scale(1.1);
  }
}

/* キャラクター本体 */

.character{
  position:absolute;
  left:50%;
  top:50%;
  width:min(88%,390px);
  aspect-ratio:2 / 3;
  transform:translate(-50%,-50%);
}

/*
  全レイヤーを同じ位置・同じサイズにする
*/

.layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

/* =========================
   ステータス
========================= */

.status{
  position:absolute;
  left:12px;
  right:12px;
  bottom:10px;
  z-index:30;
}

.progressBox{
  background:rgba(255,255,255,.92);
  border-radius:16px;
  padding:7px 10px;
  box-shadow:0 4px 12px rgba(80,40,90,.12);
}

.progressText{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#806587;
  margin-bottom:5px;
}

.progressBar{
  height:9px;
  background:#eee1f3;
  border-radius:20px;
  overflow:hidden;
}

.progressFill{
  height:100%;
  width:0%;
  background:linear-gradient(
    90deg,
    #d85be8,
    #ff8bc6
  );
  border-radius:20px;
  transition:.3s;
}

/* =========================
   ギフトエリア
========================= */

.giftArea{
  padding:10px 10px 6px;
}

.giftTitle{
  font-size:13px;
  font-weight:900;
  color:#7f438d;
  text-align:center;
  margin-bottom:7px;
}

.gifts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.giftBtn{
  min-height:56px;
  border:none;
  border-radius:16px;
  background:#fff;
  box-shadow:0 3px 10px rgba(80,40,90,.12);
  cursor:pointer;
  color:#66376f;
  font-weight:900;
  position:relative;
  overflow:hidden;
}

.giftBtn:active{
  transform:scale(.96);
}

.giftIcon{
  display:block;
  font-size:22px;
  line-height:24px;
}

.giftName{
  display:block;
  font-size:11px;
}

.giftCount{
  position:absolute;
  top:5px;
  right:6px;
  min-width:19px;
  height:19px;
  padding:0 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ff5b9d;
  color:white;
  border-radius:20px;
  font-size:9px;
}

/* =========================
   タブ
========================= */

.tabs{
  display:flex;
  gap:5px;
  padding:5px 10px 8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:none;
  padding:8px 11px;
  border:none;
  border-radius:20px;
  background:#eadff0;
  color:#75567d;
  font-weight:800;
  font-size:11px;
}

.tab.active{
  background:#9b4db2;
  color:white;
}

/* =========================
   アイテム
========================= */

.itemArea{
  padding:0 10px 12px;
}

.items{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.item{
  min-height:95px;
  border:2px solid transparent;
  border-radius:15px;
  background:white;
  box-shadow:0 2px 8px rgba(70,40,80,.10);
  position:relative;
  cursor:pointer;
  overflow:hidden;
}

.item.selected{
  border-color:#d653df;
  box-shadow:
    0 0 0 2px rgba(214,83,223,.15),
    0 4px 12px rgba(160,60,170,.2);
}

.item.locked{
  opacity:.42;
  filter:grayscale(.5);
}

.item img{
  width:100%;
  height:70px;
  object-fit:contain;
}

.itemName{
  display:block;
  width:100%;
  padding:2px 3px 5px;
  text-align:center;
  font-size:9px;
  font-weight:800;
  color:#654d6a;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.lock{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  background:rgba(255,255,255,.35);
}

/* =========================
   下部操作
========================= */

.bottom{
  position:sticky;
  bottom:0;
  z-index:100;
  padding:7px 10px 10px;
  background:rgba(255,248,255,.96);
  backdrop-filter:blur(10px);
  border-top:1px solid #eadcf0;
}

.bottomBtns{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
}

.actionBtn{
  height:43px;
  border:none;
  border-radius:14px;
  background:white;
  color:#70447a;
  font-size:12px;
  font-weight:900;
  box-shadow:0 3px 9px rgba(80,40,90,.12);
}

.actionBtn.primary{
  background:#9b4db2;
  color:white;
}

.actionBtn:active{
  transform:scale(.97);
}

/* =========================
   管理パネル
========================= */

.manager{
  display:none;
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(45,20,50,.55);
  padding:20px 10px;
}

.manager.open{
  display:flex;
  justify-content:center;
  align-items:center;
}

.managerBox{
  width:min(100%,410px);
  max-height:90vh;
  overflow:auto;
  background:#fffaff;
  border-radius:24px;
  padding:18px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.managerHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.managerHeader h2{
  font-size:18px;
  color:#783f87;
}

.closeBtn{
  width:36px;
  height:36px;
  border:none;
  border-radius:12px;
  background:#f0e4f3;
  font-size:18px;
}

.uploadGroup{
  margin-bottom:13px;
  padding:12px;
  border-radius:17px;
  background:#f7effa;
}

.uploadGroup label{
  display:block;
  font-weight:900;
  font-size:13px;
  color:#70447a;
  margin-bottom:6px;
}

.uploadGroup input{
  width:100%;
  font-size:11px;
}

.help{
  font-size:10px;
  color:#927e98;
  line-height:1.5;
  margin-top:4px;
}

/* =========================
   GET演出
========================= */

.getEffect{
  position:fixed;
  inset:0;
  z-index:800;
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.getEffect.show{
  display:flex;
}

.getCard{
  padding:25px 35px;
  border-radius:25px;
  background:rgba(255,255,255,.97);
  box-shadow:0 15px 50px rgba(130,40,150,.25);
  text-align:center;
  animation:getPop .8s ease;
}

.getCard .big{
  font-size:50px;
}

.getCard h2{
  color:#a23ab6;
  font-size:25px;
  margin-top:5px;
}

.getCard p{
  color:#735779;
  font-size:13px;
  margin-top:4px;
}

@keyframes getPop{
  0%{
    transform:scale(.4);
    opacity:0;
  }
  60%{
    transform:scale(1.1);
    opacity:1;
  }
  100%{
    transform:scale(1);
  }
}

/* =========================
   完成画面
========================= */

.complete{
  display:none;
  position:fixed;
  inset:0;
  z-index:900;
  background:rgba(70,25,80,.6);
  align-items:center;
  justify-content:center;
}

.complete.show{
  display:flex;
}

.completeBox{
  width:85%;
  max-width:350px;
  background:white;
  border-radius:30px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.completeBox .emoji{
  font-size:60px;
}

.completeBox h2{
  font-size:25px;
  color:#9b3bb0;
  margin:10px 0;
}

.completeBox p{
  font-size:13px;
  color:#765c7c;
  line-height:1.6;
}

.completeClose{
  margin-top:18px;
  width:100%;
  height:45px;
  border:none;
  border-radius:15px;
  background:#9b4db2;
  color:white;
  font-weight:900;
}

/* =========================
   小画面調整
========================= */

@media(max-height:700px){

  .characterArea{
    height:39vh;
    min-height:270px;
  }

  .item{
    min-height:82px;
  }

  .item img{
    height:58px;
  }

  .giftBtn{
    min-height:50px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <button
      class="headerBtn"
      onclick="openManager()">
      ⚙️
    </button>

    <div class="title">
      <h1>🎀 ギフトで着せ替え 🎀</h1>
      <p>ギフトが飛ぶたびにアイテムGET！</p>
    </div>

    <button
      class="headerBtn"
      onclick="randomDress()">
      🎲
    </button>

  </header>


  <!-- CHARACTER -->
  <section class="characterArea">

    <span class="sparkle">✦</span>
    <span class="sparkle">✧</span>
    <span class="sparkle">✦</span>
    <span class="sparkle">♡</span>

    <div class="character">

      <!-- 1 本体 -->
      <img
        id="layerBase"
        class="layer"
        alt="キャラクター">

      <!-- 2 靴下 -->
      <img
        id="layerSocks"
        class="layer"
        alt="靴下">

      <!-- 3 ボトム -->
      <img
        id="layerBottom"
        class="layer"
        alt="ボトム">

      <!-- 4 ワンピース -->
      <img
        id="layerDress"
        class="layer"
        alt="ワンピース">

      <!-- 5 トップス -->
      <img
        id="layerTop"
        class="layer"
        alt="トップス">

      <!-- 6 アウター -->
      <img
        id="layerOuter"
        class="layer"
        alt="アウター">

      <!-- 7 靴 -->
      <img
        id="layerShoes"
        class="layer"
        alt="靴">

      <!-- 8 髪 -->
      <img
        id="layerHair"
        class="layer"
        alt="髪">

      <!-- 9 アクセサリー -->
      <img
        id="layerAccessory"
        class="layer"
        alt="アクセサリー">

    </div>


    <div class="status">

      <div class="progressBox">

        <div class="progressText">
          <span>GETしたアイテム</span>
          <strong>
            <span id="getCount">0</span>
            /
            <span id="totalCount">0</span>
          </strong>
        </div>

        <div class="progressBar">
          <div
            id="progressFill"
            class="progressFill">
          </div>
        </div>

      </div>

    </div>

  </section>


  <!-- GIFTS -->
  <section class="giftArea">

    <div class="giftTitle">
      🎁 ギフトが飛んだらアイテムGET！
    </div>

    <div class="gifts">

      <button
        class="giftBtn"
        onclick="receiveGift(0)">

        <span class="giftIcon">💗</span>
        <span
          class="giftName"
          id="giftName0">
          ハートミー
        </span>

        <span
          class="giftCount"
          id="giftCount0">
          0
        </span>

      </button>


      <button
        class="giftBtn"
        onclick="receiveGift(1)">

        <span class="giftIcon">🍩</span>

        <span
          class="giftName"
          id="giftName1">
          ドーナツ
        </span>

        <span
          class="giftCount"
          id="giftCount1">
          0
        </span>

      </button>


      <button
        class="giftBtn"
        onclick="receiveGift(2)">

        <span class="giftIcon">🍦</span>

        <span
          class="giftName"
          id="giftName2">
          アイスバー
        </span>

        <span
          class="giftCount"
          id="giftCount2">
          0
        </span>

      </button>

    </div>

  </section>


  <!-- TABS -->
  <div
    id="tabs"
    class="tabs">
  </div>


  <!-- ITEMS -->
  <section class="itemArea">

    <div
      id="items"
      class="items">
    </div>

  </section>


  <!-- BOTTOM -->
  <div class="bottom">

    <div class="bottomBtns">

      <button
        class="actionBtn primary"
        onclick="randomDress()">
        🎲 おまかせ
      </button>

      <button
        class="actionBtn"
        onclick="removeCurrent()">
        ✕ はずす
      </button>

      <button
        class="actionBtn"
        onclick="resetAll()">
        🔄 リセット
      </button>

    </div>

  </div>

</div>


<!-- =========================
     管理パネル
========================= -->

<div
  id="manager"
  class="manager">

  <div class="managerBox">

    <div class="managerHeader">

      <h2>🖼️ 画像を読み込む</h2>

      <button
        class="closeBtn"
        onclick="closeManager()">
        ✕
      </button>

    </div>


    <!-- 本体 -->

    <div class="uploadGroup">

      <label>
        👤 キャラクター本体
      </label>

      <input
        id="uploadBase"
        type="file"
        accept="image/*"
        onchange="loadBase(this)">

      <div class="help">
        キャラクター本体は1枚選択してください。
      </div>

    </div>


    <!-- 髪 -->

    <div class="uploadGroup">

      <label>
        💇 髪型
      </label>

      <input
        id="uploadHair"
        type="file"
        accept="image/*"
        multiple
        onchange="loadItems(this,'hair')">

      <div class="help">
        複数の髪型をまとめて選択できます。
      </div>

    </div>


    <!-- トップ -->

    <div class="uploadGroup">

      <label>
        👚 トップス
      </label>

      <input
        id="uploadTop"
        type="file"
        accept="image/*"
        multiple
        onchange="loadItems(this,'top')">

    </div>


    <!-- ワンピース -->

    <div class="uploadGroup">

      <label>
        👗 ワンピース・ドレス
      </label>

      <input
        id="uploadDress"
        type="file"
        accept="image/*"
        multiple
        onchange="loadItems(this,'dress')">

    </div>


    <!-- ボトム -->

    <div class="uploadGroup">

      <label>
        👖 ボトムス
      </label>

      <input
        id="uploadBottom"
        type="file"
        accept="image/*"
        multiple
        onchange="loadItems(this,'bottom')">

    </div>


    <!-- アウター -->

    <div class="uploadGroup">

      <label>
        🧥 アウター
      </label>

      <input
        id="uploadOuter"
        type="file"
        accept="image/*"
        multiple
        onchange="loadItems(this,'outer')">

    </div>


    <!-- 靴下 -->

    <div class="uploadGroup">

      <label>
        🧦 靴下
      </label>

      <input
        id="uploadSocks"
        type="file"
        accept="image/*"
        multiple
        onchange="loadItems(this,'socks')">

    </div>


    <!-- 靴 -->

    <div class="uploadGroup">

      <label>
        👟 靴
      </label>

      <input
        id="uploadShoes"
        type="file"
        accept="image/*"
        multiple
        onchange="loadItems(this,'shoes')">

    </div>


    <!-- アクセサリー -->

    <div class="uploadGroup">

      <label>
        💎 アクセサリー
      </label>

      <input
        id="uploadAccessory"
        type="file"
        accept="image/*"
        multiple
        onchange="loadItems(this,'accessory')">

    </div>


    <button
      class="actionBtn primary"
      style="width:100%;margin-top:5px"
      onclick="closeManager()">

      ✓ 完了

    </button>

  </div>

</div>


<!-- GET演出 -->

<div
  id="getEffect"
  class="getEffect">

  <div class="getCard">

    <div class="big">🎁</div>

    <h2>GET！</h2>

    <p id="getMessage">
      新しいアイテムをGETしました！
    </p>

  </div>

</div>


<!-- 完成 -->

<div
  id="complete"
  class="complete">

  <div class="completeBox">

    <div class="emoji">
      👑✨
    </div>

    <h2>
      コンプリート！
    </h2>

    <p>
      全アイテムGETしました！<br>
      いろいろなコーディネートを楽しもう♪
    </p>

    <button
      class="completeClose"
      onclick="closeComplete()">

      まだ着せ替える

    </button>

  </div>

</div>


<script>

/* =====================================================
   設定
===================================================== */

const categoryNames = {

  hair:"💇 髪",

  top:"👚 トップ",

  dress:"👗 ドレス",

  bottom:"👖 ボトム",

  outer:"🧥 アウター",

  socks:"🧦 靴下",

  shoes:"👟 靴",

  accessory:"💎 アクセ"

};


/*
  ギフトとカテゴリーの対応

  ここを変更するだけで、
  どのギフトで何がGETされるか変更できます。
*/

const giftSettings = [

  {
    name:"ハートミー",
    icon:"💗",
    categories:[
      "hair",
      "accessory"
    ]
  },

  {
    name:"ドーナツ",
    icon:"🍩",
    categories:[
      "top",
      "dress",
      "outer"
    ]
  },

  {
    name:"アイスバー",
    icon:"🍦",
    categories:[
      "bottom",
      "socks",
      "shoes"
    ]
  }

];


/* =====================================================
   データ
===================================================== */

const data = {

  base:null,

  hair:[],

  top:[],

  dress:[],

  bottom:[],

  outer:[],

  socks:[],

  shoes:[],

  accessory:[]

};


/* 現在選択中 */

const selected = {

  hair:null,

  top:null,

  dress:null,

  bottom:null,

  outer:null,

  socks:null,

  shoes:null,

  accessory:null

};


/* GET済み */

const unlocked = new Set();


/* 現在のタブ */

let currentTab = "hair";


/* ギフト回数 */

const giftCounts = [0,0,0];


/* =====================================================
   初期化
===================================================== */

function init(){

  createTabs();

  updateUI();

  /*
    本体画像がまだない場合の表示
  */

  document.getElementById("layerBase").style.display = "none";

}

init();


/* =====================================================
   タブ作成
===================================================== */

function createTabs(){

  const tabs = document.getElementById("tabs");

  tabs.innerHTML = "";

  Object.keys(categoryNames).forEach(category=>{

    const button =
      document.createElement("button");

    button.className =
      "tab" +
      (category===currentTab ? " active" : "");

    button.textContent =
      categoryNames[category];

    button.onclick = ()=>{

      currentTab = category;

      createTabs();

      renderItems();

    };

    tabs.appendChild(button);

  });

}


/* =====================================================
   本体読み込み
===================================================== */

function loadBase(input){

  const file = input.files[0];

  if(!file) return;

  const url =
    URL.createObjectURL(file);

  data.base = url;

  const img =
    document.getElementById("layerBase");

  img.src = url;

  img.style.display = "block";

}


/* =====================================================
   アイテム読み込み
===================================================== */

function loadItems(input,category){

  const files =
    Array.from(input.files);

  files.forEach((file,index)=>{

    const url =
      URL.createObjectURL(file);

    data[category].push({

      id:
        category +
        "_" +
        Date.now() +
        "_" +
        index,

      category:category,

      name:
        file.name
        .replace(/\.[^/.]+$/,""),

      url:url

    });

  });

  renderItems();

  updateUI();

}


/* =====================================================
   アイテム表示
===================================================== */

function renderItems(){

  const container =
    document.getElementById("items");

  container.innerHTML = "";

  const list =
    data[currentTab];

  if(list.length===0){

    container.innerHTML = `

      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:25px 10px;
        color:#9a859e;
        font-size:12px;
      ">

        📷 まだ画像がありません<br><br>
        ⚙️ を押して画像を読み込んでください

      </div>

    `;

    return;

  }


  list.forEach(item=>{

    const isUnlocked =
      unlocked.has(item.id);

    const isSelected =
      selected[currentTab] === item.id;


    const card =
      document.createElement("div");

    card.className =
      "item" +
      (isSelected ? " selected" : "") +
      (!isUnlocked ? " locked" : "");


    card.innerHTML = `

      <img
        src="${item.url}"
        alt="">

      <span class="itemName">
        ${escapeHTML(item.name)}
      </span>

      ${
        !isUnlocked
        ? `<div class="lock">🔒</div>`
        : ""
      }

    `;


    card.onclick = ()=>{

      if(!isUnlocked){

        showMessage(
          "このアイテムはまだGETしていません"
        );

        return;

      }

      wearItem(item);

    };


    container.appendChild(card);

  });

}


/* =====================================================
   アイテムを着せる
===================================================== */

function wearItem(item){

  const category =
    item.category;

  selected[category] =
    item.id;


  const layer =
    document.getElementById(
      "layer" +
      capitalize(category)
    );


  if(layer){

    layer.src =
      item.url;

    layer.style.display =
      "block";

  }


  /*
    ワンピースを着た場合、
    トップス・ボトムスを隠す
  */

  if(category === "dress"){

    hideLayer("Top");

    hideLayer("Bottom");

  }


  /*
    トップまたはボトムを選んだ場合、
    ワンピースを外す
  */

  if(
    category === "top" ||
    category === "bottom"
  ){

    selected.dress = null;

    hideLayer("Dress");

  }


  renderItems();

}


/* =====================================================
   レイヤーを隠す
===================================================== */

function hideLayer(name){

  const layer =
    document.getElementById(
      "layer" + name
    );

  if(layer){

    layer.style.display =
      "none";

  }

}


/* =====================================================
   現在のアイテムを外す
===================================================== */

function removeCurrent(){

  const category =
    currentTab;

  selected[category] =
    null;

  const layer =
    document.getElementById(
      "layer" +
      capitalize(category)
    );

  if(layer){

    layer.removeAttribute("src");

    layer.style.display =
      "none";

  }

  renderItems();

}


/* =====================================================
   ギフト受信
===================================================== */

function receiveGift(giftIndex){

  giftCounts[giftIndex]++;

  document.getElementById(
    "giftCount" + giftIndex
  ).textContent =
    giftCounts[giftIndex];


  const setting =
    giftSettings[giftIndex];


  /*
    対象カテゴリーから
    未GETアイテムを探す
  */

  let candidates = [];


  setting.categories.forEach(category=>{

    data[category].forEach(item=>{

      if(!unlocked.has(item.id)){

        candidates.push(item);

      }

    });

  });


  /*
    何も残っていなければ
    全カテゴリーから探す
  */

  if(candidates.length===0){

    Object.keys(data).forEach(category=>{

      if(category === "base")
        return;

      data[category].forEach(item=>{

        if(!unlocked.has(item.id)){

          candidates.push(item);

        }

      });

    });

  }


  if(candidates.length===0){

    showMessage(
      "すべてのアイテムをGET済みです！"
    );

    return;

  }


  /*
    ランダムGET
  */

  const item =
    candidates[
      Math.floor(
        Math.random() *
        candidates.length
      )
    ];


  unlocked.add(item.id);


  /*
    GETしたら自動で装着
  */

  wearItem(item);


  /*
    GET演出
  */

  showGet(item);


  updateUI();

}


/* =====================================================
   GET演出
===================================================== */

function showGet(item){

  const effect =
    document.getElementById(
      "getEffect"
    );

  const message =
    document.getElementById(
      "getMessage"
    );

  message.textContent =
    `${categoryNames[item.category]}「${item.name}」をGET！`;

  effect.classList.add("show");


  setTimeout(()=>{

    effect.classList.remove("show");

  },1000);

}


/* =====================================================
   ランダム着せ替え
===================================================== */

function randomDress(){

  Object.keys(data).forEach(category=>{

    if(category==="base")
      return;

    const list =
      data[category];

    const unlockedItems =
      list.filter(item =>
        unlocked.has(item.id)
      );

    if(unlockedItems.length===0)
      return;

    /*
      50%程度の確率で着用
    */

    if(Math.random()<0.7){

      const item =
        unlockedItems[
          Math.floor(
            Math.random() *
            unlockedItems.length
          )
        ];

      wearItem(item);

    }

  });

}


/* =====================================================
   全GET
===================================================== */

function unlockAll(){

  Object.keys(data).forEach(category=>{

    if(category==="base")
      return;

    data[category].forEach(item=>{

      unlocked.add(item.id);

    });

  });

  updateUI();

  renderItems();

}


/* =====================================================
   リセット
===================================================== */

function resetAll(){

  if(
    !confirm(
      "GETしたアイテムを全部リセットしますか？"
    )
  ){

    return;

  }


  unlocked.clear();


  Object.keys(selected).forEach(category=>{

    selected[category] =
      null;

  });


  Object.keys(categoryNames).forEach(category=>{

    const layer =
      document.getElementById(
        "layer" +
        capitalize(category)
      );

    if(layer){

      layer.removeAttribute("src");

      layer.style.display =
        "none";

    }

  });


  /*
    本体だけ表示
  */

  if(data.base){

    const base =
      document.getElementById(
        "layerBase"
      );

    base.src =
      data.base;

    base.style.display =
      "block";

  }


  giftCounts.fill(0);


  giftCounts.forEach((count,index)=>{

    document.getElementById(
      "giftCount" + index
    ).textContent =
      count;

  });


  updateUI();

  renderItems();

}


/* =====================================================
   進捗
===================================================== */

function updateUI(){

  let total = 0;

  Object.keys(data).forEach(category=>{

    if(category==="base")
      return;

    total +=
      data[category].length;

  });


  document.getElementById(
    "totalCount"
  ).textContent =
    total;


  document.getElementById(
    "getCount"
  ).textContent =
    unlocked.size;


  const percent =
    total === 0
    ? 0
    : Math.round(
        unlocked.size /
        total *
        100
      );


  document.getElementById(
    "progressFill"
  ).style.width =
    percent + "%";


  /*
    全部GET
  */

  if(
    total > 0 &&
    unlocked.size >= total
  ){

    setTimeout(()=>{

      document
        .getElementById("complete")
        .classList.add("show");

    },300);

  }

}


/* =====================================================
   完成画面
===================================================== */

function closeComplete(){

  document
    .getElementById("complete")
    .classList.remove("show");

}


/* =====================================================
   管理パネル
===================================================== */

function openManager(){

  document
    .getElementById("manager")
    .classList.add("open");

}

function closeManager(){

  document
    .getElementById("manager")
    .classList.remove("open");

}


/* =====================================================
   メッセージ
===================================================== */

function showMessage(text){

  const effect =
    document.getElementById(
      "getEffect"
    );

  const message =
    document.getElementById(
      "getMessage"
    );

  message.textContent =
    text;

  effect.classList.add("show");

  setTimeout(()=>{

    effect.classList.remove("show");

  },900);

}


/* =====================================================
   文字処理
===================================================== */

function capitalize(str){

  return str.charAt(0).toUpperCase()
       + str.slice(1);

}


function escapeHTML(str){

  return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
