<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ギフトで着せ替え</title>

<style>

/* =========================
   基本
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
  background:#f7edf5;
  color:#333;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}


/* =========================
   メイン
========================= */

.app{
  width:100vw;
  height:100vh;
  max-width:600px;

  display:flex;
  flex-direction:column;

  background:
    linear-gradient(
      180deg,
      #fff8fc 0%,
      #f8edf7 100%
    );

  overflow:hidden;
}


/* =========================
   ヘッダー
========================= */

.header{
  flex:0 0 auto;

  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    0 12px;

  background:#ffffff;

  border-bottom:
    1px solid #ead9e7;

  z-index:30;
}

.title{
  font-size:18px;
  font-weight:800;
}

.coinBox{
  display:flex;
  align-items:center;
  gap:5px;

  padding:
    7px 12px;

  border-radius:20px;

  background:#fff0a8;

  font-size:15px;
  font-weight:800;

  box-shadow:
    0 2px 6px rgba(0,0,0,.08);
}


/* =========================
   キャラクターエリア
========================= */

.characterArea{
  position:relative;

  flex:1;

  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  padding:
    4px 8px 0;
}


/* =========================
   キャラクターステージ
========================= */

.stage{
  position:relative;

  width:100%;
  height:100%;

  max-width:520px;
  max-height:calc(100vh - 330px);

  aspect-ratio:2 / 3;

  margin:auto;

  overflow:hidden;
}


/* =========================
   レイヤー
========================= */

.layer{
  position:absolute;

  left:50%;
  top:50%;

  width:100%;
  height:100%;

  transform:
    translate(-50%,-50%);

  object-fit:contain;
  object-position:center;

  pointer-events:none;

  display:none;
}


/* =========================
   レイヤーの重なり順
========================= */

#baseLayer{
  z-index:1;
}

#bottomLayer{
  z-index:2;
}

#onepieceLayer{
  z-index:3;
}

#dressLayer{
  z-index:4;
}

#topLayer{
  z-index:5;
}

#outerLayer{
  z-index:6;
}

#hairLayer{
  z-index:7;
}

#accessoryLayer{
  z-index:8;
}

#shoesLayer{
  z-index:9;
}


/* =========================
   ワンピース・ドレス
========================= */

.onepieceOn #topLayer,
.onepieceOn #bottomLayer{
  display:none !important;
}

.dressOn #topLayer,
.dressOn #bottomLayer{
  display:none !important;
}


/* =========================
   アウター着用時
   トップスがアウターから
   はみ出さないようにする
========================= */

.outerOn #topLayer{
  display:none !important;
}


/* =========================
   ベース未設定
========================= */

.emptyCharacter{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  width:85%;

  text-align:center;

  color:#b39aae;

  font-size:16px;
  font-weight:700;

  line-height:1.7;
}


/* =========================
   下部操作エリア
========================= */

.controlArea{
  flex:0 0 auto;

  background:#ffffff;

  border-top:
    1px solid #ead9e7;

  padding:
    7px 8px 8px;

  z-index:20;
}


/* =========================
   ボタン
========================= */

.mainButtons{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:6px;

  margin-bottom:7px;
}

.mainBtn{
  height:38px;

  border:none;

  border-radius:10px;

  background:#f4e6f2;

  color:#6d4b67;

  font-size:13px;
  font-weight:800;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

.mainBtn:active{
  transform:scale(.97);
}


/* =========================
   コイン追加
========================= */

.coinButtons{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:5px;

  margin-bottom:7px;
}

.coinBtn{
  height:32px;

  border:none;

  border-radius:9px;

  background:#fff0a8;

  color:#745f00;

  font-size:12px;
  font-weight:800;

  cursor:pointer;
}


/* =========================
   タブ
========================= */

.tabs{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:5px;

  margin-bottom:7px;
}

.tab{
  height:34px;

  border:none;

  border-radius:9px;

  background:#f0e8ef;

  color:#6d5a69;

  font-size:12px;
  font-weight:800;

  cursor:pointer;
}

.tab.active{
  background:#d96bb2;
  color:#fff;
}


/* =========================
   アイテム一覧
========================= */

.items{
  height:130px;

  overflow-x:auto;
  overflow-y:hidden;

  display:flex;

  gap:7px;

  padding:
    2px 2px 5px;

  -webkit-overflow-scrolling:touch;
}

.itemCard{
  flex:
    0 0 86px;

  height:120px;

  border:
    2px solid transparent;

  border-radius:11px;

  background:#faf6fa;

  position:relative;

  overflow:hidden;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

.itemCard.selected{
  border-color:#d85cae;

  box-shadow:
    0 0 0 2px rgba(216,92,174,.15);
}

.itemImage{
  width:100%;
  height:76px;

  object-fit:contain;

  display:block;
}

.itemName{
  height:23px;

  padding:
    2px 3px;

  text-align:center;

  font-size:10px;
  font-weight:700;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.itemPrice{
  height:18px;

  text-align:center;

  font-size:10px;
  font-weight:800;

  color:#8b6b00;
}

.removeItem{
  position:absolute;

  top:3px;
  right:3px;

  width:20px;
  height:20px;

  border:none;
  border-radius:50%;

  background:rgba(0,0,0,.55);

  color:#fff;

  font-size:11px;

  cursor:pointer;

  z-index:5;
}


/* =========================
   モーダル
========================= */

.modal{
  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.45);

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:100;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:420px;

  max-height:
    90vh;

  overflow-y:auto;

  background:#fff;

  border-radius:18px;

  padding:18px;

  box-shadow:
    0 15px 40px rgba(0,0,0,.25);
}

.modalTitle{
  font-size:18px;
  font-weight:800;

  margin-bottom:15px;
}

.formGroup{
  margin-bottom:12px;
}

.formGroup label{
  display:block;

  margin-bottom:5px;

  font-size:13px;
  font-weight:800;
}

.formGroup input,
.formGroup select{
  width:100%;

  height:42px;

  border:
    1px solid #ddd;

  border-radius:9px;

  padding:
    0 10px;

  font-size:14px;

  background:#fff;
}

.preview{
  width:100%;
  height:150px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1px dashed #d5c4d1;

  border-radius:10px;

  margin-bottom:12px;

  overflow:hidden;

  background:#faf8fa;
}

.preview img{
  width:100%;
  height:100%;

  object-fit:contain;
}

.modalButtons{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:15px;
}

.modalBtn{
  height:42px;

  border:none;

  border-radius:10px;

  font-size:14px;
  font-weight:800;

  cursor:pointer;
}

.cancelBtn{
  background:#eee;
  color:#555;
}

.saveBtn{
  background:#d85cae;
  color:#fff;
}


/* =========================
   ベース設定
========================= */

.baseInfo{
  margin-bottom:12px;

  padding:10px;

  border-radius:10px;

  background:#faf5f9;

  font-size:12px;

  line-height:1.6;
}


/* =========================
   アイテムなし
========================= */

.noItems{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#a797a5;

  font-size:12px;
}


/* =========================
   小さい画面
========================= */

@media(max-height:700px){

  .header{
    height:52px;
  }

  .items{
    height:112px;
  }

  .itemCard{
    height:105px;
  }

  .itemImage{
    height:63px;
  }

  .itemName{
    height:21px;
  }

  .itemPrice{
    height:17px;
  }

  .controlArea{
    padding-top:5px;
  }

  .mainBtn{
    height:34px;
  }

  .coinBtn{
    height:28px;
  }

  .tab{
    height:30px;
  }
}

</style>
</head>


<body>

<div class="app">

  <!-- =====================
       ヘッダー
  ====================== -->

  <div class="header">

    <div class="title">
      🎀 ギフトで着せ替え
    </div>

    <div class="coinBox">
      🪙
      <span id="coinCount">0</span>
    </div>

  </div>


  <!-- =====================
       キャラクター
  ====================== -->

  <div class="characterArea">

    <div
      id="stage"
      class="stage"
    >

      <div
        id="emptyCharacter"
        class="emptyCharacter"
      >
        👤<br>
        ベースキャラクターを設定してください
      </div>


      <!-- 一番下：本体 -->

      <img
        id="baseLayer"
        class="layer"
        alt="ベースキャラクター"
      >


      <!-- ボトムス -->

      <img
        id="bottomLayer"
        class="layer"
        alt="ボトムス"
      >


      <!-- ワンピース -->

      <img
        id="onepieceLayer"
        class="layer"
        alt="ワンピース"
      >


      <!-- ドレス -->

      <img
        id="dressLayer"
        class="layer"
        alt="ドレス"
      >


      <!-- トップス -->

      <img
        id="topLayer"
        class="layer"
        alt="トップス"
      >


      <!-- アウター -->

      <img
        id="outerLayer"
        class="layer"
        alt="アウター"
      >


      <!-- 髪型 -->

      <img
        id="hairLayer"
        class="layer"
        alt="髪型"
      >


      <!-- アクセサリー -->

      <img
        id="accessoryLayer"
        class="layer"
        alt="アクセサリー"
      >


      <!-- 靴 -->

      <img
        id="shoesLayer"
        class="layer"
        alt="靴"
      >

    </div>

  </div>


  <!-- =====================
       操作エリア
  ====================== -->

  <div class="controlArea">

    <div class="mainButtons">

      <button
        class="mainBtn"
        onclick="openBaseModal()"
      >
        👤 ベースキャラクター
      </button>

      <button
        class="mainBtn"
        onclick="openItemModal()"
      >
        ➕ アイテム設定
      </button>

    </div>


    <!-- コイン追加 -->

    <div class="coinButtons">

      <button
        class="coinBtn"
        onclick="addCoins(10)"
      >
        🪙 +10
      </button>

      <button
        class="coinBtn"
        onclick="addCoins(50)"
      >
        🪙 +50
      </button>

      <button
        class="coinBtn"
        onclick="addCoins(100)"
      >
        🪙 +100
      </button>

      <button
        class="coinBtn"
        onclick="addCoins(500)"
      >
        🪙 +500
      </button>

    </div>


    <!-- カテゴリー -->

    <div
      id="tabs"
      class="tabs"
    ></div>


    <!-- アイテム一覧 -->

    <div
      id="items"
      class="items"
    ></div>

  </div>

</div>



<!-- =========================
     ベースキャラクターモーダル
========================= -->

<div
  id="baseModal"
  class="modal"
>

  <div class="modalBox">

    <div class="modalTitle">
      👤 ベースキャラクターを設定
    </div>

    <div class="baseInfo">
      全身が入った透過PNGがおすすめです。
    </div>

    <div class="preview">
      <img
        id="basePreview"
        alt=""
      >
    </div>

    <div class="formGroup">

      <label>
        キャラクター画像
      </label>

      <input
        id="baseFile"
        type="file"
        accept="image/*"
        onchange="previewBase(event)"
      >

    </div>

    <div class="modalButtons">

      <button
        class="modalBtn cancelBtn"
        onclick="closeBaseModal()"
      >
        キャンセル
      </button>

      <button
        class="modalBtn saveBtn"
        onclick="saveBase()"
      >
        設定する
      </button>

    </div>

  </div>

</div>



<!-- =========================
     アイテム設定モーダル
========================= -->

<div
  id="itemModal"
  class="modal"
>

  <div class="modalBox">

    <div class="modalTitle">
      ➕ アイテムを設定
    </div>


    <div class="preview">

      <img
        id="itemPreview"
        alt=""
      >

    </div>


    <div class="formGroup">

      <label>
        アイテム画像
      </label>

      <input
        id="itemFile"
        type="file"
        accept="image/*"
        onchange="previewItem(event)"
      >

    </div>


    <div class="formGroup">

      <label>
        アイテム名
      </label>

      <input
        id="itemName"
        type="text"
        placeholder="例：ピンクトップス"
      >

    </div>


    <div class="formGroup">

      <label>
        必要コイン数
      </label>

      <input
        id="itemPrice"
        type="number"
        min="0"
        value="100"
      >

    </div>


    <div class="formGroup">

      <label>
        アイテムの種類
      </label>

      <select id="itemCategory">

        <option value="top">
          トップス
        </option>

        <option value="onepiece">
          ワンピース
        </option>

        <option value="dress">
          ドレス
        </option>

        <option value="bottom">
          ボトムス
        </option>

        <option value="outer">
          アウター
        </option>

        <option value="hair">
          髪型
        </option>

        <option value="accessory">
          アクセサリー
        </option>

        <option value="shoes">
          靴
        </option>

      </select>

    </div>


    <div class="modalButtons">

      <button
        class="modalBtn cancelBtn"
        onclick="closeItemModal()"
      >
        キャンセル
      </button>

      <button
        class="modalBtn saveBtn"
        onclick="saveItem()"
      >
        登録する
      </button>

    </div>

  </div>

</div>



<script>

/* =========================
   データ
========================= */

let coins = 0;

let baseCharacter = null;


/*
  アイテムデータ

  categoryごとに分けて管理
*/

const items = {

  top:[],

  onepiece:[],

  dress:[],

  bottom:[],

  outer:[],

  hair:[],

  accessory:[],

  shoes:[]

};


/*
  現在着ているアイテム
*/

const selected = {

  top:null,

  onepiece:null,

  dress:null,

  bottom:null,

  outer:null,

  hair:null,

  accessory:null,

  shoes:null

};


/* =========================
   カテゴリー名
========================= */

const categoryNames = {

  top:"👕 トップス",

  onepiece:"👗 ワンピース",

  dress:"👸 ドレス",

  bottom:"🩳 ボトムス",

  outer:"🧥 アウター",

  hair:"💇 髪型",

  accessory:"💎 アクセ",

  shoes:"👟 靴"

};


let currentCategory = "top";


/* =========================
   DOM
========================= */

const stage =
  document.getElementById("stage");

const coinCount =
  document.getElementById("coinCount");

const tabs =
  document.getElementById("tabs");

const itemContainer =
  document.getElementById("items");


/* =========================
   コイン
========================= */

function updateCoins(){

  coinCount.textContent =
    coins.toLocaleString();

}


function addCoins(amount){

  coins += amount;

  updateCoins();

}


/* =========================
   タブ作成
========================= */

function renderTabs(){

  tabs.innerHTML = "";

  Object.keys(categoryNames).forEach(
    category => {

      const button =
        document.createElement("button");

      button.className =
        "tab" +
        (
          category === currentCategory
            ? " active"
            : ""
        );

      button.textContent =
        categoryNames[category];

      button.onclick = () => {

        currentCategory =
          category;

        renderTabs();
        renderItems();

      };

      tabs.appendChild(button);

    }
  );

}


/* =========================
   アイテム一覧表示
========================= */

function renderItems(){

  itemContainer.innerHTML = "";

  const list =
    items[currentCategory];


  if(!list.length){

    const noItems =
      document.createElement("div");

    noItems.className =
      "noItems";

    noItems.textContent =
      "アイテムを設定してください";

    itemContainer.appendChild(
      noItems
    );

    return;

  }


  list.forEach(item => {

    const card =
      document.createElement("div");

    card.className =
      "itemCard";


    /*
      現在着ているアイテムなら
      selected表示
    */

    if(
      selected[currentCategory] &&
      selected[currentCategory].id === item.id
    ){

      card.classList.add("selected");

    }


    /*
      アイテム画像
    */

    const img =
      document.createElement("img");

    img.className =
      "itemImage";

    img.src =
      item.src;

    img.alt =
      item.name;


    /*
      名前
    */

    const name =
      document.createElement("div");

    name.className =
      "itemName";

    name.textContent =
      item.name;


    /*
      価格
    */

    const price =
      document.createElement("div");

    price.className =
      "itemPrice";

    price.textContent =
      "🪙 " +
      Number(item.price).toLocaleString();


    /*
      削除ボタン
    */

    const remove =
      document.createElement("button");

    remove.className =
      "removeItem";

    remove.textContent =
      "×";


    remove.onclick =
      event => {

        event.stopPropagation();

        deleteItem(
          currentCategory,
          item.id
        );

      };


    /*
      カード
    */

    card.appendChild(img);
    card.appendChild(name);
    card.appendChild(price);
    card.appendChild(remove);


    /*
      タップ
    */

    card.onclick = () => {

      wearItem(
        currentCategory,
        item
      );

    };


    itemContainer.appendChild(
      card
    );

  });

}


/* =========================
   アイテムを着る・脱ぐ
========================= */

function wearItem(category,item){

  /*
    ★重要

    同じアイテムをもう一度タップ
    → そのアイテムを脱ぐ
  */

  if(
    selected[category] &&
    selected[category].id === item.id
  ){

    selected[category] = null;

    const layer =
      getLayer(category);

    if(layer){

      layer.src = "";

      layer.style.display =
        "none";

    }


    /*
      ワンピース解除
    */

    if(category === "onepiece"){

      stage.classList.remove(
        "onepieceOn"
      );

    }


    /*
      ドレス解除
    */

    if(category === "dress"){

      stage.classList.remove(
        "dressOn"
      );

    }


    /*
      アウター解除
    */

    if(category === "outer"){

      stage.classList.remove(
        "outerOn"
      );

    }


    renderItems();

    return;

  }


  /*
    ★新しいアイテムを選択
  */

  /*
    必要コイン
  */

  const price =
    Number(item.price) || 0;


  /*
    コイン不足
  */

  if(coins < price){

    alert(
      "コインが足りません。\n\n" +
      "必要：" +
      price.toLocaleString() +
      "コイン\n" +
      "現在：" +
      coins.toLocaleString() +
      "コイン"
    );

    return;

  }


  /*
    コインを消費
  */

  coins -= price;

  updateCoins();


  /*
    選択状態
  */

  selected[category] =
    item;


  /*
    レイヤー取得
  */

  const layer =
    getLayer(category);


  if(!layer){

    return;

  }


  /*
    画像を表示
  */

  layer.src =
    item.src;

  layer.style.display =
    "block";


  /* =====================
     ワンピース
  ====================== */

  if(category === "onepiece"){

    /*
      トップスを解除
    */

    selected.top = null;

    const topLayer =
      document.getElementById(
        "topLayer"
      );

    topLayer.src = "";

    topLayer.style.display =
      "none";


    /*
      ボトムスを解除
    */

    selected.bottom = null;

    const bottomLayer =
      document.getElementById(
        "bottomLayer"
      );

    bottomLayer.src = "";

    bottomLayer.style.display =
      "none";


    /*
      ドレスを解除
    */

    selected.dress = null;

    const dressLayer =
      document.getElementById(
        "dressLayer"
      );

    dressLayer.src = "";

    dressLayer.style.display =
      "none";


    stage.classList.remove(
      "dressOn"
    );

    stage.classList.add(
      "onepieceOn"
    );

  }


  /* =====================
     ドレス
  ====================== */

  if(category === "dress"){

    /*
      トップス解除
    */

    selected.top = null;

    const topLayer =
      document.getElementById(
        "topLayer"
      );

    topLayer.src = "";

    topLayer.style.display =
      "none";


    /*
      ボトムス解除
    */

    selected.bottom = null;

    const bottomLayer =
      document.getElementById(
        "bottomLayer"
      );

    bottomLayer.src = "";

    bottomLayer.style.display =
      "none";


    /*
      ワンピース解除
    */

    selected.onepiece = null;

    const onepieceLayer =
      document.getElementById(
        "onepieceLayer"
      );

    onepieceLayer.src = "";

    onepieceLayer.style.display =
      "none";


    stage.classList.remove(
      "onepieceOn"
    );

    stage.classList.add(
      "dressOn"
    );

  }


  /* =====================
     トップス
  ====================== */

  if(category === "top"){

    /*
      ワンピース解除
    */

    selected.onepiece = null;

    const onepieceLayer =
      document.getElementById(
        "onepieceLayer"
      );

    onepieceLayer.src = "";

    onepieceLayer.style.display =
      "none";


    /*
      ドレス解除
    */

    selected.dress = null;

    const dressLayer =
      document.getElementById(
        "dressLayer"
      );

    dressLayer.src = "";

    dressLayer.style.display =
      "none";


    stage.classList.remove(
      "onepieceOn"
    );

    stage.classList.remove(
      "dressOn"
    );


    /*
      アウターを着ている場合は
      トップスをアウターの下にするため
      非表示にする
    */

    if(selected.outer){

      layer.style.display =
        "none";

    }

  }


  /* =====================
     ボトムス
  ====================== */

  if(category === "bottom"){

    /*
      ワンピース解除
    */

    selected.onepiece = null;

    const onepieceLayer =
      document.getElementById(
        "onepieceLayer"
      );

    onepieceLayer.src = "";

    onepieceLayer.style.display =
      "none";


    /*
      ドレス解除
    */

    selected.dress = null;

    const dressLayer =
      document.getElementById(
        "dressLayer"
      );

    dressLayer.src = "";

    dressLayer.style.display =
      "none";


    stage.classList.remove(
      "onepieceOn"
    );

    stage.classList.remove(
      "dressOn"
    );

  }


  /* =====================
     アウター
  ====================== */

  if(category === "outer"){

    /*
      アウター着用中は
      トップスを完全に隠す

      これで袖や裾が
      アウターからはみ出しにくくなる
    */

    stage.classList.add(
      "outerOn"
    );


    /*
      トップス自体は
      選択状態として保持
    */

    if(selected.top){

      document.getElementById(
        "topLayer"
      ).style.display =
        "none";

    }

  }


  renderItems();

}


/* =========================
   カテゴリー → レイヤー
========================= */

function getLayer(category){

  const layerMap = {

    top:
      "topLayer",

    onepiece:
      "onepieceLayer",

    dress:
      "dressLayer",

    bottom:
      "bottomLayer",

    outer:
      "outerLayer",

    hair:
      "hairLayer",

    accessory:
      "accessoryLayer",

    shoes:
      "shoesLayer"

  };


  return document.getElementById(
    layerMap[category]
  );

}


/* =========================
   アイテム削除
========================= */

function deleteItem(
  category,
  id
){

  const index =
    items[category].findIndex(
      item =>
        item.id === id
    );


  if(index === -1){

    return;

  }


  const item =
    items[category][index];


  /*
    現在着用中なら脱がせる
  */

  if(
    selected[category] &&
    selected[category].id === id
  ){

    selected[category] =
      null;

    const layer =
      getLayer(category);

    if(layer){

      layer.src = "";

      layer.style.display =
        "none";

    }


    if(category === "onepiece"){

      stage.classList.remove(
        "onepieceOn"
      );

    }


    if(category === "dress"){

      stage.classList.remove(
        "dressOn"
      );

    }


    if(category === "outer"){

      stage.classList.remove(
        "outerOn"
      );

      /*
        アウターを脱いだら
        トップスがあれば再表示
      */

      if(selected.top){

        const topLayer =
          document.getElementById(
            "topLayer"
          );

        topLayer.src =
          selected.top.src;

        topLayer.style.display =
          "block";

      }

    }

  }


  items[category].splice(
    index,
    1
  );


  renderItems();

}

/* =========================
   ベース画像プレビュー
========================= */

let basePreviewSrc = "";


function previewBase(event){

  const file =
    event.target.files[0];

  if(!file){

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    e => {

      basePreviewSrc =
        e.target.result;

      document
        .getElementById(
          "basePreview"
        )
        .src =
        basePreviewSrc;

    };


  reader.readAsDataURL(file);

}


/* =========================
   ベース保存
========================= */

function saveBase(){

  if(!basePreviewSrc){

    alert(
      "キャラクター画像を選択してください。"
    );

    return;

  }


  baseCharacter =
    basePreviewSrc;


  const baseLayer =
    document.getElementById(
      "baseLayer"
    );


  baseLayer.src =
    baseCharacter;

  baseLayer.style.display =
    "block";


  document
    .getElementById(
      "emptyCharacter"
    )
    .style.display =
    "none";


  closeBaseModal();

}

/* =========================
   アイテム登録
========================= */

function saveItem(){

  const name =
    document
      .getElementById(
        "itemName"
      )
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById(
          "itemPrice"
        )
        .value
    );


  const category =
    document
      .getElementById(
        "itemCategory"
      )
      .value;


  /*
    入力チェック
  */

  if(!itemPreviewSrc){

    alert(
      "アイテム画像を選択してください。"
    );

    return;

  }


  if(!name){

    alert(
      "アイテム名を入力してください。"
    );

    return;

  }


  if(
    isNaN(price) ||
    price < 0
  ){

    alert(
      "コイン数を正しく入力してください。"
    );

    return;

  }


  /*
    アイテム作成

    ★ idを必ず作る
    → 再タップ判定に使用
  */

  const item = {

    id:
      Date.now().toString() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2),

    name:name,

    price:price,

    category:category,

    src:itemPreviewSrc

  };


  /*
    登録
  */

  items[category].push(
    item
  );


  /*
    登録したカテゴリーを表示
  */

  currentCategory =
    category;


  /*
    フォームリセット
  */

  document
    .getElementById(
      "itemFile"
    )
    .value = "";

  document
    .getElementById(
      "itemName"
    )
    .value = "";

  document
    .getElementById(
      "itemPrice"
    )
    .value = "100";

  document
    .getElementById(
      "itemPreview"
    )
    .src = "";

  itemPreviewSrc = "";


  /*
    画面更新
  */

  renderTabs();
  renderItems();


  closeItemModal();

}

   初期化
========================= */

updateCoins();
