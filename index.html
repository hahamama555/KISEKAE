<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>ギフトで着せ替え</title>

<style>

/* =========================================
   RESET
========================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;

  background:#eadfea;
}


/* =========================================
   BODY
========================================= */

body{
  display:flex;
  align-items:center;
  justify-content:center;
}


/* =========================================
   9:16 APP
========================================= */

.app{
  position:relative;

  width:min(100vw,56.25vh);
  height:min(100vh,177.777vw);

  max-width:600px;
  max-height:1066px;

  aspect-ratio:9 / 16;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #fffaff 0%,
      #f8edf7 100%
    );

  display:flex;
  flex-direction:column;
}


/* =========================================
   HEADER
========================================= */

.header{
  flex:0 0 6%;

  min-height:42px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 4%;

  background:#fff;

  border-bottom:1px solid #eadbe7;

  z-index:50;
}

.title{
  font-size:clamp(13px,3vw,18px);

  font-weight:900;

  white-space:nowrap;
}

.coinBox{
  display:flex;
  align-items:center;
  gap:4px;

  padding:5px 10px;

  border-radius:20px;

  background:#fff0a8;

  font-size:clamp(11px,2.7vw,15px);

  font-weight:900;

  white-space:nowrap;
}


/* =========================================
   CHARACTER AREA
========================================= */

.characterArea{
  flex:1 1 auto;

  min-height:0;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  padding:0 2%;
}


/* =========================================
   CHARACTER STAGE
========================================= */

.stage{
  position:relative;

  width:100%;
  height:100%;

  max-width:520px;

  aspect-ratio:2 / 3;

  margin:auto;

  overflow:hidden;
}


/* =========================================
   CHARACTER LAYERS
========================================= */

.layer{
  position:absolute;

  left:50%;
  top:50%;

  width:100%;
  height:100%;

  transform:
    translate(-50%,-50%);

  object-fit:contain;
  object-position:center;

  pointer-events:none;

  display:none;
}


/* =========================================
   LAYER ORDER
========================================= */

#baseLayer{
  z-index:1;
}

#bottomLayer{
  z-index:2;
}

#onepieceLayer{
  z-index:3;
}

#dressLayer{
  z-index:4;
}

#topLayer{
  z-index:5;
}

#outerLayer{
  z-index:6;
}

#hairLayer{
  z-index:7;
}

#accessoryLayer{
  z-index:8;
}

#shoesLayer{
  z-index:9;
}


/* =========================================
   ONE PIECE
========================================= */

.onepieceOn #topLayer,
.onepieceOn #bottomLayer{
  display:none!important;
}


/* =========================================
   DRESS
========================================= */

.dressOn #topLayer,
.dressOn #bottomLayer{
  display:none!important;
}


/* =========================================
   OUTER
========================================= */

.outerOn #topLayer{
  display:none!important;
}


/* =========================================
   EMPTY CHARACTER
========================================= */

.emptyCharacter{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  width:90%;

  text-align:center;

  color:#ad9dac;

  font-size:clamp(12px,3vw,16px);

  font-weight:800;

  line-height:1.7;

  z-index:20;
}


/* =========================================
   CONTROL AREA
========================================= */

.controlArea{
  flex:0 0 38%;

  min-height:0;

  display:flex;
  flex-direction:column;

  background:#fff;

  border-top:1px solid #eadbe7;

  padding:
    1.3% 1.8% 1%;

  z-index:40;
}


/* =========================================
   MAIN BUTTONS
========================================= */

.mainButtons{
  flex:0 0 9%;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:6px;

  margin-bottom:5px;
}

.mainBtn{
  min-height:27px;

  border:none;

  border-radius:9px;

  background:#f0e3ee;

  color:#654e60;

  font-size:clamp(9px,2.3vw,13px);

  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* =========================================
   COIN BUTTONS
========================================= */

.coinButtons{
  flex:0 0 9%;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:5px;

  margin-bottom:5px;
}

.coinBtn{
  min-height:25px;

  border:none;

  border-radius:8px;

  background:#fff0a8;

  color:#705d00;

  font-size:clamp(8px,2.2vw,12px);

  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* =========================================
   CATEGORY TABS
========================================= */

.tabs{
  flex:0 0 18%;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  grid-template-rows:
    repeat(2,1fr);

  gap:5px;

  margin-bottom:6px;
}

.tab{
  min-height:23px;

  border:none;

  border-radius:8px;

  background:#eee6ed;

  color:#665663;

  font-size:clamp(8px,2.1vw,12px);

  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;

  white-space:nowrap;
}

.tab.active{
  background:#d85cae;
  color:#fff;
}


/* =========================================
   ITEM LIST
========================================= */

.items{
  flex:1 1 auto;

  min-height:0;

  width:100%;

  display:flex;

  align-items:stretch;

  gap:9px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:
    2px 2px 5px;

  -webkit-overflow-scrolling:touch;

  scrollbar-width:none;
}

.items::-webkit-scrollbar{
  display:none;
}


/* =========================================
   LARGE ITEM CARD
   ★ 140px
========================================= */

.itemCard{
  position:relative;

  flex:0 0 140px;

  width:140px;

  height:100%;

  min-height:120px;

  border:3px solid transparent;

  border-radius:15px;

  background:#faf7fa;

  overflow:hidden;

  cursor:pointer;

  touch-action:manipulation;

  user-select:none;
  -webkit-user-select:none;

  -webkit-tap-highlight-color:transparent;
}


/* =========================================
   SELECTED ITEM
========================================= */

.itemCard.selected{
  border-color:#d85cae;

  background:#fff0fa;

  box-shadow:
    0 0 0 3px
    rgba(216,92,174,.15);
}


/* =========================================
   ITEM IMAGE
========================================= */

.itemImage{
  display:block;

  width:100%;

  height:
    calc(100% - 48px);

  min-height:75px;

  object-fit:contain;

  object-position:center;

  pointer-events:none;

  user-select:none;

  -webkit-user-drag:none;
}


/* =========================================
   ITEM NAME
========================================= */

.itemName{
  width:100%;

  height:24px;

  padding:2px 4px;

  text-align:center;

  font-size:13px;

  font-weight:900;

  line-height:20px;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  pointer-events:none;
}


/* =========================================
   ITEM PRICE
========================================= */

.itemPrice{
  width:100%;

  height:24px;

  text-align:center;

  font-size:12px;

  font-weight:900;

  color:#806700;

  line-height:24px;

  pointer-events:none;
}


/* =========================================
   DELETE BUTTON
========================================= */

.removeItem{
  position:absolute;

  top:5px;
  right:5px;

  width:28px;
  height:28px;

  padding:0;

  border:none;

  border-radius:50%;

  background:
    rgba(0,0,0,.58);

  color:#fff;

  font-size:17px;

  font-weight:900;

  line-height:28px;

  z-index:20;

  cursor:pointer;

  touch-action:manipulation;
}


/* =========================================
   NO ITEMS
========================================= */

.noItems{
  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  color:#a697a4;

  font-size:
    clamp(10px,2.5vw,13px);

  font-weight:700;

  line-height:1.5;
}


/* =========================================
   MODAL
========================================= */

.modal{
  position:fixed;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  padding:15px;

  background:
    rgba(0,0,0,.48);

  z-index:200;
}

.modal.show{
  display:flex;
}


/* =========================================
   MODAL BOX
========================================= */

.modalBox{
  width:min(92vw,420px);

  max-height:90vh;

  overflow-y:auto;

  padding:18px;

  background:#fff;

  border-radius:18px;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.25);
}

.modalTitle{
  margin-bottom:14px;

  font-size:18px;

  font-weight:900;
}


/* =========================================
   INFO
========================================= */

.info{
  margin-bottom:11px;

  padding:9px;

  border-radius:9px;

  background:#faf5f9;

  color:#766575;

  font-size:10px;

  line-height:1.5;
}


/* =========================================
   PREVIEW
========================================= */

.preview{
  width:100%;
  height:140px;

  display:flex;

  align-items:center;
  justify-content:center;

  margin-bottom:11px;

  overflow:hidden;

  border:
    1px dashed #d4c5d1;

  border-radius:10px;

  background:#faf8fa;
}

.preview img{
  width:100%;
  height:100%;

  object-fit:contain;
}


/* =========================================
   FORM
========================================= */

.formGroup{
  margin-bottom:12px;
}

.formGroup label{
  display:block;

  margin-bottom:5px;

  font-size:12px;

  font-weight:900;
}

.formGroup input,
.formGroup select{
  width:100%;

  height:42px;

  padding:0 10px;

  border:
    1px solid #ddd;

  border-radius:9px;

  background:#fff;

  font-size:13px;
}


/* =========================================
   MODAL BUTTONS
========================================= */

.modalButtons{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:14px;
}

.modalBtn{
  height:42px;

  border:none;

  border-radius:10px;

  font-size:13px;

  font-weight:900;

  cursor:pointer;
}

.cancelBtn{
  background:#eee;
  color:#555;
}

.saveBtn{
  background:#d85cae;
  color:#fff;
}


/* =========================================
   SHORT SCREEN
========================================= */

@media(max-height:650px){

  .controlArea{
    flex-basis:39%;
  }

  .itemCard{
    flex-basis:125px;
    width:125px;
  }

  .itemName{
    font-size:11px;
  }

  .itemPrice{
    font-size:10px;
  }

}


/* =========================================
   NARROW SCREEN
========================================= */

@media(max-width:360px){

  .itemCard{
    flex-basis:120px;
    width:120px;
  }

  .tab{
    font-size:8px;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =========================================
     HEADER
========================================= -->

<div class="header">

  <div class="title">
    🎀 ギフトで着せ替え
  </div>

  <div class="coinBox">
    🪙
    <span id="coinCount">1000</span>
  </div>

</div>


<!-- =========================================
     CHARACTER
========================================= -->

<div class="characterArea">

  <div
    id="stage"
    class="stage"
  >

    <div
      id="emptyCharacter"
      class="emptyCharacter"
    >
      👤<br>
      ベースキャラクターを<br>
      設定してください
    </div>


    <img
      id="baseLayer"
      class="layer"
      alt=""
    >

    <img
      id="bottomLayer"
      class="layer"
      alt=""
    >

    <img
      id="onepieceLayer"
      class="layer"
      alt=""
    >

    <img
      id="dressLayer"
      class="layer"
      alt=""
    >

    <img
      id="topLayer"
      class="layer"
      alt=""
    >

    <img
      id="outerLayer"
      class="layer"
      alt=""
    >

    <img
      id="hairLayer"
      class="layer"
      alt=""
    >

    <img
      id="accessoryLayer"
      class="layer"
      alt=""
    >

    <img
      id="shoesLayer"
      class="layer"
      alt=""
    >

  </div>

</div>


<!-- =========================================
     CONTROL
========================================= -->

<div class="controlArea">


  <!-- ベース・アイテム設定 -->

  <div class="mainButtons">

    <button
      id="baseButton"
      class="mainBtn"
      type="button"
    >
      👤 ベースキャラ
    </button>

    <button
      id="itemButton"
      class="mainBtn"
      type="button"
    >
      ➕ アイテム設定
    </button>

  </div>


  <!-- コイン -->

  <div class="coinButtons">

    <button
      class="coinBtn"
      data-coins="10"
      type="button"
    >
      🪙 +10
    </button>

    <button
      class="coinBtn"
      data-coins="50"
      type="button"
    >
      🪙 +50
    </button>

    <button
      class="coinBtn"
      data-coins="100"
      type="button"
    >
      🪙 +100
    </button>

    <button
      class="coinBtn"
      data-coins="500"
      type="button"
    >
      🪙 +500
    </button>

  </div>


  <!-- カテゴリー -->

  <div
    id="tabs"
    class="tabs"
  ></div>


  <!-- アイテム一覧 -->

  <div
    id="items"
    class="items"
  ></div>

</div>

</div>


<!-- =========================================
     BASE MODAL
========================================= -->

<div
  id="baseModal"
  class="modal"
>

  <div class="modalBox">

    <div class="modalTitle">
      👤 ベースキャラクター
    </div>

    <div class="info">
      全身が入った透過PNGがおすすめです。
    </div>

    <div class="preview">

      <img
        id="basePreview"
        alt=""
      >

    </div>

    <div class="formGroup">

      <label>
        キャラクター画像
      </label>

      <input
        id="baseFile"
        type="file"
        accept="image/*"
      >

    </div>

    <div class="modalButtons">

      <button
        id="baseCancel"
        class="modalBtn cancelBtn"
        type="button"
      >
        キャンセル
      </button>

      <button
        id="baseSave"
        class="modalBtn saveBtn"
        type="button"
      >
        設定する
      </button>

    </div>

  </div>

</div>


<!-- =========================================
     ITEM MODAL
========================================= -->

<div
  id="itemModal"
  class="modal"
>

  <div class="modalBox">

    <div class="modalTitle">
      ➕ アイテム設定
    </div>

    <div class="preview">

      <img
        id="itemPreview"
        alt=""
      >

    </div>


    <div class="formGroup">

      <label>
        アイテム画像
      </label>

      <input
        id="itemFile"
        type="file"
        accept="image/*"
      >

    </div>


    <div class="formGroup">

      <label>
        アイテム名
      </label>

      <input
        id="itemName"
        type="text"
        placeholder="例：ピンクトップス"
      >

    </div>


    <div class="formGroup">

      <label>
        必要コイン数
      </label>

      <input
        id="itemPrice"
        type="number"
        min="0"
        value="100"
      >

    </div>


    <div class="formGroup">

      <label>
        アイテムの種類
      </label>

      <select id="itemCategory">

        <option value="top">
          👕 トップス
        </option>

        <option value="onepiece">
          👗 ワンピース
        </option>

        <option value="dress">
          👸 ドレス
        </option>

        <option value="bottom">
          🩳 ボトムス
        </option>

        <option value="outer">
          🧥 アウター
        </option>

        <option value="hair">
          💇 髪型
        </option>

        <option value="accessory">
          💎 アクセサリー
        </option>

        <option value="shoes">
          👟 靴
        </option>

      </select>

    </div>


    <div class="modalButtons">

      <button
        id="itemCancel"
        class="modalBtn cancelBtn"
        type="button"
      >
        キャンセル
      </button>

      <button
        id="itemSave"
        class="modalBtn saveBtn"
        type="button"
      >
        登録する
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================
   STORAGE
========================================= */

const ITEM_STORAGE =
  "giftDressupItems_9x16_large";

const BASE_STORAGE =
  "giftDressupBase_9x16_large";


/* =========================================
   COINS
========================================= */

let coins = 1000;


/* =========================================
   ITEMS
========================================= */

let items = {

  top:[],

  onepiece:[],

  dress:[],

  bottom:[],

  outer:[],

  hair:[],

  accessory:[],

  shoes:[]

};


/* =========================================
   SELECTED
========================================= */

let selected = {

  top:null,

  onepiece:null,

  dress:null,

  bottom:null,

  outer:null,

  hair:null,

  accessory:null,

  shoes:null

};


/* =========================================
   CURRENT CATEGORY
========================================= */

let currentCategory = "top";


/* =========================================
   BASE
========================================= */

let baseCharacter = null;


/* =========================================
   TEMPORARY DATA
========================================= */

let temporaryBase = "";

let temporaryItem = "";


/* =========================================
   CATEGORY NAMES
========================================= */

const categoryNames = {

  top:"👕 トップス",

  onepiece:"👗 ワンピース",

  dress:"👸 ドレス",

  bottom:"🩳 ボトムス",

  outer:"🧥 アウター",

  hair:"💇 髪型",

  accessory:"💎 アクセ",

  shoes:"👟 靴"

};


/* =========================================
   DOM
========================================= */

const stage =
  document.getElementById("stage");

const tabs =
  document.getElementById("tabs");

const itemsBox =
  document.getElementById("items");

const coinCount =
  document.getElementById("coinCount");


/* =========================================
   COINS UPDATE
========================================= */

function updateCoins(){

  coinCount.textContent =
    coins.toLocaleString();

}


/* =========================================
   COIN BUTTONS
========================================= */

document
.querySelectorAll(".coinBtn")
.forEach(button => {

  button.addEventListener(
    "click",
    function(){

      const amount =
        Number(
          this.dataset.coins
        );

      coins += amount;

      updateCoins();

    }
  );

});


/* =========================================
   SAVE ITEMS
========================================= */

function saveItems(){

  try{

    localStorage.setItem(
      ITEM_STORAGE,
      JSON.stringify(items)
    );

  }catch(error){

    console.log(error);

  }

}


/* =========================================
   LOAD ITEMS
========================================= */

function loadItems(){

  try{

    const saved =
      localStorage.getItem(
        ITEM_STORAGE
      );

    if(!saved){
      return;
    }

    const data =
      JSON.parse(saved);

    if(!data){
      return;
    }

    Object.keys(items)
    .forEach(category => {

      if(
        Array.isArray(
          data[category]
        )
      ){

        items[category] =
          data[category];

      }

    });

  }catch(error){

    console.log(error);

  }

}


/* =========================================
   SAVE BASE
========================================= */

function saveBase(){

  if(!baseCharacter){
    return;
  }

  try{

    localStorage.setItem(
      BASE_STORAGE,
      baseCharacter
    );

  }catch(error){

    console.log(error);

  }

}


/* =========================================
   LOAD BASE
========================================= */

function loadBase(){

  try{

    const saved =
      localStorage.getItem(
        BASE_STORAGE
      );

    if(!saved){
      return;
    }

    baseCharacter =
      saved;

    const layer =
      document.getElementById(
        "baseLayer"
      );

    layer.src =
      saved;

    layer.style.display =
      "block";

    document
    .getElementById(
      "emptyCharacter"
    )
    .style.display =
      "none";

  }catch(error){

    console.log(error);

  }

}


/* =========================================
   RENDER TABS
========================================= */

function renderTabs(){

  tabs.innerHTML = "";

  Object.keys(categoryNames)
  .forEach(category => {

    const button =
      document.createElement("button");

    button.type = "button";

    button.className = "tab";

    if(
      category === currentCategory
    ){

      button.classList.add(
        "active"
      );

    }

    button.textContent =
      categoryNames[category];

    button.addEventListener(
      "click",
      function(){

        currentCategory =
          category;

        renderTabs();

        renderItems();

      }
    );

    tabs.appendChild(button);

  });

}


/* =========================================
   RENDER ITEMS
========================================= */

function renderItems(){

  itemsBox.innerHTML = "";

  const list =
    items[currentCategory];


  if(
    !list ||
    list.length === 0
  ){

    const empty =
      document.createElement("div");

    empty.className =
      "noItems";

    empty.innerHTML =
      "このカテゴリーには<br>" +
      "まだアイテムがありません";

    itemsBox.appendChild(empty);

    return;

  }


  list.forEach(item => {

    const card =
      document.createElement("div");

    card.className =
      "itemCard";


    /* 選択中 */

    if(
      selected[currentCategory] &&
      selected[currentCategory].id ===
      item.id
    ){

      card.classList.add(
        "selected"
      );

    }


    /* IMAGE */

    const image =
      document.createElement("img");

    image.className =
      "itemImage";

    image.src =
      item.src;

    image.alt =
      item.name;

    image.draggable = false;


    /* NAME */

    const name =
      document.createElement("div");

    name.className =
      "itemName";

    name.textContent =
      item.name;


    /* PRICE */

    const price =
      document.createElement("div");

    price.className =
      "itemPrice";

    price.textContent =
      "🪙 " +
      Number(
        item.price
      ).toLocaleString();


    /* DELETE */

    const remove =
      document.createElement("button");

    remove.type =
      "button";

    remove.className =
      "removeItem";

    remove.textContent =
      "×";


    remove.addEventListener(
      "click",
      function(event){

        event.preventDefault();

        event.stopPropagation();

        deleteItem(
          currentCategory,
          item.id
        );

      }
    );


    /* CARD */

    card.appendChild(image);

    card.appendChild(name);

    card.appendChild(price);

    card.appendChild(remove);


    /* =====================================
       CARD TAP
    ===================================== */

    card.addEventListener(
      "click",
      function(event){

        event.preventDefault();

        event.stopPropagation();

        wearItem(
          currentCategory,
          item
        );

      }
    );


    itemsBox.appendChild(card);

  });

}


/* =========================================
   WEAR ITEM
========================================= */

function wearItem(
  category,
  item
){

  /* ---------------------------------------
     同じものをもう一度押す
     → 脱ぐ
  --------------------------------------- */

  if(
    selected[category] &&
    selected[category].id ===
    item.id
  ){

    unequip(category);

    renderItems();

    return;

  }


  /* ---------------------------------------
     PRICE
  --------------------------------------- */

  const price =
    Number(item.price) || 0;


  /* ---------------------------------------
     COIN CHECK
  --------------------------------------- */

  if(coins < price){

    alert(
      "コインが足りません。\n\n" +
      "必要：" +
      price.toLocaleString() +
      "コイン\n" +
      "現在：" +
      coins.toLocaleString() +
      "コイン"
    );

    return;

  }


  /* ---------------------------------------
     PAY
  --------------------------------------- */

  coins -= price;

  updateCoins();


  /* ---------------------------------------
     SELECT
  --------------------------------------- */

  selected[category] =
    item;


  /* ---------------------------------------
     LAYER
  --------------------------------------- */

  const layer =
    getLayer(category);


  if(layer){

    layer.src =
      item.src;

    layer.style.display =
      "block";

  }


  /* ---------------------------------------
     ONE PIECE
  --------------------------------------- */

  if(
    category === "onepiece"
  ){

    clearCategory("top");

    clearCategory("bottom");

    clearCategory("dress");

    stage.classList.remove(
      "dressOn"
    );

    stage.classList.add(
      "onepieceOn"
    );

  }


  /* ---------------------------------------
     DRESS
  --------------------------------------- */

  if(
    category === "dress"
  ){

    clearCategory("top");

    clearCategory("bottom");

    clearCategory("onepiece");

    stage.classList.remove(
      "onepieceOn"
    );

    stage.classList.add(
      "dressOn"
    );

  }


  /* ---------------------------------------
     TOP
  --------------------------------------- */

  if(
    category === "top"
  ){

    clearCategory("onepiece");

    clearCategory("dress");

    stage.classList.remove(
      "onepieceOn"
    );

    stage.classList.remove(
      "dressOn"
    );


    if(selected.outer){

      layer.style.display =
        "none";

    }

  }


  /* ---------------------------------------
     BOTTOM
  --------------------------------------- */

  if(
    category === "bottom"
  ){

    clearCategory("onepiece");

    clearCategory("dress");

    stage.classList.remove(
      "onepieceOn"
    );

    stage.classList.remove(
      "dressOn"
    );

  }


  /* ---------------------------------------
     OUTER
  --------------------------------------- */

  if(
    category === "outer"
  ){

    stage.classList.add(
      "outerOn"
    );


    const topLayer =
      document.getElementById(
        "topLayer"
      );

    topLayer.style.display =
      "none";

  }


  renderItems();

}


/* =========================================
   UNEQUIP
========================================= */

function unequip(category){

  selected[category] =
    null;


  const layer =
    getLayer(category);


  if(layer){

    layer.src = "";

    layer.style.display =
      "none";

  }


  /* ONE PIECE */

  if(
    category === "onepiece"
  ){

    stage.classList.remove(
      "onepieceOn"
    );

  }


  /* DRESS */

  if(
    category === "dress"
  ){

    stage.classList.remove(
      "dressOn"
    );

  }


  /* OUTER */

  if(
    category === "outer"
  ){

    stage.classList.remove(
      "outerOn"
    );


    if(selected.top){

      const topLayer =
        document.getElementById(
          "topLayer"
        );

      topLayer.src =
        selected.top.src;

      topLayer.style.display =
        "block";

    }

  }

}


/* =========================================
   CLEAR CATEGORY
========================================= */

function clearCategory(category){

  selected[category] =
    null;


  const layer =
    getLayer(category);


  if(layer){

    layer.src = "";

    layer.style.display =
      "none";

  }

}


/* =========================================
   GET LAYER
========================================= */

function getLayer(category){

  const map = {

    top:"topLayer",

    onepiece:"onepieceLayer",

    dress:"dressLayer",

    bottom:"bottomLayer",

    outer:"outerLayer",

    hair:"hairLayer",

    accessory:"accessoryLayer",

    shoes:"shoesLayer"

  };


  return document.getElementById(
    map[category]
  );

}


/* =========================================
   DELETE ITEM
========================================= */

function deleteItem(
  category,
  id
){

  const index =
    items[category].findIndex(
      item =>
        item.id === id
    );


  if(index === -1){
    return;
  }


  if(
    selected[category] &&
    selected[category].id === id
  ){

    unequip(category);

  }


  items[category].splice(
    index,
    1
  );


  saveItems();

  renderItems();

}

/* =========================================
   BASE FILE
========================================= */

baseFile.addEventListener(
  "change",
  function(event){

    const file =
      event.target.files[0];

    if(!file){
      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      function(e){

        temporaryBase =
          e.target.result;

        basePreview.src =
          temporaryBase;

      };

    reader.readAsDataURL(file);

  }
);


/* =========================================
   BASE SAVE
========================================= */

document
.getElementById("baseSave")
.addEventListener(
  "click",
  function(){

    if(!temporaryBase){

      alert(
        "キャラクター画像を選択してください。"
      );

      return;

    }


    baseCharacter =
      temporaryBase;


    const layer =
      document.getElementById(
        "baseLayer"
      );


    layer.src =
      baseCharacter;

    layer.style.display =
      "block";


    document
    .getElementById(
      "emptyCharacter"
    )
    .style.display =
      "none";


    saveBase();


    temporaryBase = "";

    baseFile.value = "";

    basePreview.src = "";


    baseModal.classList.remove(
      "show"
    );

  }
);

    reader.readAsDataURL(file);

/* =========================================
   ITEM SAVE
========================================= */

document
.getElementById("itemSave")
.addEventListener(
  "click",
  function(){

    const name =
      document
      .getElementById(
        "itemName"
      )
      .value
      .trim();


    const price =
      Number(
        document
        .getElementById(
          "itemPrice"
        )
        .value
      );


    const category =
      document
      .getElementById(
        "itemCategory"
      )
      .value;


    if(!temporaryItem){

      alert(
        "アイテム画像を選択してください。"
      );

      return;

    }


    if(!name){

      alert(
        "アイテム名を入力してください。"
      );

      return;

    }


    if(
      isNaN(price) ||
      price < 0
    ){

      alert(
        "コイン数を正しく入力してください。"
      );

      return;

    }


    const item = {

      id:
        Date.now().toString()
        +
        "_"
        +
        Math.random()
        .toString(36)
        .substring(2),

      name:name,

      price:price,

      category:category,

      src:temporaryItem

    };


    items[category].push(item);


    saveItems();


    currentCategory =
      category;


    itemFile.value = "";

    document
    .getElementById(
      "itemName"
    )
    .value = "";

    document
    .getElementById(
      "itemPrice"
    )
    .value = "100";

    itemPreview.src = "";

    temporaryItem = "";


    renderTabs();

    renderItems();


    itemModal.classList.remove(
      "show"
    );

  }
);
