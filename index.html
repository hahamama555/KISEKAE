<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>ギフトで着せ替え</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background:#f8eff8;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:500px;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(
      180deg,
      #fff7ff 0%,
      #f9effc 100%
    );
  overflow:hidden;
}

/* =========================
   HEADER
========================= */

.header{
  flex:0 0 58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 12px;
  background:#fff;
  border-bottom:1px solid #eadbea;
  z-index:20;
}

.title{
  font-size:20px;
  font-weight:900;
  color:#6c3c72;
  white-space:nowrap;
}

.coinBox{
  display:flex;
  align-items:center;
  gap:5px;
  background:#fff7d8;
  border:2px solid #f0c94a;
  border-radius:20px;
  padding:5px 10px;
  font-weight:900;
  color:#805d00;
}

.coinIcon{
  font-size:18px;
}

#coinCount{
  min-width:45px;
  text-align:center;
}

/* =========================
   CHARACTER AREA
========================= */

.characterArea{
  position:relative;
  flex:1 1 auto;
  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 35%,
      #ffffff 0%,
      #fff5fc 45%,
      #f1e1f5 100%
    );
}

/*
  全身を必ず表示するため
  characterStageは高さ基準。
*/
.characterStage{
  position:relative;

  width:min(76vw,380px);
  height:calc(100% - 10px);

  max-height:100%;

  display:flex;
  align-items:center;
  justify-content:center;
}

/*
  すべてのレイヤーを同じ場所に重ねる
*/
.layer{
  position:absolute;

  left:50%;
  top:50%;

  width:100%;
  height:100%;

  transform:translate(-50%,-50%);

  object-fit:contain;
  object-position:center;

  pointer-events:none;

  display:none;
}

/* 本体 */
#base{
  display:block;
}

/* =========================
   アイテムレイヤー
========================= */

.layer.hair.active,
.layer.top.active,
.layer.onepiece.active,
.layer.bottom.active,
.layer.outer.active,
.layer.socks.active,
.layer.shoes.active,
.layer.accessory.active{
  display:block;
}

/*
  ワンピースを着たとき
  トップス・ボトムスを隠す
*/
.characterStage.onepieceOn .topLayer,
.characterStage.onepieceOn .bottomLayer{
  display:none!important;
}

/* =========================
   NOW ITEM
========================= */

.currentItem{
  position:absolute;
  left:10px;
  top:10px;

  padding:5px 9px;

  background:rgba(255,255,255,.88);
  border:1px solid #ead5ec;
  border-radius:15px;

  font-size:11px;
  font-weight:800;

  color:#704878;

  z-index:10;
}

/* =========================
   BOTTOM PANEL
========================= */

.bottomPanel{
  flex:0 0 38%;
  min-height:220px;

  background:#fff;

  border-top:1px solid #eadbea;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

/* =========================
   TABS
========================= */

.tabs{
  flex:0 0 42px;

  display:flex;

  overflow-x:auto;

  background:#fff;

  border-bottom:1px solid #eee;

  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:0 0 auto;

  min-width:76px;

  border:none;

  background:#fff;

  font-size:12px;
  font-weight:800;

  color:#8b728d;

  border-bottom:3px solid transparent;
}

.tab.active{
  color:#9a4fa8;
  border-bottom-color:#c96bd6;
}

/* =========================
   ITEM AREA
========================= */

.itemArea{
  flex:1;
  min-height:0;

  overflow-y:auto;

  padding:8px;

  -webkit-overflow-scrolling:touch;
}

.items{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:7px;
}

/* =========================
   ITEM CARD
========================= */

.item{
  position:relative;

  min-width:0;

  border:2px solid #eaddea;

  background:#fff;

  border-radius:12px;

  padding:5px;

  cursor:pointer;

  transition:.15s;

  user-select:none;
}

.item:active{
  transform:scale(.96);
}

.item.selected{
  border-color:#c25acb;

  box-shadow:
    0 0 0 2px
    rgba(194,90,203,.15);
}

.item.locked{
  opacity:.45;
}

.itemImage{
  width:100%;
  height:62px;

  object-fit:contain;

  display:block;

  background:#faf7fb;

  border-radius:8px;
}

.itemName{
  margin-top:3px;

  font-size:10px;

  font-weight:800;

  text-align:center;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  color:#644d67;
}

.price{
  margin-top:2px;

  text-align:center;

  font-size:10px;

  font-weight:900;

  color:#9a6900;
}

.price span{
  font-size:11px;
}

/* =========================
   UPLOAD
========================= */

.uploadArea{
  padding:7px;

  background:#fff;

  border-top:1px solid #eee;
}

.uploadButton{
  width:100%;

  height:34px;

  border:none;

  border-radius:18px;

  background:#9d5aa7;

  color:#fff;

  font-weight:900;

  font-size:12px;
}

#fileInput{
  display:none;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(40,20,45,.5);

  z-index:100;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:86%;
  max-width:350px;

  background:#fff;

  border-radius:22px;

  padding:20px;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.25);

  text-align:center;
}

.modalTitle{
  font-size:20px;
  font-weight:900;
  color:#7c4585;
}

.modalItem{
  margin:12px auto;

  width:130px;
  height:130px;

  object-fit:contain;

  display:block;
}

.modalText{
  font-size:13px;
  font-weight:700;
  color:#644d67;
}

.modalButton{
  width:100%;

  height:42px;

  margin-top:12px;

  border:none;

  border-radius:22px;

  background:#c15ccf;

  color:white;

  font-size:14px;

  font-weight:900;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  left:50%;
  bottom:45%;

  transform:
    translate(-50%,20px);

  padding:10px 18px;

  border-radius:25px;

  background:#5d3d64;

  color:#fff;

  font-size:13px;

  font-weight:900;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  z-index:200;

  white-space:nowrap;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

/* =========================
   GIFT BUTTONS
========================= */

.giftArea{
  display:flex;
  gap:5px;

  padding:6px 8px;

  background:#fff;

  border-bottom:1px solid #eee;
}

.giftBtn{
  flex:1;

  height:34px;

  border:2px solid #eadb50;

  border-radius:18px;

  background:#fffbe3;

  color:#806400;

  font-size:11px;

  font-weight:900;
}

.giftBtn:active{
  transform:scale(.96);
}

/* =========================
   PC
========================= */

@media(min-width:700px){

  .app{
    box-shadow:
      0 0 30px
      rgba(80,40,90,.15);
  }

  .bottomPanel{
    flex-basis:35%;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <div class="title">
      🎀 ギフトで着せ替え
    </div>

    <div class="coinBox">
      <span class="coinIcon">🪙</span>
      <span id="coinCount">0</span>
      <span>コイン</span>
    </div>

  </header>


  <!-- CHARACTER -->
  <main class="characterArea">

    <div class="currentItem" id="currentItem">
      ベースキャラクター
    </div>

    <div
      class="characterStage"
      id="characterStage"
    >

      <!-- 本体 -->
      <img
        id="base"
        class="layer"
        src=""
        alt="キャラクター"
      >

      <!-- 靴下 -->
      <img
        id="socksLayer"
        class="layer socks"
        src=""
        alt=""
      >

      <!-- ボトム -->
      <img
        id="bottomLayer"
        class="layer bottomLayer bottom"
        src=""
        alt=""
      >

      <!-- ワンピース -->
      <img
        id="onepieceLayer"
        class="layer onepiece"
        src=""
        alt=""
      >

      <!-- トップス -->
      <img
        id="topLayer"
        class="layer topLayer top"
        src=""
        alt=""
      >

      <!-- アウター -->
      <img
        id="outerLayer"
        class="layer outer"
        src=""
        alt=""
      >

      <!-- 靴 -->
      <img
        id="shoesLayer"
        class="layer shoes"
        src=""
        alt=""
      >

      <!-- 髪 -->
      <img
        id="hairLayer"
        class="layer hair"
        src=""
        alt=""
      >

      <!-- アクセサリー -->
      <img
        id="accessoryLayer"
        class="layer accessory"
        src=""
        alt=""
      >

    </div>

  </main>


  <!-- GIFT / COIN -->
  <div class="giftArea">

    <button
      class="giftBtn"
      onclick="addCoins(1)"
    >
      💗 1コイン
    </button>

    <button
      class="giftBtn"
      onclick="addCoins(10)"
    >
      🍩 10コイン
    </button>

    <button
      class="giftBtn"
      onclick="addCoins(100)"
    >
      🎁 100コイン
    </button>

    <button
      class="giftBtn"
      onclick="addCoins(500)"
    >
      💎 500コイン
    </button>

  </div>


  <!-- ITEMS -->
  <section class="bottomPanel">

    <nav class="tabs">

      <button
        class="tab active"
        data-category="hair"
        onclick="changeCategory('hair',this)"
      >
        💇 髪
      </button>

      <button
        class="tab"
        data-category="top"
        onclick="changeCategory('top',this)"
      >
        👚 トップス
      </button>

      <button
        class="tab"
        data-category="onepiece"
        onclick="changeCategory('onepiece',this)"
      >
        👗 ワンピース
      </button>

      <button
        class="tab"
        data-category="bottom"
        onclick="changeCategory('bottom',this)"
      >
        👖 ボトム
      </button>

      <button
        class="tab"
        data-category="outer"
        onclick="changeCategory('outer',this)"
      >
        🧥 アウター
      </button>

      <button
        class="tab"
        data-category="socks"
        onclick="changeCategory('socks',this)"
      >
        🧦 靴下
      </button>

      <button
        class="tab"
        data-category="shoes"
        onclick="changeCategory('shoes',this)"
      >
        👟 靴
      </button>

      <button
        class="tab"
        data-category="accessory"
        onclick="changeCategory('accessory',this)"
      >
        💎 アクセ
      </button>

    </nav>


    <div class="itemArea">

      <div
        class="items"
        id="items"
      ></div>

    </div>


    <div class="uploadArea">

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        multiple
        onchange="loadImages(event)"
      >

      <button
        class="uploadButton"
        onclick="document.getElementById('fileInput').click()"
      >
        📷 自分のアイテム画像を追加
      </button>

    </div>

  </section>

</div>


<!-- GET MODAL -->

<div
  class="modal"
  id="modal"
>

  <div class="modalBox">

    <div class="modalTitle">
      ✨ アイテムGET！
    </div>

    <img
      id="modalImage"
      class="modalItem"
      src=""
      alt=""
    >

    <div
      class="modalText"
      id="modalText"
    >
    </div>

    <button
      class="modalButton"
      onclick="closeModal()"
    >
      着せる
    </button>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =====================================================
   基本設定
===================================================== */

let coins = 0;

let currentCategory = "hair";

let selectedItem = null;


/* =====================================================
   アイテムデータ
   price = 必要コイン
===================================================== */

const items = {

  hair:[
    {
      id:"hair1",
      name:"ロングヘア",
      price:100,
      src:""
    },
    {
      id:"hair2",
      name:"ハーフアップ",
      price:100,
      src:""
    },
    {
      id:"hair3",
      name:"ツインテール",
      price:500,
      src:""
    },
    {
      id:"hair4",
      name:"おだんご",
      price:500,
      src:""
    }
  ],

  top:[
    {
      id:"top1",
      name:"ハートトップス",
      price:10,
      src:""
    },
    {
      id:"top2",
      name:"リボンブラウス",
      price:100,
      src:""
    },
    {
      id:"top3",
      name:"パーカー",
      price:100,
      src:""
    },
    {
      id:"top4",
      name:"ブラックトップス",
      price:500,
      src:""
    }
  ],

  onepiece:[
    {
      id:"dress1",
      name:"ピンクドレス",
      price:100,
      src:""
    },
    {
      id:"dress2",
      name:"プリンセスドレス",
      price:500,
      src:""
    }
  ],

  bottom:[
    {
      id:"bottom1",
      name:"ピンクスカート",
      price:10,
      src:""
    },
    {
      id:"bottom2",
      name:"ブラックスカート",
      price:100,
      src:""
    },
    {
      id:"bottom3",
      name:"デニムショートパンツ",
      price:100,
      src:""
    },
    {
      id:"bottom4",
      name:"カーゴパンツ",
      price:500,
      src:""
    }
  ],

  outer:[
    {
      id:"outer1",
      name:"ハートジャケット",
      price:100,
      src:""
    },
    {
      id:"outer2",
      name:"ピンクアウター",
      price:500,
      src:""
    },
    {
      id:"outer3",
      name:"デニムジャケット",
      price:100,
      src:""
    }
  ],

  socks:[
    {
      id:"socks1",
      name:"ホワイトソックス",
      price:10,
      src:""
    },
    {
      id:"socks2",
      name:"ブラックソックス",
      price:100,
      src:""
    },
    {
      id:"socks3",
      name:"リボンソックス",
      price:500,
      src:""
    }
  ],

  shoes:[
    {
      id:"shoes1",
      name:"ブラックシューズ",
      price:10,
      src:""
    },
    {
      id:"shoes2",
      name:"ブラックブーツ",
      price:100,
      src:""
    },
    {
      id:"shoes3",
      name:"うさぎシューズ",
      price:500,
      src:""
    },
    {
      id:"shoes4",
      name:"リボンブーツ",
      price:500,
      src:""
    }
  ],

  accessory:[
    {
      id:"accessory1",
      name:"ハートネックレス",
      price:10,
      src:""
    },
    {
      id:"accessory2",
      name:"ハートイヤリング",
      price:100,
      src:""
    },
    {
      id:"accessory3",
      name:"ハートメガネ",
      price:500,
      src:""
    }
  ]

};


/* =====================================================
   初期表示
===================================================== */

renderItems();


/* =====================================================
   コイン追加
===================================================== */

function addCoins(value){

  coins += value;

  document.getElementById(
    "coinCount"
  ).textContent = coins;

  showToast(
    `🪙 ${value}コイン追加！`
  );

  renderItems();
}


/* =====================================================
   カテゴリー変更
===================================================== */

function changeCategory(category,button){

  currentCategory = category;

  document
    .querySelectorAll(".tab")
    .forEach(tab=>{
      tab.classList.remove("active");
    });

  button.classList.add("active");

  renderItems();
}


/* =====================================================
   アイテム表示
===================================================== */

function renderItems(){

  const container =
    document.getElementById("items");

  container.innerHTML = "";

  const list =
    items[currentCategory] || [];

  list.forEach(item=>{

    const card =
      document.createElement("div");

    card.className = "item";

    if(
      selectedItem &&
      selectedItem.id === item.id
    ){
      card.classList.add("selected");
    }

    if(coins < item.price){
      card.classList.add("locked");
    }

    card.innerHTML = `

      ${
        item.src
        ?
        `<img
          class="itemImage"
          src="${item.src}"
        >`
        :
        `<div
          class="itemImage"
          style="
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:25px;
          "
        >
          🖼️
        </div>`
      }

      <div class="itemName">
        ${item.name}
      </div>

      <div class="price">
        🪙 ${item.price}
      </div>

    `;

    card.onclick = ()=>{
      selectItem(item);
    };

    container.appendChild(card);

  });

}


/* =====================================================
   アイテム選択
===================================================== */

function selectItem(item){

  /*
    コイン不足
  */

  if(coins < item.price){

    const need =
      item.price - coins;

    showToast(
      `🪙 あと ${need}コイン必要です`
    );

    return;
  }


  /*
    コインを消費
  */

  coins -= item.price;

  document.getElementById(
    "coinCount"
  ).textContent = coins;


  /*
    選択
  */

  selectedItem = item;


  /*
    着せる
  */

  wearItem(item);


  /*
    GET表示
  */

  showModal(item);


  renderItems();
}


/* =====================================================
   アイテムをキャラクターに着せる
===================================================== */

function wearItem(item){

  const map = {

    hair:
      "hairLayer",

    top:
      "topLayer",

    onepiece:
      "onepieceLayer",

    bottom:
      "bottomLayer",

    outer:
      "outerLayer",

    socks:
      "socksLayer",

    shoes:
      "shoesLayer",

    accessory:
      "accessoryLayer"

  };


  const layer =
    document.getElementById(
      map[currentCategory]
    );

  if(!layer) return;


  /*
    画像が登録されている場合
  */

  if(item.src){

    layer.src = item.src;

    layer.classList.add("active");

  }


  /*
    ワンピース
  */

  const stage =
    document.getElementById(
      "characterStage"
    );

  if(currentCategory === "onepiece"){

    stage.classList.add(
      "onepieceOn"
    );

  }else{

    /*
      トップスまたはボトムを選択したら
      ワンピースを解除
    */

    if(
      currentCategory === "top" ||
      currentCategory === "bottom"
    ){

      stage.classList.remove(
        "onepieceOn"
      );

    }

  }


  document.getElementById(
    "currentItem"
  ).textContent =
    item.name;
}


/* =====================================================
   MODAL
===================================================== */

function showModal(item){

  const modal =
    document.getElementById("modal");

  const image =
    document.getElementById("modalImage");

  const text =
    document.getElementById("modalText");

  if(item.src){

    image.src = item.src;

    image.style.display =
      "block";

  }else{

    image.style.display =
      "none";

  }

  text.textContent =
    `${item.name}をGET！`;

  modal.classList.add("show");
}


function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("show");

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{

      toast.classList.remove("show");

    },1800);

}


/* =====================================================
   画像アップロード
===================================================== */

function loadImages(event){

  const files =
    Array.from(event.target.files);

  if(!files.length) return;


  files.forEach((file,index)=>{

    const reader =
      new FileReader();

    reader.onload = function(e){

      /*
        アップロードした画像を
        現在のカテゴリーのアイテムに追加
      */

      const newItem = {

        id:
          "upload_" +
          Date.now() +
          "_" +
          index,

        name:
          file.name
            .replace(/\.[^/.]+$/,""),

        /*
          初期価格
          必要ならあとで変更
        */

        price:100,

        src:e.target.result

      };


      items[currentCategory]
        .push(newItem);


      renderItems();

      showToast(
        "📷 アイテムを追加しました"
      );

    };

    reader.readAsDataURL(file);

  });


  event.target.value = "";

}


/* =====================================================
   キャラクター本体画像
