<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>ギフトで着せ替え</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    sans-serif;
}

body{
  background:linear-gradient(160deg,#24104f,#54248d,#25104b);
  color:#fff;
}

.app{
  width:100%;
  height:100%;
  max-width:600px;
  margin:auto;
  display:flex;
  flex-direction:column;
  padding:10px;
}

/* =========================
   HEADER
========================= */

.header{
  flex:0 0 auto;
  text-align:center;
  padding:4px 0 8px;
}

.title{
  font-size:clamp(22px,6vw,34px);
  font-weight:900;
  letter-spacing:1px;
  text-shadow:0 3px 8px rgba(0,0,0,.35);
}

.subtitle{
  font-size:clamp(12px,3.3vw,17px);
  margin-top:2px;
  opacity:.9;
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* =========================
   CHARACTER
========================= */

.character-area{
  position:relative;
  flex:1;
  min-height:0;
  border-radius:22px;
  background:
    radial-gradient(circle at 50% 35%,#fff7 0 4%,transparent 5%),
    linear-gradient(145deg,#fff2,#ffffff08);
  border:2px solid rgba(255,255,255,.25);
  box-shadow:
    0 10px 30px rgba(0,0,0,.3),
    inset 0 0 30px rgba(255,255,255,.06);
  overflow:hidden;
}

/* 背景のキラキラ */

.sparkle{
  position:absolute;
  font-size:20px;
  opacity:.7;
  animation:float 3s ease-in-out infinite;
}

.s1{top:8%;left:10%;}
.s2{top:15%;right:10%;animation-delay:.8s;}
.s3{top:45%;left:5%;animation-delay:1.4s;}
.s4{top:50%;right:6%;animation-delay:2s;}
.s5{bottom:15%;left:13%;animation-delay:.5s;}
.s6{bottom:10%;right:15%;animation-delay:1.2s;}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-10px) rotate(8deg);}
}

/* =========================
   PERSON
========================= */

.person{
  position:absolute;
  left:50%;
  top:50%;
  width:min(54vw,250px);
  height:min(78vw,360px);
  max-height:90%;
  transform:translate(-50%,-48%);
}

/* head */

.head{
  position:absolute;
  width:34%;
  aspect-ratio:1;
  left:33%;
  top:4%;
  background:#f4c39e;
  border-radius:48% 48% 45% 45%;
  border:3px solid #b97650;
  z-index:5;
}

.hair{
  position:absolute;
  width:110%;
  height:60%;
  left:-5%;
  top:-10%;
  background:#34221d;
  border-radius:55% 55% 35% 35%;
  z-index:6;
}

.hair:after{
  content:"";
  position:absolute;
  width:35%;
  height:85%;
  left:25%;
  top:5%;
  background:#34221d;
  border-radius:0 0 60% 60%;
  transform:rotate(12deg);
}

.eye{
  position:absolute;
  width:10%;
  aspect-ratio:1;
  background:#33231f;
  border-radius:50%;
  top:50%;
  z-index:8;
}

.eye.left{left:27%;}
.eye.right{right:27%;}

.mouth{
  position:absolute;
  width:24%;
  height:10%;
  left:38%;
  top:68%;
  border-bottom:3px solid #8d4a48;
  border-radius:50%;
  z-index:8;
}

/* body */

.body{
  position:absolute;
  width:52%;
  height:48%;
  left:24%;
  top:29%;
  background:#d9d9df;
  border-radius:28px 28px 12px 12px;
  border:3px solid #888;
  z-index:3;
}

/* arms */

.arm{
  position:absolute;
  width:14%;
  height:42%;
  top:32%;
  background:#f4c39e;
  border:3px solid #b97650;
  border-radius:30px;
  z-index:2;
}

.arm.left{
  left:12%;
  transform:rotate(10deg);
}

.arm.right{
  right:12%;
  transform:rotate(-10deg);
}

/* legs */

.leg{
  position:absolute;
  width:20%;
  height:30%;
  top:70%;
  background:#26354b;
  border:3px solid #182235;
  border-radius:8px 8px 25px 25px;
  z-index:1;
}

.leg.left{left:29%;}
.leg.right{right:29%;}

.shoe{
  position:absolute;
  width:25%;
  height:9%;
  background:#111;
  border-radius:20px 25px 10px 10px;
  top:94%;
  z-index:2;
}

.shoe.left{left:24%;}
.shoe.right{right:24%;}

/* =========================
   ITEM LAYERS
========================= */

.item{
  position:absolute;
  display:none;
  pointer-events:none;
}

/* hat */

.hat{
  width:50%;
  height:20%;
  left:25%;
  top:-2%;
  background:#e83d75;
  border-radius:55% 55% 10% 10%;
  border:4px solid #a61e4f;
  z-index:20;
}

.hat:after{
  content:"";
  position:absolute;
  width:130%;
  height:25%;
  left:-15%;
  bottom:-10%;
  background:#e83d75;
  border-radius:50%;
  border:4px solid #a61e4f;
}

/* glasses */

.glasses{
  width:60%;
  height:12%;
  left:20%;
  top:17%;
  z-index:25;
}

.glasses:before,
.glasses:after{
  content:"";
  position:absolute;
  width:35%;
  height:80%;
  border:4px solid #222;
  border-radius:50%;
  top:0;
}

.glasses:before{left:0;}
.glasses:after{right:0;}

.glasses span{
  position:absolute;
  width:32%;
  height:4px;
  background:#222;
  left:34%;
  top:42%;
}

/* top */

.top{
  width:60%;
  height:42%;
  left:20%;
  top:31%;
  background:#4f8de8;
  border-radius:25px 25px 12px 12px;
  border:4px solid #285aa9;
  z-index:10;
}

/* ribbon */

.ribbon{
  width:18%;
  height:12%;
  left:41%;
  top:39%;
  z-index:15;
}

.ribbon:before,
.ribbon:after{
  content:"";
  position:absolute;
  width:55%;
  height:80%;
  background:#f2c94c;
  border:2px solid #b78c19;
  top:5%;
}

.ribbon:before{
  left:0;
  transform:rotate(30deg);
}

.ribbon:after{
  right:0;
  transform:rotate(-30deg);
}

.ribbon span{
  position:absolute;
  width:35%;
  height:45%;
  left:32%;
  top:25%;
  background:#f5d75b;
  border-radius:50%;
  z-index:2;
}

/* skirt */

.skirt{
  width:62%;
  height:25%;
  left:19%;
  top:58%;
  background:#ef6ca4;
  border:4px solid #a93869;
  clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);
  z-index:9;
}

/* bag */

.bag{
  width:22%;
  height:20%;
  right:4%;
  top:54%;
  background:#ffd35a;
  border:4px solid #b98b20;
  border-radius:12px;
  z-index:20;
}

.bag:before{
  content:"";
  position:absolute;
  width:60%;
  height:35%;
  left:20%;
  top:-28%;
  border:4px solid #b98b20;
  border-bottom:0;
  border-radius:20px 20px 0 0;
}

/* necklace */

.necklace{
  width:38%;
  height:20%;
  left:31%;
  top:27%;
  border:4px solid #ffd84d;
  border-top:0;
  border-radius:0 0 50% 50%;
  z-index:14;
}

.necklace:after{
  content:"💎";
  position:absolute;
  left:42%;
  bottom:-20%;
  font-size:20px;
}

/* =========================
   ITEM POPUP
========================= */

.popup{
  position:absolute;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%) scale(.5);
  opacity:0;
  pointer-events:none;
  background:#fff;
  color:#4b267d;
  padding:12px 20px;
  border-radius:18px;
  font-size:clamp(17px,4.5vw,25px);
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 8px 25px #0005;
  z-index:100;
}

.popup.show{
  animation:popup .9s ease forwards;
}

@keyframes popup{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.5) rotate(-5deg);
  }
  25%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.08) rotate(3deg);
  }
  70%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-65%) scale(.9);
  }
}

/* =========================
   STATUS
========================= */

.status{
  flex:0 0 auto;
  background:rgba(0,0,0,.22);
  border-radius:15px;
  padding:7px 10px;
  text-align:center;
}

.status-title{
  font-size:13px;
  opacity:.85;
}

.progress{
  font-size:clamp(18px,4.5vw,25px);
  font-weight:900;
  margin-top:2px;
}

.progress-bar{
  width:100%;
  height:8px;
  background:#ffffff25;
  border-radius:10px;
  margin-top:5px;
  overflow:hidden;
}

.progress-fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#ffd54a,#ff6fb1);
  border-radius:10px;
  transition:.4s;
}

/* =========================
   ITEMS PANEL
========================= */

.items-panel{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

.item-card{
  min-width:0;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  padding:5px 2px;
  text-align:center;
  font-size:clamp(10px,2.7vw,14px);
  opacity:.45;
  transition:.3s;
}

.item-card .icon{
  font-size:clamp(18px,5vw,26px);
  display:block;
  line-height:1.1;
}

.item-card.active{
  opacity:1;
  background:rgba(255,255,255,.22);
  border-color:#ffd84d;
  box-shadow:0 0 12px rgba(255,216,77,.35);
}

/* =========================
   BUTTONS
========================= */

.buttons{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:7px;
}

.gift-button,
.reset-button{
  border:0;
  border-radius:16px;
  font-weight:900;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.gift-button{
  min-height:52px;
  font-size:clamp(18px,5vw,27px);
  color:#fff;
  background:linear-gradient(135deg,#ff4f91,#ff7b39);
  box-shadow:0 6px 0 #a92d59;
}

.gift-button:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #a92d59;
}

.reset-button{
  background:#ffffff18;
  color:#fff;
  border:1px solid #ffffff40;
  font-size:14px;
}

.reset-button:active{
  transform:scale(.96);
}

/* =========================
   COMPLETE
========================= */

.complete{
  position:absolute;
  inset:0;
  background:rgba(39,13,73,.9);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  z-index:200;
  padding:20px;
}

.complete.show{
  display:flex;
  animation:fadein .3s ease;
}

@keyframes fadein{
  from{opacity:0;}
  to{opacity:1;}
}

.complete-icon{
  font-size:70px;
  animation:bounce 1s infinite alternate;
}

@keyframes bounce{
  from{transform:scale(1);}
  to{transform:scale(1.12);}
}

.complete-title{
  font-size:clamp(30px,8vw,48px);
  font-weight:900;
  margin-top:5px;
}

.complete-text{
  font-size:16px;
  margin-top:8px;
}

.complete-reset{
  margin-top:20px;
  padding:13px 30px;
  border:0;
  border-radius:20px;
  font-size:17px;
  font-weight:900;
  color:#54248d;
  background:#fff;
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-height:650px){

  .app{
    padding:5px;
  }

  .header{
    padding:1px 0 4px;
  }

  .title{
    font-size:22px;
  }

  .subtitle{
    font-size:11px;
  }

  .main{
    gap:4px;
  }

  .items-panel{
    gap:3px;
  }

  .item-card{
    padding:3px 1px;
  }

  .gift-button{
    min-height:43px;
    font-size:19px;
  }

  .status{
    padding:4px 8px;
  }

  .progress-bar{
    height:5px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="title">🎁 ギフトで着せ替え！</div>
    <div class="subtitle">ギフトが来るたびにアイテムGET！</div>
  </header>

  <main class="main">

    <section class="character-area">

      <div class="sparkle s1">✨</div>
      <div class="sparkle s2">⭐</div>
      <div class="sparkle s3">💫</div>
      <div class="sparkle s4">✨</div>
      <div class="sparkle s5">⭐</div>
      <div class="sparkle s6">💖</div>

      <div class="person">

        <div class="head">
          <div class="hair"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth"></div>
        </div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="body"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

        <div class="shoe left"></div>
        <div class="shoe right"></div>

        <!-- 着せ替えアイテム -->

        <div class="item hat" id="hat"></div>

        <div class="item glasses" id="glasses">
          <span></span>
        </div>

        <div class="item top" id="top"></div>

        <div class="item ribbon" id="ribbon">
          <span></span>
        </div>

        <div class="item skirt" id="skirt"></div>

        <div class="item bag" id="bag"></div>

        <div class="item necklace" id="necklace"></div>

      </div>

      <div class="popup" id="popup"></div>

      <!-- 完成画面 -->

      <div class="complete" id="complete">

        <div class="complete-icon">🎉</div>

        <div class="complete-title">
          コーデ完成！
        </div>

        <div class="complete-text">
          みんなのギフトで<br>
          全身コーデが完成しました！
        </div>

        <button class="complete-reset" onclick="resetGame()">
          🔄 もう一度
        </button>

      </div>

    </section>

    <!-- 進行状況 -->

    <section class="status">

      <div class="status-title">
        👗 コーデ完成まで
      </div>

      <div class="progress">
        <span id="count">0</span> / 7 アイテム
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

    </section>

    <!-- アイテム一覧 -->

    <section class="items-panel">

      <div class="item-card" id="card-hat">
        <span class="icon">👒</span>
        帽子
      </div>

      <div class="item-card" id="card-glasses">
        <span class="icon">👓</span>
        メガネ
      </div>

      <div class="item-card" id="card-top">
        <span class="icon">👕</span>
        トップス
      </div>

      <div class="item-card" id="card-ribbon">
        <span class="icon">🎀</span>
        リボン
      </div>

      <div class="item-card" id="card-skirt">
        <span class="icon">👗</span>
        ボトムス
      </div>

      <div class="item-card" id="card-bag">
        <span class="icon">👜</span>
        バッグ
      </div>

      <div class="item-card" id="card-necklace">
        <span class="icon">💎</span>
        アクセ
      </div>

    </section>

    <!-- 操作 -->

    <section class="buttons">

      <button class="gift-button" onclick="giftReceived()">
        🎁 ギフトが来た！
      </button>

      <button class="reset-button" onclick="resetGame()">
        🔄 リセット
      </button>

    </section>

  </main>

</div>

<script>

/* =========================
   データ
========================= */

const items = [

  {
    id:"hat",
    name:"帽子",
    emoji:"👒"
  },

  {
    id:"glasses",
    name:"メガネ",
    emoji:"👓"
  },

  {
    id:"top",
    name:"トップス",
    emoji:"👕"
  },

  {
    id:"ribbon",
    name:"リボン",
    emoji:"🎀"
  },

  {
    id:"skirt",
    name:"ボトムス",
    emoji:"👗"
  },

  {
    id:"bag",
    name:"バッグ",
    emoji:"👜"
  },

  {
    id:"necklace",
    name:"アクセサリー",
    emoji:"💎"
  }

];

let unlocked = [];


/* =========================
   ギフト
========================= */

function giftReceived(){

  if(unlocked.length >= items.length){
    return;
  }

  /* まだ持っていないアイテムだけから抽選 */

  const remaining = items.filter(
    item => !unlocked.includes(item.id)
  );

  const selected =
    remaining[Math.floor(Math.random() * remaining.length)];

  unlocked.push(selected.id);

  /* アイテム表示 */

  const element =
    document.getElementById(selected.id);

  element.style.display = "block";

  /* カード表示 */

  const card =
    document.getElementById("card-" + selected.id);

  card.classList.add("active");

  /* カウント */

  updateProgress();

  /* ポップアップ */

  showPopup(
    selected.emoji + " " +
    selected.name +
    " GET！"
  );

  /* 全部揃った */

  if(unlocked.length === items.length){

    setTimeout(()=>{
      document
        .getElementById("complete")
        .classList.add("show");
    },1000);

  }

}


/* =========================
   進行状況
========================= */

function updateProgress(){

  const count =
    document.getElementById("count");

  const fill =
    document.getElementById("progressFill");

  count.textContent =
    unlocked.length;

  fill.style.width =
    (unlocked.length / items.length * 100) + "%";

}


/* =========================
   ポップアップ
========================= */

function showPopup(text){

  const popup =
    document.getElementById("popup");

  popup.textContent = text;

  popup.classList.remove("show");

  /* アニメーション再スタート */

  void popup.offsetWidth;

  popup.classList.add("show");

}


/* =========================
   リセット
========================= */

function resetGame(){

  unlocked = [];

  items.forEach(item => {

    const element =
      document.getElementById(item.id);

    element.style.display = "none";

    const card =
      document.getElementById("card-" + item.id);

    card.classList.remove("active");

  });

  document
    .getElementById("complete")
    .classList.remove("show");

  updateProgress();

}


/* =========================
   初期化
========================= */

updateProgress();

</script>

</body>
</html>
