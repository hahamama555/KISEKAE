<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>ギフトで着せ替え</title>

<style>

/* ==================================================
   RESET
================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Noto Sans JP",
    sans-serif;

  background:#f7f3ff;
}

body{
  touch-action:manipulation;
}

button,
input,
select{
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}


/* ==================================================
   APP
================================================== */

#app{
  width:100%;
  height:100%;

  max-width:600px;

  margin:0 auto;

  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #fffaff 0%,
      #f6f0ff 100%
    );
}


/* ==================================================
   HEADER
================================================== */

.header{
  height:58px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  z-index:50;

  background:rgba(255,255,255,.98);

  border-bottom:1px solid #eadff5;

  pointer-events:auto;
}

.headerTitle{
  font-size:19px;
  font-weight:900;

  color:#6a3fa0;
}


/* ==================================================
   MAIN
================================================== */

.main{
  height:calc(100% - 58px);

  display:flex;
  flex-direction:column;

  overflow:hidden;

  position:relative;

  z-index:1;
}


/* ==================================================
   CHARACTER AREA
================================================== */

.characterArea{
  flex:1;

  min-height:0;

  position:relative;

  z-index:1;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:8px 10px 0;

  overflow:hidden;

  pointer-events:none;
}

.characterStage{
  width:100%;
  height:100%;

  position:relative;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  /*
    キャラクター画像が
    下のボタン操作を邪魔しない
  */
  pointer-events:none;
}


/* ==================================================
   CHARACTER LAYERS
================================================== */

.layer{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  max-width:94%;
  max-height:96%;

  width:auto;
  height:auto;

  object-fit:contain;

  pointer-events:none;

  user-select:none;

  -webkit-user-drag:none;
}


/* ==================================================
   LAYER ORDER
================================================== */

#baseLayer{
  z-index:1;
}

#bottomLayer{
  z-index:2;
}

#topLayer{
  z-index:3;
}

#onepieceLayer{
  z-index:4;
}

#dressLayer{
  z-index:5;
}

#outerLayer{
  z-index:6;
}

#hairLayer{
  z-index:7;
}

#accessoryLayer{
  z-index:8;
}

#shoesLayer{
  z-index:9;
}


/* ==================================================
   CATEGORY AREA
================================================== */

.categoryArea{
  height:128px;

  flex-shrink:0;

  position:relative;

  z-index:20;

  padding:7px 8px 8px;

  background:rgba(255,255,255,.98);

  border-top:1px solid #eadff5;

  pointer-events:auto;
}

.categoryGrid{
  width:100%;
  height:100%;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  grid-template-rows:
    repeat(2,1fr);

  gap:6px;
}

.categoryBtn{
  min-width:0;

  position:relative;

  z-index:30;

  border:0;

  border-radius:13px;

  background:#f0e7ff;

  color:#633895;

  font-weight:900;

  font-size:13px;

  box-shadow:
    0 2px 5px
    rgba(100,70,130,.12);

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;

  user-select:none;
}

.categoryBtn:active{
  transform:scale(.96);
}

.categoryBtn.active{
  background:#8e55d9;
  color:#fff;
}


/* ==================================================
   BOTTOM MENU
================================================== */

.bottomMenu{
  height:58px;

  flex-shrink:0;

  position:relative;

  z-index:50;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px;

  padding:7px 8px;

  background:#fff;

  border-top:1px solid #eadff5;

  pointer-events:auto;
}

.menuBtn{
  min-width:0;

  position:relative;

  z-index:60;

  border:0;

  border-radius:13px;

  background:#eee6fa;

  color:#613b88;

  font-size:13px;

  font-weight:900;

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;

  user-select:none;
}

.menuBtn:active{
  transform:scale(.97);
}

.menuBtn:focus{
  outline:none;
}


/* ==================================================
   MODAL
================================================== */

.modal{
  position:absolute;

  inset:0;

  z-index:1000;

  display:none;

  align-items:flex-end;

  background:
    rgba(34,20,45,.48);

  pointer-events:none;
}

.modal.show{
  display:flex;

  pointer-events:auto;
}

.modalBox{
  width:100%;

  max-height:92%;

  position:relative;

  z-index:1001;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  background:#fff;

  border-radius:
    22px 22px 0 0;

  pointer-events:auto;
}


/* ==================================================
   MODAL TITLE
================================================== */

.modalTitle{
  height:58px;

  flex-shrink:0;

  display:flex;

  align-items:center;
  justify-content:center;

  position:relative;

  z-index:1002;

  border-bottom:1px solid #eee;

  font-size:18px;

  font-weight:900;

  color:#573174;

  pointer-events:auto;
}

.closeBtn{
  position:absolute;

  right:10px;
  top:10px;

  width:38px;
  height:38px;

  z-index:1010;

  border:0;

  border-radius:50%;

  background:#f1eafa;

  color:#62398b;

  font-size:22px;

  font-weight:900;

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;
}


/* ==================================================
   ITEM HEADER
================================================== */

.itemHeader{
  height:58px;

  flex-shrink:0;

  display:flex;

  align-items:center;
  justify-content:center;

  position:relative;

  z-index:1002;

  border-bottom:1px solid #eee;

  background:#fff;

  pointer-events:auto;
}

.itemHeaderTitle{
  font-size:17px;

  font-weight:900;

  color:#573174;
}

.itemBack{
  position:absolute;

  left:9px;
  top:9px;

  height:40px;

  padding:0 13px;

  z-index:1010;

  border:0;

  border-radius:12px;

  background:#eee6fa;

  color:#633895;

  font-weight:900;

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;
}


/* ==================================================
   ITEM LIST
================================================== */

.itemList{
  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:10px;

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;

  align-content:start;

  -webkit-overflow-scrolling:touch;

  overscroll-behavior:contain;

  pointer-events:auto;
}


/* ==================================================
   ITEM CARD
================================================== */

.itemCard{
  min-width:0;

  position:relative;

  padding:7px;

  border:2px solid #eee5f6;

  border-radius:16px;

  background:#fff;

  box-shadow:
    0 2px 8px
    rgba(90,50,120,.08);

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;

  user-select:none;
}

.itemCard:active{
  transform:scale(.98);
}

.itemCard.selected{
  border-color:#9a62dd;

  box-shadow:
    0 0 0 2px
    rgba(154,98,221,.15);
}


/* ==================================================
   ITEM IMAGE
================================================== */

.itemImageBox{
  width:100%;

  aspect-ratio:1/1;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  border-radius:12px;

  background:#faf8fc;

  pointer-events:none;
}

.itemImage{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;

  pointer-events:none;
}


/* ==================================================
   ITEM NAME
================================================== */

.itemName{
  margin-top:5px;

  font-size:13px;

  font-weight:900;

  color:#4d385a;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  text-align:center;

  pointer-events:none;
}


/* ==================================================
   ITEM PRICE
================================================== */

.itemPrice{
  margin-top:3px;

  text-align:center;

  font-size:12px;

  font-weight:900;

  color:#8a5aaf;

  pointer-events:none;
}


/* ==================================================
   DELETE
================================================== */

.itemDelete{
  position:absolute;

  right:5px;
  top:5px;

  width:29px;
  height:29px;

  z-index:5;

  border:0;

  border-radius:50%;

  background:
    rgba(255,255,255,.94);

  color:#c45b72;

  font-size:15px;

  font-weight:900;

  box-shadow:
    0 2px 5px
    rgba(0,0,0,.12);

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;
}


/* ==================================================
   EMPTY
================================================== */

.empty{
  grid-column:1/-1;

  padding:40px 10px;

  text-align:center;

  color:#987fa8;

  font-size:14px;

  font-weight:700;
}


/* ==================================================
   FORM
================================================== */

.formArea{
  padding:16px;

  overflow-y:auto;

  pointer-events:auto;

  -webkit-overflow-scrolling:touch;
}

.formLabel{
  display:block;

  margin-bottom:6px;

  font-size:13px;

  font-weight:900;

  color:#573174;
}

.formInput,
.formSelect{
  width:100%;

  height:45px;

  margin-bottom:14px;

  padding:0 11px;

  border:1px solid #ded2e8;

  border-radius:11px;

  outline:none;

  background:#fff;

  font-size:15px;

  pointer-events:auto;
}

.formInput:focus,
.formSelect:focus{
  border-color:#9460cf;
}

.fileInput{
  width:100%;

  margin-bottom:14px;

  pointer-events:auto;
}

.saveBtn{
  width:100%;

  height:48px;

  border:0;

  border-radius:13px;

  background:#8e55d9;

  color:#fff;

  font-size:15px;

  font-weight:900;

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;
}

.saveBtn:active{
  transform:scale(.98);
}


/* ==================================================
   SMALL SCREEN
================================================== */

@media(max-height:700px){

  .categoryArea{
    height:112px;
  }

  .bottomMenu{
    height:52px;
  }

  .categoryBtn{
    font-size:12px;
  }

}


/* ==================================================
   DESKTOP
================================================== */

@media(min-width:601px){

  #app{
    border-left:
      1px solid #eadff5;

    border-right:
      1px solid #eadff5;
  }

}

</style>
</head>


<body>

<div id="app">


<!-- ==================================================
     HEADER
================================================== -->

<header class="header">

  <div class="headerTitle">
    🎀 ギフトで着せ替え
  </div>

</header>


<!-- ==================================================
     MAIN
================================================== -->

<main class="main">


<!-- ==================================================
     CHARACTER
================================================== -->

<section class="characterArea">

  <div class="characterStage">

    <img
      id="baseLayer"
      class="layer"
      alt=""
    >

    <img
      id="bottomLayer"
      class="layer"
      alt=""
    >

    <img
      id="topLayer"
      class="layer"
      alt=""
    >

    <img
      id="onepieceLayer"
      class="layer"
      alt=""
    >

    <img
      id="dressLayer"
      class="layer"
      alt=""
    >

    <img
      id="outerLayer"
      class="layer"
      alt=""
    >

    <img
      id="hairLayer"
      class="layer"
      alt=""
    >

    <img
      id="accessoryLayer"
      class="layer"
      alt=""
    >

    <img
      id="shoesLayer"
      class="layer"
      alt=""
    >

  </div>

</section>


<!-- ==================================================
     CATEGORY
================================================== -->

<section class="categoryArea">

  <div class="categoryGrid">

    <button
      type="button"
      class="categoryBtn"
      data-category="top">
      👚 トップス
    </button>

    <button
      type="button"
      class="categoryBtn"
      data-category="onepiece">
      👗 ワンピース
    </button>

    <button
      type="button"
      class="categoryBtn"
      data-category="dress">
      ✨ ドレス
    </button>

    <button
      type="button"
      class="categoryBtn"
      data-category="bottom">
      👖 ボトムス
    </button>

    <button
      type="button"
      class="categoryBtn"
      data-category="outer">
      🧥 アウター
    </button>

    <button
      type="button"
      class="categoryBtn"
      data-category="hair">
      💇‍♀️ ヘア
    </button>

    <button
      type="button"
      class="categoryBtn"
      data-category="accessory">
      💎 アクセ
    </button>

    <button
      type="button"
      class="categoryBtn"
      data-category="shoes">
      👠 靴
    </button>

  </div>

</section>


<!-- ==================================================
     BOTTOM MENU
================================================== -->

<section class="bottomMenu">

  <button
    type="button"
    class="menuBtn"
    id="baseSettingBtn">
    👤 キャラ設定
  </button>

  <button
    type="button"
    class="menuBtn"
    id="itemSettingBtn">
    ➕ アイテム追加
  </button>

</section>

</main>


<!-- ==================================================
     ITEM MODAL
================================================== -->

<div
  class="modal"
  id="itemModal">

  <div class="modalBox">

    <div class="itemHeader">

      <button
        type="button"
        class="itemBack"
        id="itemBackBtn">
        ← 戻る

    <div

</div>


<!-- ==================================================
     BASE SETTING
================================================== -->

<div
  class="modal"
  id="baseModal">

  <div class="modalBox">

    <div class="modalTitle">

      キャラクター設定

      <button
        type="button"
        class="closeBtn"

</div>


<!-- ==================================================

================================================== -->

<div
  class="modal"
  id="settingModal">

  <div class="modalBox">

    <div class="modalTitle">

      アイテム追加

      <button
        type="button"
        class="closeBtn"

        class="formInput"
        placeholder="例：プリンセスドレス"
      >


      <label class="formLabel">
        カテゴリー
      </label>

      <select
        id="itemCategory"
        class="formSelect">

        <option value="top">
          トップス
        </option>

        <option value="onepiece">
          ワンピース
        </option>

        <option value="dress">
          ドレス
        </option>

        <option value="bottom">
          ボトムス
        </option>

        <option value="outer">
          アウター
        </option>

        <option value="hair">
          ヘア
        </option>

        <option value="accessory">
          アクセサリー
        </option>

        <option value="shoes">
          靴
        </option>

      </select>


      <label class="formLabel">
        表示する価格（コイン）
      </label>

      <input
        type="number"
        id="itemPrice"
        class="formInput"
        min="0"
        value="100"
      >


      <label class="formLabel">
        アイテム画像
      </label>

      <input
        type="file"
        id="itemFile"
        class="fileInput"
        accept="image/*"
      >


      <button
        type="button"
        class="saveBtn"
        id="itemSaveBtn">
        アイテムを追加
      </button>

    </div>

</div>


<script>

/* ==================================================
   CATEGORY
================================================== */

const CATEGORIES = {

  top:"トップス",

  onepiece:"ワンピース",

  dress:"ドレス",

  bottom:"ボトムス",

  outer:"アウター",

  hair:"ヘア",

  accessory:"アクセサリー",

  shoes:"靴"

};


/* ==================================================
   DATA
================================================== */

let baseImage = "";

let items = [];

let equipped = {

  top:null,

  onepiece:null,

  dress:null,

  bottom:null,

  outer:null,

  hair:null,

  accessory:null,

  shoes:null

};

let currentCategory = "top";


/* ==================================================
   DOM
================================================== */

const baseLayer =
  document.getElementById(
    "baseLayer"
  );

const itemList =
  document.getElementById(
    "itemList"
  );

const itemModal =
  document.getElementById(
    "itemModal"
  );

const settingModal =
  document.getElementById(
    "settingModal"
  );

const baseModal =
  document.getElementById(
    "baseModal"
  );

const itemModalTitle =
  document.getElementById(
    "itemModalTitle"
  );


/* ==================================================
   EMPTY EQUIPPED
================================================== */

function createEmptyEquipped(){

  return {

    top:null,

    onepiece:null,

    dress:null,

    bottom:null,

    outer:null,

    hair:null,

    accessory:null,

    shoes:null

  };

}


/* ==================================================
   SAVE
   ※容量オーバーでも警告しない
================================================== */

function saveData(){

  try{

    localStorage.setItem(
      "dressup_base",
      baseImage
    );

    localStorage.setItem(
      "dressup_items",
      JSON.stringify(items)
    );

    localStorage.setItem(
      "dressup_equipped",
      JSON.stringify(equipped)
    );

  }catch(error){

    /*
      保存容量を超えた場合も
      alertは一切表示しない。

      現在の画面上の着せ替えは
      そのまま動作する。
    */

    console.warn(
      "localStorageへの保存に失敗しました"
    );

  }

}


/* ==================================================
   LOAD
================================================== */

function loadData(){

  try{

    const savedBase =
      localStorage.getItem(
        "dressup_base"
      );

    const savedItems =
      localStorage.getItem(
        "dressup_items"
      );

    const savedEquipped =
      localStorage.getItem(
        "dressup_equipped"
      );


    if(savedBase){

      baseImage =
        savedBase;

    }


    if(savedItems){

      try{

        const parsed =
          JSON.parse(
            savedItems
          );

        if(
          Array.isArray(parsed)
        ){

          items =
            parsed;

        }

      }catch(error){

        items = [];

      }

    }


    if(savedEquipped){

      try{

        const parsed =
          JSON.parse(
            savedEquipped
          );

        if(
          parsed &&
          typeof parsed ===
            "object"
        ){

          equipped = {

            ...createEmptyEquipped(),

            ...parsed

          };

        }

      }catch(error){

        equipped =
          createEmptyEquipped();

      }

    }

  }catch(error){

    /*
      読み込みエラーも
      ユーザーには表示しない
    */

    console.warn(
      "データ読み込みに失敗しました"
    );

  }

}


/* ==================================================
   BASE RENDER
================================================== */

function renderBase(){

  if(baseImage){

    baseLayer.src =
      baseImage;

    baseLayer.style.display =
      "block";

  }else{

    baseLayer.removeAttribute(
      "src"
    );

    baseLayer.style.display =
      "none";

  }

}


/* ==================================================
   LAYER RENDER
================================================== */

function renderLayer(
  category
){

  const layer =
    document.getElementById(
      category + "Layer"
    );

  if(!layer){

    return;

  }


  const id =
    equipped[category];


  if(!id){

    layer.removeAttribute(
      "src"
    );

    layer.style.display =
      "none";

    return;

  }


  const item =
    items.find(
      x => x.id === id
    );


  if(!item){

    layer.removeAttribute(
      "src"
    );

    layer.style.display =
      "none";

    return;

  }


  layer.src =
    item.image;

  layer.style.display =
    "block";

}


function renderAll(){

  renderBase();


  Object.keys(
    CATEGORIES
  ).forEach(
    category => {

      renderLayer(
        category
      );

    }
  );

}


/* ==================================================
   TRANSPARENT IMAGE CROP
================================================== */

function trimTransparentImage(
  src,
  callback
){

  const img =
    new Image();


  img.onload =
    function(){

      try{

        const canvas =
          document.createElement(
            "canvas"
          );


        const ctx =
          canvas.getContext(
            "2d"
          );


        canvas.width =
          img.naturalWidth;

        canvas.height =
          img.naturalHeight;


        ctx.drawImage(
          img,
          0,
          0
        );


        const data =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          ).data;


        let minX =
          canvas.width;

        let minY =
          canvas.height;

        let maxX =
          -1;

        let maxY =
          -1;


        for(
          let y=0;
          y<canvas.height;
          y++
        ){

          for(
            let x=0;
            x<canvas.width;
            x++
          ){

            const alpha =
              data[
                (y * canvas.width + x) * 4 + 3
              ];


            if(alpha > 5){

              if(x < minX)
                minX = x;

              if(y < minY)
                minY = y;

              if(x > maxX)
                maxX = x;

              if(y > maxY)
                maxY = y;

            }

          }

        }


        if(maxX === -1){

          callback(src);

          return;

        }


        const width =
          maxX - minX + 1;

        const height =
          maxY - minY + 1;


        const cropCanvas =
          document.createElement(
            "canvas"
          );


        cropCanvas.width =
          width;

        cropCanvas.height =
          height;


        const cropCtx =
          cropCanvas.getContext(
            "2d"
          );


        cropCtx.drawImage(

          img,

          minX,
          minY,

          width,
          height,

          0,
          0,

          width,
          height

        );


        callback(
          cropCanvas.toDataURL(
            "image/png"
          )
        );


      }catch(error){

        callback(src);

      }

    };


  img.onerror =
    function(){

      callback(src);

    };


  img.src =
    src;

}

/* ==================================================
   OPEN ITEM MODAL
================================================== */

function openItemModal(
  category
){

/* ==================================================
   ITEM LIST
================================================== */

function renderItemList(){

  itemList.innerHTML =
    "";


  const categoryItems =
    items.filter(
      item =>
        item.category ===
        currentCategory
    );


  if(
    categoryItems.length === 0
  ){

    itemList.innerHTML = `

      <div class="empty">

        このカテゴリーには<br>

        まだアイテムがありません

      </div>

    `;

    return;

  }


  categoryItems.forEach(
    item => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "itemCard";


      if(
        equipped[
          currentCategory
        ] === item.id
      ){

        card.classList.add(
          "selected"
        );

      }


      /* IMAGE */

      const imageBox =
        document.createElement(
          "div"
        );

      imageBox.className =
        "itemImageBox";


      const image =
        document.createElement(
          "img"
        );

      image.className =
        "itemImage";

      image.alt =
        "";


      trimTransparentImage(
        item.image,
        trimmed => {

          image.src =
            trimmed;

        }
      );


      imageBox.appendChild(
        image
      );


      /* NAME */

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "itemName";

      name.textContent =
        item.name;


      /* PRICE */

      const price =
        document.createElement(
          "div"
        );

      price.className =
        "itemPrice";

      price.textContent =
        `🪙 ${item.price}コイン`;


      /* DELETE */

      const deleteBtn =
        document.createElement(
          "button"
        );

      deleteBtn.type =
        "button";

      deleteBtn.className =
        "itemDelete";

      deleteBtn.textContent =
        "×";


      deleteBtn.addEventListener(
        "click",
        function(event){

          event.preventDefault();

          event.stopPropagation();

          deleteItem(
            item.id
          );

        }
      );


      card.appendChild(
        imageBox
      );

      card.appendChild(
        name
      );

      card.appendChild(
        price
      );

      card.appendChild(
        deleteBtn
      );


      /* 着用 */

      card.addEventListener(
        "click",
        function(event){

          event.preventDefault();

          event.stopPropagation();

          wearItem(
            item
          );

        }
      );


      itemList.appendChild(
        card
      );

    }
  );

}


/* ==================================================
   WEAR ITEM
================================================== */

function wearItem(item){

  const category =
    item.category;


  /*
    同じアイテムを
    もう一度タップ
    → 脱ぐ
  */

  if(
    equipped[category] ===
    item.id
  ){

    equipped[category] =
      null;


    saveData();

    renderAll();

    renderItemList();

    return;

  }


  /* ==================================================
     ONEPIECE
  ================================================== */

  if(
    category === "onepiece"
  ){

    equipped.onepiece =
      item.id;

    equipped.dress =
      null;

    equipped.top =
      null;

    equipped.bottom =
      null;

  }


  /* ==================================================
     DRESS
  ================================================== */

  else if(
    category === "dress"
  ){

    equipped.dress =
      item.id;

    equipped.onepiece =
      null;

    equipped.top =
      null;

    equipped.bottom =
      null;

  }


  /* ==================================================
     TOP
  ================================================== */

  else if(
    category === "top"
  ){

    equipped.top =
      item.id;

    equipped.onepiece =
      null;

    equipped.dress =
      null;

  }


  /* ==================================================
     BOTTOM
  ================================================== */

  else if(
    category === "bottom"
  ){

    equipped.bottom =
      item.id;

    equipped.onepiece =
      null;

    equipped.dress =
      null;

  }


  /* ==================================================
     OTHER
  ================================================== */

  else{

    equipped[category] =
      item.id;

  }


  saveData();

  renderAll();

  renderItemList();

}


/* ==================================================
   DELETE ITEM
================================================== */

function deleteItem(id){

  const item =
    items.find(
      x => x.id === id
    );


  if(!item){

    return;

  }


  const ok =
    confirm(
      `「${item.name}」を削除しますか？`
    );


  if(!ok){

    return;

  }


  Object.keys(
    equipped
  ).forEach(
    category => {

      if(
        equipped[category] ===
        id
      ){

        equipped[category] =
          null;

      }

    }
  );


  items =
    items.filter(
      x => x.id !== id
    );


  saveData();

  renderAll();

  renderItemList();

}

/* ==================================================
   ADD ITEM
================================================== */

document
  .getElementById(
    "itemSaveBtn"
  )
  .addEventListener(
    "click",
    function(event){

      event.preventDefault();

      event.stopPropagation();


      const name =
        document
          .getElementById(
            "itemName"
          )
          .value
          .trim();


      const category =
        document
          .getElementById(
            "itemCategory"
          )
          .value;


      const price =
        Number(
          document
            .getElementById(
              "itemPrice"
            )
            .value
        );


      const file =
        document
          .getElementById(
            "itemFile"
          )
          .files[0];


      if(!name){

        alert(
          "アイテム名を入力してください"
        );

        return;

      }


      if(!file){

        alert(
          "アイテム画像を選択してください"
        );

        return;

      }


      if(
        !Number.isFinite(price) ||
        price < 0
      ){

        alert(
          "価格を正しく入力してください"
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(e){

          const item = {

            id:
              "item_" +
              Date.now() +
              "_" +
              Math.random()
                .toString(36)
                .slice(2),

            name:
              name,

            category:
              category,

            /*
              価格は表示用のみ
            */

            price:
              price,

            image:
              e.target.result

          };


          items.push(
            item
          );


          /*
            保存できなくても
            警告は表示しない
          */

          saveData();


          /* リセット */

          document
            .getElementById(
              "itemName"
            )
            .value = "";


          document
            .getElementById(
              "itemPrice"
            )
            .value = "100";


          document
            .getElementById(
              "itemFile"
            )
            .value = "";


          settingModal.classList.remove(
            "show"
          );


          /* 追加したカテゴリーを表示 */

          currentCategory =
            category;


          document
            .querySelectorAll(
              ".categoryBtn"
            )
            .forEach(
              btn => {

                btn.classList.toggle(

                  "active",

                  btn.dataset.category ===
                  category

                );

              }
            );


          openItemModal(
            category
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

   MODAL OUTSIDE TAP
================================================== */

[
  baseModal,
  settingModal
].forEach(
  modal => {

    modal.addEventListener(
      "click",
      function(event){

        if(
          event.target ===
          modal
        ){

          modal.classList.remove(
            "show"
          );

        }

      }
    );

  }
);
